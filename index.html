  'bda-triggers': {
    matiere: "Bases de données avancées",
    chapitre: "Triggers (SGBD actif)",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>Triggers.pdf</li></ul></div><h3 class=\"fiche-h1\">1. SGBD passif vs SGBD actif</h3><p class=\"fiche-p\">Un SGBD passif se contente de stocker et restituer l'information : tout le contrôle (verifications, reactions) est code dans les programmes d'application. Un SGBD actif va plus loin : il decrit lui-meme des evenements pertinents et des reactions a activer automatiquement quand ces evenements se produisent, sans devoir dupliquer cette logique dans chaque application cliente.</p><h3 class=\"fiche-h1\">2. Les limites du SQL standard</h3><p class=\"fiche-p\">SQL permet deja des contraintes simples dans le schema : NOT NULL, UNIQUE, FOREIGN KEY...REFERENCES..., CHECK, ainsi que des reactions predefinies (ON DELETE/ON UPDATE : NO ACTION, CASCADE, SET DEFAULT, SET NULL). Mais ces mecanismes ne suffisent pas pour des contraintes metier complexes.</p><p class=\"fiche-note\">Exemple donne en cours (cas du Zoo) : un employe gardien ne peut pas cumuler ce role avec celui de responsable ; des animaux ne peuvent pas etre places dans une cage non gardee. Ce type de regle metier depasse ce que CHECK/FOREIGN KEY peuvent exprimer.</p><h3 class=\"fiche-h1\">3. Les regles actives (regles ECA)</h3><p class=\"fiche-p\">Une regle active suit le schema Evenement-Condition-Action : LORSQUE l'evenement E se produit, SI la condition C est verifiee, ALORS executer l'action A.</p><table class=\"fiche-table\"><thead><tr><th>Composant</th><th>Exemples</th></tr></thead><tbody><tr><td>Evenement</td><td>Modification de donnees (insert/delete/update), interrogation (select), evenement temporel (date fixe, periodique), ou defini par l'application (ex: temperature trop elevee).</td></tr><tr><td>Condition</td><td>Predicat sur la base (clause WHERE), requete SQL (resultat vide/non vide), fonction d'agregation, procedure ad-hoc renvoyant Vrai/Faux.</td></tr><tr><td>Action</td><td>Operation de modification (insert/delete/update), appel de methode, exception, rollback/commit/abort, gestion de privileges, procedure ad-hoc.</td></tr></tbody></table><p class=\"fiche-p\">Les evenements peuvent aussi etre composes via des operateurs logiques (AND, OR, NOT), des sequences logiques (avant/apres) ou temporelles (ex : 5 secondes apres e1).</p><p class=\"fiche-p\">Algorithme general de declenchement : tant qu'il existe une regle declenchable, on la prend, on evalue sa condition, et si elle est vraie on execute l'action.</p><h3 class=\"fiche-h1\">4. Organisation et pilotage des regles</h3><ul class=\"fiche-ul\"><li>Un meme evenement peut declencher plusieurs regles a la fois, d'ou la necessite de priorites (statiques : 1ere, 2eme... ou relatives : celle-ci avant celle-la).</li><li>Moment d'examen des regles : des qu'un evenement survient, apres changement d'etat, a la fin de la transaction, periodiquement, ou a la demande.</li><li>Risque de non-terminaison : l'algorithme de declenchement peut boucler (cycle dans le graphe de declenchement). Solutions : laisser faire, fixer un nombre maximal de regles executees, interdire qu'une regle en active une autre, ou restreindre les activations en chaine au sein d'un groupe.</li></ul><h3 class=\"fiche-h1\">5. Utilisations pratiques des regles actives</h3><ul class=\"fiche-ul\"><li>Verification de contraintes d'integrite (avantage : on ne verifie que les donnees concernees, avec action corrective possible).</li><li>Maintien de la coherence des vues (virtuelles, materialisees) — gestion de donnees derivees.</li><li>Gestion de versions et de replication (propagation des modifications, regles d'evolution).</li><li>Archivage, evolution de schema.</li></ul><p class=\"fiche-p\">Generation semi-automatique de regles d'integrite : (1) identifier les causes possibles de violation -> evenements, (2) formule declarative de la contrainte -> condition, (3) actions reparatrices -> actions. Approche simple : regles d'avortement (si violation, ROLLBACK) — mais cela genere beaucoup de rollbacks. Alternative plus complexe : regles de reparation.</p><p class=\"fiche-note\">Attention : les contraintes d'integrite elles-memes doivent etre analysees pour verifier qu'elles sont coherentes entre elles, non redondantes, et minimales.</p><h3 class=\"fiche-h1\">6. Les triggers Oracle : bases de PL/SQL</h3><p class=\"fiche-p\">Un trigger est un programme resident dans la base, associe a un evenement sur une table, declenche automatiquement, et programme en PL/SQL (extension procedurale d'Oracle au SQL). Un trigger permet par exemple de definir une politique de securite complexe, des attributs calcules, d'implementer des contraintes metier, ou d'archiver automatiquement des informations.</p><pre class=\"fiche-code\">DECLARE\n  -- declarations de variables, types, exceptions\nBEGIN\n  -- code PL/SQL avec ou sans SQL\nEXCEPTION\n  -- gestion des erreurs du SGBD\nEND;</pre><h3 class=\"fiche-h1\">7. Structure complete d'un trigger LMD</h3><p class=\"fiche-p\">Un declencheur se compose de 7 parties :</p><ul class=\"fiche-ul\"><li>Commande de creation : CREATE OR REPLACE TRIGGER nomTrigger</li><li>Information temporelle : BEFORE | AFTER</li><li>Type d'evenement : DELETE | INSERT | UPDATE [OF attribut] (disjonction possible : OR)</li><li>Table concernee : ON nomTable (une seule a la fois)</li><li>Mode : [FOR EACH ROW] (mode ligne) ou absent (mode table)</li><li>Condition de declenchement optionnelle : WHEN condition</li><li>Code PL/SQL : DECLARE...BEGIN...END</li></ul><p class=\"fiche-note\">Restrictions importantes : un trigger doit rester court (faire appel a des procedures plutot que tout coder dedans), eviter la recursivite/l'enchainement de triggers, et surtout AUCUNE gestion de transaction dans le code (COMMIT, ROLLBACK, SAVEPOINT sont interdits dans un trigger). Un trigger est actif des sa creation ; ALTER TRIGGER ... DISABLE/ENABLE permet de l'activer/desactiver, DROP TRIGGER le supprime.</p><h3 class=\"fiche-h1\">8. Trigger de type TABLE vs trigger de type LIGNE</h3><table class=\"fiche-table\"><thead><tr><th>Type</th><th>Granularite</th><th>Caracteristiques</th></tr></thead><tbody><tr><td>Table</td><td>La table entiere</td><td>Le code s'execute UNE fois pour l'instruction SQL globale, quel que soit le nombre de lignes touchees. Pas d'acces a :NEW/:OLD.</td></tr><tr><td>Ligne (FOR EACH ROW)</td><td>Chaque ligne affectee</td><td>Le code s'execute une fois PAR ligne modifiee. Acces a :NEW (tuple insere/modifie) et :OLD (tuple supprime ou etat avant modification), utilisables comme une table. Pose des verrous : impossible d'interroger la table elle-meme dans le corps du trigger.</td></tr></tbody></table><p class=\"fiche-p\">La clause WHEN permet d'eviter l'execution inutile (couteuse) d'un trigger, en remontant une condition hors du code PL/SQL.</p><pre class=\"fiche-code\">CREATE TRIGGER periodeOK\nBEFORE DELETE OR UPDATE OR INSERT ON etudiants\nWHEN to_char(sysdate,'DAY') IN ('SAMEDI','DIMANCHE')\nBEGIN\n  raise_application_error(-20101, 'Acces impossible le week-end !');\nEND;</pre><pre class=\"fiche-code\">CREATE TRIGGER archiverEtudiants\nAFTER DELETE ON etudiants\nFOR EACH ROW\nBEGIN\n  INSERT INTO archive VALUES(:old.num, :old.name, :old.prenom, :old.inscr);\nEND;</pre><h3 class=\"fiche-h1\">9. Le probleme des tables mutantes (mutating table)</h3><p class=\"fiche-p\">Un trigger en mode LIGNE interdit d'interroger la table qui a declenche l'evenement : elle est dite 'en mutation'. Exemple : un trigger BEFORE INSERT FOR EACH ROW qui fait un SELECT COUNT(*) FROM etudiants pour verifier qu'il n'y a pas plus de 1000 etudiants declenche l'erreur ORA-04091 (mutating table) au lieu du message attendu.</p><h4 class=\"fiche-h2\">Solutions au probleme des tables mutantes</h4><ul class=\"fiche-ul\"><li>Repasser le trigger en mode TABLE (sans FOR EACH ROW) quand c'est possible : on perd l'acces a :NEW/:OLD, mais on peut interroger librement la table.</li><li>Changer le moment d'evaluation (passer de BEFORE a AFTER insert/update, sans FOR EACH ROW) et adapter la requete pour tester la coherence globale de la base plutot qu'une seule ligne.</li><li>Solution table temporaire : un trigger ligne recopie les modifications dans une table temporaire, un trigger table exploite ensuite cette table temporaire pour verifier la coherence. Complexe a mettre en oeuvre.</li><li>Solution 'ne rien faire' : capturer l'exception systeme ORA-04091 dans une exception utilisateur et renvoyer un message simple (code creux).</li></ul><p class=\"fiche-note\">Certains cas complexes (ex : verifier l'absence de doublon nom+adresse) justifient malgre tout de garder un trigger en mode ligne, quitte a devoir ruser pour contourner le probleme de mutation.</p><h3 class=\"fiche-h1\">10. Triggers LDD et optimisation</h3><p class=\"fiche-p\">Les triggers LDD reagissent a des modifications du dictionnaire de donnees (DROP, CREATE...) : BEFORE|AFTER DROP|CREATE ON nom_base.SCHEMA.</p><p class=\"fiche-p\">Bonnes pratiques d'optimisation : garder l'execution courte, limiter le nombre de triggers en regroupant les controles de coherence dans un meme trigger, et utiliser le regroupement d'evenements avec les predicats INSERTING / UPDATING('colonne') / DELETING pour distinguer le cas dans le code.</p><p class=\"fiche-p\">Ordre d'execution theorique quand plusieurs triggers se declenchent en meme temps (ordre difficile a garantir en pratique) : tous les triggers TABLE BEFORE -> analyse des lignes affectees -> tous les triggers LIGNE BEFORE -> verrouillage + verification des contraintes -> tous les triggers LIGNE AFTER -> verifications des contraintes differees -> tous les triggers TABLE AFTER.</p>",
    fiche: "<h3 class=\"fiche-h1\">SGBD passif vs actif</h3><ul class=\"fiche-ul\"><li>Passif : le controle est code dans les applications.</li><li>Actif : le SGBD gere lui-meme evenements + reactions automatiques.</li></ul><h3 class=\"fiche-h1\">Regle ECA</h3><p class=\"fiche-p\">Evenement (LORSQUE) - Condition (SI) - Action (ALORS).</p><h3 class=\"fiche-h1\">Structure d'un trigger (7 parties)</h3><ul class=\"fiche-ul\"><li>CREATE OR REPLACE TRIGGER nom</li><li>BEFORE | AFTER</li><li>DELETE | INSERT | UPDATE [OF col]</li><li>ON table (une seule)</li><li>[FOR EACH ROW] = mode ligne, sinon mode table</li><li>WHEN condition (optionnel)</li><li>DECLARE...BEGIN...END</li></ul><h3 class=\"fiche-h1\">Interdits dans un trigger</h3><p class=\"fiche-p\">Pas de COMMIT / ROLLBACK / SAVEPOINT dans le corps d'un trigger.</p><h3 class=\"fiche-h1\">Table vs Ligne</h3><table class=\"fiche-table\"><thead><tr><th>Mode</th><th>Granularite</th><th>Acces :NEW/:OLD</th></tr></thead><tbody><tr><td>Table</td><td>Toute la requete, 1 execution</td><td>Non</td></tr><tr><td>Ligne (FOR EACH ROW)</td><td>Par ligne affectee</td><td>Oui, mais table elle-meme verrouillee</td></tr></tbody></table><h3 class=\"fiche-h1\">Probleme des tables mutantes</h3><p class=\"fiche-p\">Un trigger LIGNE ne peut pas interroger sa propre table (ORA-04091). Solutions : passer en mode TABLE, changer BEFORE en AFTER, table temporaire, ou capturer l'exception.</p><h3 class=\"fiche-h1\">Ordre d'execution (theorique)</h3><p class=\"fiche-p\">Triggers TABLE BEFORE -> LIGNE BEFORE -> (verrous + contraintes) -> LIGNE AFTER -> TABLE AFTER.</p><h3 class=\"fiche-h1\">Predicats utiles</h3><p class=\"fiche-p\">IF (INSERTING) / IF (UPDATING('col')) / IF (DELETING) dans un trigger a evenements groupes.</p>",
    corriges: "<div class=\"fiche-sources\"><strong>📎 PDF associés :</strong><ul class=\"fiche-ul\"><li>TP_Trigger.pdf (cas Zoo)</li></ul></div><p class=\"fiche-p\">Cas Zoo : LesAnimaux(nomA,...,noCage), LesCages(noCage, fonction, noAllee, nbanim), LesEmployes(nomE, adresse), LesSpecialites(nomE, fonction_cage), LesResponsables(noAllee, nomE), LesGardiens(noCage, nomE).</p><h3 class=\"fiche-h1\">Contrainte 1 — Un seul responsable par allée</h3><p class=\"fiche-p\">Piège de l'énoncé (« il faut bien réfléchir ») : si noAllee est déjà la clé primaire de LesResponsables, cette contrainte est automatiquement garantie par le schéma relationnel lui-même (une clé primaire ne peut pas avoir deux lignes avec la même valeur) — AUCUN trigger n'est nécessaire ici, juste une bonne définition du schéma.</p><h3 class=\"fiche-h1\">Contrainte 2 — Spécialité du responsable compatible avec les cages de l'allée</h3><ul class=\"fiche-ul\"><li>A) Table à surveiller : LesResponsables, événements INSERT et UPDATE.</li><li>B) Condition : aucune cage de l'allée ne doit avoir une fonction absente des spécialités du nouvel employé.</li><li>D) Trigger LIGNE (on a besoin de :new.noAllee et :new.nomE) :</li></ul><pre class=\"fiche-code\">CREATE OR REPLACE TRIGGER trg_respo_specialite\nBEFORE INSERT OR UPDATE ON LesResponsables\nFOR EACH ROW\nDECLARE\n  nb INTEGER;\nBEGIN\n  SELECT COUNT(*) INTO nb\n  FROM LesCages c\n  WHERE c.noAllee = :new.noAllee\n    AND c.fonction NOT IN (\n      SELECT s.fonction_cage FROM LesSpecialites s WHERE s.nomE = :new.nomE\n    );\n  IF nb > 0 THEN\n    RAISE_APPLICATION_ERROR(-20001, 'Aisle Manager Speciality incompatible with Cages');\n  END IF;\nEND;</pre><p class=\"fiche-note\">Pas de problème de table mutante ici : le trigger porte sur LesResponsables mais interroge LesCages et LesSpecialites — deux tables différentes.</p><h3 class=\"fiche-h1\">Contrainte 3 — nbanim toujours synchronisé</h3><ul class=\"fiche-ul\"><li>A) Table à surveiller : LesAnimaux, événements INSERT, UPDATE (de noCage), DELETE.</li><li>B) Condition : aucune — c'est un trigger de calcul, il s'exécute à chaque changement d'affectation.</li><li>D) Trigger LIGNE avec mise à jour relative (+1/-1), comme suggéré par l'énoncé :</li></ul><pre class=\"fiche-code\">CREATE OR REPLACE TRIGGER trg_nbanim\nAFTER INSERT OR UPDATE OF noCage OR DELETE ON LesAnimaux\nFOR EACH ROW\nBEGIN\n  IF INSERTING THEN\n    UPDATE LesCages SET nbanim = nbanim + 1 WHERE noCage = :new.noCage;\n  ELSIF DELETING THEN\n    UPDATE LesCages SET nbanim = nbanim - 1 WHERE noCage = :old.noCage;\n  ELSIF UPDATING('NOCAGE') THEN\n    UPDATE LesCages SET nbanim = nbanim - 1 WHERE noCage = :old.noCage;\n    UPDATE LesCages SET nbanim = nbanim + 1 WHERE noCage = :new.noCage;\n  END IF;\nEND;</pre><p class=\"fiche-note\">La mise à jour RELATIVE (+1/-1) évite de tout recompter avec un COUNT(*) à chaque fois — plus efficace, et évite un recalcul complet à chaque trigger.</p><h3 class=\"fiche-h1\">Contrainte 4 — Un responsable doit être gardien d'une cage de son allée</h3><p class=\"fiche-p\">Deux triggers nécessaires, comme indiqué dans l'énoncé : un qui contrôle quand on NOMME un responsable, un autre qui contrôle quand on modifie les affectations des gardiens (pour ne pas casser la contrainte d'un responsable déjà en poste).</p><h4 class=\"fiche-h2\">4a) Trigger LIGNE sur LesResponsables</h4><pre class=\"fiche-code\">CREATE OR REPLACE TRIGGER trg_respo_est_gardien\nBEFORE INSERT OR UPDATE ON LesResponsables\nFOR EACH ROW\nDECLARE\n  nb INTEGER;\nBEGIN\n  SELECT COUNT(*) INTO nb\n  FROM LesGardiens g, LesCages c\n  WHERE g.noCage = c.noCage AND c.noAllee = :new.noAllee AND g.nomE = :new.nomE;\n  IF nb = 0 THEN\n    RAISE_APPLICATION_ERROR(-20002, 'Aisle Manager not Guardian of a cage in the aisle');\n  END IF;\nEND;</pre><h4 class=\"fiche-h2\">4b) Trigger TABLE (pas FOR EACH ROW) sur LesGardiens</h4><p class=\"fiche-p\">Pourquoi mode TABLE ici et pas mode ligne ? Parce qu'on doit vérifier la cohérence de TOUS les responsables existants après une modification des gardiens — une vérification globale, pas ligne par ligne. En mode ligne, interroger à nouveau LesGardiens poserait un problème de table mutante.</p><pre class=\"fiche-code\">CREATE OR REPLACE TRIGGER trg_gardien_respo_coherence\nAFTER DELETE OR UPDATE ON LesGardiens\nDECLARE\n  nb INTEGER;\nBEGIN\n  SELECT COUNT(*) INTO nb\n  FROM LesResponsables r\n  WHERE NOT EXISTS (\n    SELECT 1 FROM LesGardiens g, LesCages c\n    WHERE g.noCage = c.noCage AND c.noAllee = r.noAllee AND g.nomE = r.nomE\n  );\n  IF nb > 0 THEN\n    RAISE_APPLICATION_ERROR(-20002, 'Aisle Manager not Guardian of a cage in the aisle');\n  END IF;\nEND;</pre><h3 class=\"fiche-h1\">Contrainte 5 (bonus) — Animaux malades séparés des animaux sains</h3><p class=\"fiche-p\">L'énoncé prévient que plusieurs triggers quasi identiques sont nécessaires (un par événement déclencheur possible : ajout d'un animal dans une cage, ajout d'une maladie à un animal déjà en cage). Le principe : avant d'affecter/de rendre malade un animal dans une cage C, vérifier qu'aucun animal sain n'y est déjà, et inversement.</p><p class=\"fiche-note\">Exercice laissé volontairement ouvert (bonus) — le principe est identique aux triggers 2 et 3 : compter les cas incompatibles avec SELECT COUNT(*) puis RAISE_APPLICATION_ERROR si nb>0.</p>"

  'cloud-intro': {
    matiere: "Cloud computing",
    chapitre: "Introduction - definitions et concepts",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>0_presentation_cloud.pdf</li><li>1_intro_terminologie_cloud.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Pourquoi ce cours ?</h3><p class=\"fiche-p\">Objectif : preparer l'entree en entreprise en maitrisant des methodes de travail et des technologies courantes, dont le Cloud Computing, un modele massivement utilise (Facebook, Netflix, Salesforce...).</p><p class=\"fiche-p\">3 axes du cours : (1) Bases du Cloud, types de services IaaS/PaaS/SaaS/FaaS, virtualisation et conteneurisation ; (2) Mise a niveau Git, outils collaboratifs, principes CI/CD ; (3) Techniques du Cloud, virtualisation/conteneurisation (VirtualBox, Docker) et applications cloud-native en microservices.</p><h3 class=\"fiche-h1\">2. Definition du Cloud Computing (NIST)</h3><p class=\"fiche-p\">Le NIST definit le Cloud Computing comme un modele permettant un acces pratique et a la demande, via le reseau, a un ensemble partage de ressources informatiques configurables (reseaux, serveurs, stockage, applications, services), pouvant etre rapidement mises a disposition et liberees avec un minimum d'effort de gestion ou d'interaction avec le fournisseur.</p><ul class=\"fiche-ul\"><li>Ensemble partage de ressources configurables : on loue une capacite de calcul d'un data-centre physique, mutualisee entre plusieurs clients.</li><li>Acces a la demande : on loue des ressources virtuelles via un outil de gestion, automatiquement, en ne payant que le temps d'utilisation.</li><li>Approvisionnement et liberation rapides : on peut liberer les ressources des qu'on n'en a plus besoin.</li></ul><h3 class=\"fiche-h1\">3. La virtualisation, concept cle</h3><p class=\"fiche-p\">Sans virtualisation, une seule application tourne par machine physique, les ressources sont sous-utilisees. Avec virtualisation, plusieurs applications partagent la meme machine physique, ce qui donne une bien meilleure utilisation des ressources. C'est ce principe qui rend le modele Cloud economiquement viable.</p><h3 class=\"fiche-h1\">4. Types d'infrastructures Cloud</h3><table class=\"fiche-table\"><thead><tr><th>Type</th><th>Caracteristiques</th></tr></thead><tbody><tr><td>Cloud prive</td><td>Utilise exclusivement par une organisation. Toujours pertinent pour des donnees sensibles.</td></tr><tr><td>Cloud public</td><td>Disponible pour quiconque veut payer, via un fournisseur. Infrastructure dite multilocataire.</td></tr><tr><td>Cloud hybride</td><td>Melange prive/public : donnees sensibles en prive, le reste en public.</td></tr><tr><td>Multi Cloud</td><td>Utiliser plusieurs fournisseurs de cloud public a la fois.</td></tr></tbody></table><p class=\"fiche-note\">Les Hyperscalers (AWS, Google Cloud, Microsoft Azure) sont les fournisseurs cloud a tres grande echelle.</p><h3 class=\"fiche-h1\">5. Les modeles de service Cloud (\"X as a Service\")</h3><p class=\"fiche-p\">Une hierarchie croissante de sous-traitance : plus on monte dans la pile, plus le fournisseur gere de choses, et moins l'utilisateur a de controle direct.</p><table class=\"fiche-table\"><thead><tr><th>Modele</th><th>Ce que loue l'utilisateur</th><th>Qui gere quoi</th><th>Exemple</th></tr></thead><tbody><tr><td>IaaS</td><td>Infrastructure virtuelle : CPU, memoire, stockage, reseau</td><td>L'utilisateur (admin systeme) gere l'OS, la securite, le serveur web, la BDD</td><td>Google Compute Engine</td></tr><tr><td>PaaS</td><td>Infrastructure + maintenance des logiciels necessaires</td><td>Le fournisseur gere infrastructure et plateforme ; l'utilisateur est developpeur</td><td>Google Cloud Run, App Engine</td></tr><tr><td>SaaS</td><td>Un logiciel complet, accessible depuis un navigateur</td><td>Le fournisseur gere tout ; l'utilisateur n'a presque aucun controle</td><td>Microsoft 365, Google Drive/Meet</td></tr><tr><td>FaaS (Serverless)</td><td>Des fonctions declenchees par des evenements</td><td>Le fournisseur gere tout, on ne paie que le temps d'execution</td><td>AWS Lambda</td></tr></tbody></table><p class=\"fiche-note\">FaaS necessite une facon specifique de developper (microservices).</p><h3 class=\"fiche-h1\">6. Un regard critique sur les technologies Cloud</h3><p class=\"fiche-p\">Le cours insiste sur la parcimonie : beaucoup de traitements analytiques reels (moins de 100 Go) tournent aussi bien sur un simple serveur que sur un cluster complexe, en performance, cout et consommation. Il faut eviter de sur-ingenierer une solution cloud quand ce n'est pas necessaire.</p><p class=\"fiche-p\">Autre point de vigilance evoque en cours : la sur-numerisation peut aussi desservir les utilisateurs (exemple : la dematerialisation de demarches administratives peut rigidifier des processus qui fonctionnaient bien avec un accueil physique).</p>",
    fiche: "<h3 class=\"fiche-h1\">Definition NIST a retenir</h3><p class=\"fiche-p\">Acces a la demande, via le reseau, a un ensemble partage de ressources configurables, rapidement approvisionnees et liberees, avec un minimum de gestion.</p><h3 class=\"fiche-h1\">3 idees de la definition</h3><ul class=\"fiche-ul\"><li>Ressources partagees/mutualisees</li><li>Acces a la demande (self-service, automatique)</li><li>Approvisionnement/liberation rapides</li></ul><h3 class=\"fiche-h1\">Virtualisation</h3><p class=\"fiche-p\">Sans virtualisation = 1 app/machine = sous-utilisation. Avec virtualisation = plusieurs apps/machine = meilleure utilisation.</p><h3 class=\"fiche-h1\">4 types d'infrastructures</h3><table class=\"fiche-table\"><thead><tr><th>Type</th><th>1 phrase</th></tr></thead><tbody><tr><td>Prive</td><td>Exclusif a une organisation (donnees sensibles).</td></tr><tr><td>Public</td><td>Ouvert a tous, multilocataire.</td></tr><tr><td>Hybride</td><td>Melange prive + public.</td></tr><tr><td>Multi Cloud</td><td>Plusieurs fournisseurs publics a la fois.</td></tr></tbody></table><h3 class=\"fiche-h1\">Les 4 modeles \"as a Service\"</h3><table class=\"fiche-table\"><thead><tr><th>Modele</th><th>Utilisateur gere</th><th>Fournisseur gere</th><th>Exemple</th></tr></thead><tbody><tr><td>IaaS</td><td>OS, securite, BDD, serveur web</td><td>Infra physique</td><td>Google Compute Engine</td></tr><tr><td>PaaS</td><td>Le code applicatif</td><td>Infra + plateforme</td><td>Cloud Run, App Engine</td></tr><tr><td>SaaS</td><td>Rien</td><td>Tout</td><td>Microsoft 365, Google Drive</td></tr><tr><td>FaaS</td><td>Le code des fonctions</td><td>Infra + plateforme + execution</td><td>AWS Lambda</td></tr></tbody></table><p class=\"fiche-note\">Ordre croissant de sous-traitance : IaaS < PaaS < FaaS/SaaS.</p><h3 class=\"fiche-h1\">A retenir cote esprit critique</h3><p class=\"fiche-p\">Ne pas sur-ingenierer : un simple serveur suffit souvent (\"You are not Google\").</p>",
    corriges: "<p class=\"fiche-p\">Les exercices sont couverts par les TP (Docker, Proxmox, CI/CD) plutot que par des annales, ils seront ajoutes en fonction des chapitres suivants.</p>"

  'pc-intro': {
    matiere: "Patrons et composants",
    chapitre: "Introduction - la reutilisation logicielle",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>1introduction.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Organisation du cours</h3><p class=\"fiche-p\">Le cours Patrons & Composants (P&C) combine CM, TP/TD et projet : revision UML, revision Java/tests, Design Patterns, Composants/architecture logicielle, Sonar (qualite continue), Spring reactif. Evaluation : DM (rendu hebdomadaire), CC/examen en fevrier, projet en fin de semestre.</p><h3 class=\"fiche-h1\">2. La reutilisation logicielle : le fil conducteur du cours</h3><p class=\"fiche-p\">La reutilisation est l'utilisation d'une partie d'un produit dans un autre produit, avec une fonction potentiellement differente. Elle peut porter sur le code, la documentation, les modeles ou les tests.</p><p class=\"fiche-p\">On distingue la reutilisation par intention (choisie, organisee) de la reutilisation par erreur (accidentelle, souvent risquee).</p><h3 class=\"fiche-h1\">3. Pourquoi reutiliser ? Les motivations</h3><table class=\"fiche-table\"><thead><tr><th>Aspect</th><th>Benefices recherches</th></tr></thead><tbody><tr><td>Reutilisation de l'existant</td><td>Reduction des couts de developpement/conception et de maintenance ; reduction des risques (au prix d'un risque d'integration en echange) : patrons, assemblages de composants, frameworks.</td></tr><tr><td>Developpement pour la reutilisation</td><td>Generer des revenus directs (ex : vendre des composants reutilisables).</td></tr></tbody></table><p class=\"fiche-p\">Autre benefice attendu : une conception generique qui anticipe les evolutions futures, facilite le developpement et la maintenance, permet d'etre reactif a de nouvelles exigences, et de substituer une implementation par une autre plus performante sans tout casser. Les design patterns sont des solutions cles en main pour faire evoluer un design proprement.</p><h3 class=\"fiche-h1\">4. Impact sur la qualite et le cout</h3><p class=\"fiche-p\">Principe rappele en cours : une erreur coute environ 10 fois plus cher a corriger a chaque phase suivante du developpement.</p><table class=\"fiche-table\"><thead><tr><th>Phase</th><th>Cout relatif de correction d'une erreur</th></tr></thead><tbody><tr><td>Specification / conception</td><td>1</td></tr><tr><td>Developpement</td><td>10</td></tr><tr><td>Maintenance</td><td>100</td></tr></tbody></table><p class=\"fiche-note\">D'ou l'interet d'utiliser des designs robustes, simples et deja eprouves (patterns) plutot que de tout reinventer.</p><h3 class=\"fiche-h1\">5. Les grandes familles de solutions vues dans ce cours</h3><ul class=\"fiche-ul\"><li>Les patrons (patterns) : de conception (design patterns), d'analyse (metier)...</li><li>Les composants logiciels</li><li>Les frameworks</li></ul><p class=\"fiche-p\">Ce cours propose un survol de ces techniques, detaillees chapitre par chapitre (UML, design patterns de creation/structurels/comportementaux, composants, Spring...).</p>",
    fiche: "<h3 class=\"fiche-h1\">Definition</h3><p class=\"fiche-p\">Reutilisation = utiliser une partie d'un produit (code, doc, modeles, tests) dans un autre produit, avec une fonction potentiellement differente.</p><ul class=\"fiche-ul\"><li>Par intention (organisee, voulue) vs par erreur (accidentelle).</li></ul><h3 class=\"fiche-h1\">Pourquoi reutiliser, 2 aspects</h3><ul class=\"fiche-ul\"><li>Reutiliser l'existant : baisse des couts dev/maintenance, baisse des risques (mais hausse du risque d'integration).</li><li>Developper POUR la reutilisation : generer des revenus directs (vendre des composants).</li></ul><h3 class=\"fiche-h1\">Regle des couts a connaitre par coeur</h3><table class=\"fiche-table\"><thead><tr><th>Phase</th><th>Cout</th></tr></thead><tbody><tr><td>Specification/conception</td><td>1</td></tr><tr><td>Developpement</td><td>10</td></tr><tr><td>Maintenance</td><td>100</td></tr></tbody></table><p class=\"fiche-note\">D'ou l'interet des design patterns : des solutions robustes et deja eprouvees.</p><h3 class=\"fiche-h1\">3 grandes familles d'outils du cours</h3><ul class=\"fiche-ul\"><li>Patrons (conception, analyse)</li><li>Composants logiciels</li><li>Frameworks</li></ul>",
    corriges: "<p class=\"fiche-p\">Ce chapitre est une introduction sans exercices dedies. Les exercices arriveront avec les chapitres UML et Design Patterns.</p>"

  'ihm-chap1': {
    matiere: "Ingénierie des Interfaces Humain-Machine (IHM)",
    chapitre: 'Chapitre 1 — Principes et definitions generaux',
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>Chapitre 1 - Principes generaux.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Bref historique des systèmes interactifs</h3><p class=\"fiche-p\">Jusque dans les années 80, l'informatique était réservée à des experts formés pour des tâches précises. Depuis, les ordinateurs se sont démocratisés (travail, loisirs, vie quotidienne) et les utilisateurs ne sont plus formés : adapter l'interaction humain-machine est devenu un travail indispensable, difficile et coûteux, sans \"recette miracle\" garantissant le succès.</p><p class=\"fiche-p\">Un ordinateur est une machine automatique de traitement de l'information, obéissant à des programmes (suite d'opérations arithmétiques et logiques), composée d'une unité de calcul et d'une unité de stockage.</p><h4 class=\"fiche-h2\">Quelques dates clés</h4><ul class=\"fiche-ul\"><li>1945 — Vannevar Bush imagine \"Memex\", un gestionnaire de documents (recherche par mots-clés, annotations).</li><li>1963 — Ivan Sutherland crée Sketchpad (icônes, zoom, désignation directe, stylo optique).</li><li>1968 — Douglas Engelbart invente la souris.</li><li>1973 — Xerox Alto : premier ordinateur personnel avec souris, écran graphique, fenêtres et menus.</li><li>1974 — premier éditeur de texte WYSIWYG (Xerox Bravo).</li><li>1981 — Xerox Star : interface à métaphore du bureau — échec commercial.</li><li>1983 — Apple Lisa reprend les mêmes principes, en moins cher.</li></ul><h3 class=\"fiche-h1\">2. Architecture des interfaces utilisateurs (modèle de Seeheim)</h3><p class=\"fiche-p\">En reprenant la définition d'un ordinateur : le \"traitement par une suite d'opérations\" correspond à la programmation (noyau fonctionnel) ; le \"traitement de l'information\" implique des entrées (paramètres fournis par l'utilisateur) et des sorties (résultats présentés). Entrées et sorties passent par des dispositifs physiques (souris, clavier, écran, imprimante...).</p><p class=\"fiche-p\">Le modèle de Seeheim sépare le système en deux grandes parties : les composants d'interaction (qui \"traduisent\" entre le langage de l'utilisateur et celui de la machine) et le noyau fonctionnel de l'application (la logique métier). Une interface utilisateur (UI) est l'ensemble des éléments logiciels et matériels assurant cette communication.</p><h3 class=\"fiche-h1\">3. Le modèle d'activité de Norman</h3><p class=\"fiche-p\">Un utilisateur a un but et agit sur le système pour l'atteindre ; le système répond, l'utilisateur évalue. Ce cycle se décompose en 6 étapes (3 pour l'action, 3 pour l'évaluation) :</p><table class=\"fiche-table\"><thead><tr><th>Phase</th><th>Étapes</th></tr></thead><tbody><tr><td>Action (utilisateur → système)</td><td>1. Formation d'une intention (cognitif) → 2. Spécification d'une suite d'actions (cognitif) → 3. Exécution des actions (moteur)</td></tr><tr><td>Évaluation (système → utilisateur)</td><td>4. Perception de l'état du système (sensoriel) → 5. Interprétation de l'état (cognitif) → 6. Évaluation par rapport au but initial (cognitif)</td></tr></tbody></table><p class=\"fiche-note\">Ce modèle sert souvent à diagnostiquer où un utilisateur \"décroche\" dans une interaction (ex : il ne perçoit pas le changement d'état, ou il ne sait pas quelle action exécuter).</p><h3 class=\"fiche-h1\">4. Les modalités d'interaction</h3><p class=\"fiche-p\">Une modalité se caractérise par un langage et un dispositif physique donnés. On distingue notamment :</p><ul class=\"fiche-ul\"><li>WIMP (Windows, Icons, Menus, Pointers) : clavier + souris + écran, interface graphique classique.</li><li>Interaction tactile : l'écran sert à la fois d'entrée et de sortie.</li><li>Interaction tangible : objets physiques manipulables comme interface.</li><li>Interaction multi-plateforme : l'interaction se poursuit d'un dispositif à l'autre.</li></ul><h3 class=\"fiche-h1\">5. Le domaine de l'IHM (et sa différence avec l'UX)</h3><p class=\"fiche-p\">L'Interaction Homme-Machine (IHM) est l'ensemble des aspects de conception, d'implémentation et d'évaluation d'un système interactif, réalisés pour qu'un humain puisse contrôler et communiquer avec une machine. Elle prend en compte le contexte, l'humain et la technique.</p><p class=\"fiche-p\">L'expérience utilisateur (UX) est proche mais distincte : l'UX désigne une expérience (quelque chose de vécu), qui peut être passive, commence AVANT l'utilisation (attentes créées par la publicité, le bouche-à-oreille...) et peut se prolonger après. L'IHM se concentre sur la période d'utilisation elle-même. Une interface contribue à l'UX sans la déterminer entièrement.</p><h3 class=\"fiche-h1\">6. Utilité vs Utilisabilité</h3><h4 class=\"fiche-h2\">6.1 L'utilité</h4><p class=\"fiche-p\">Capacité d'un dispositif à répondre aux besoins réels des utilisateurs. Certains besoins sont conscients et exprimables ; beaucoup sont inconscients — l'utilisateur propose alors une solution plutôt qu'un besoin, et il faut savoir distinguer les deux pour concevoir une interface réellement utile.</p><h4 class=\"fiche-h2\">6.2 L'utilisabilité (norme ISO 9241-11)</h4><p class=\"fiche-p\">\"Degré selon lequel un produit peut être utilisé, par des utilisateurs identifiés, pour atteindre des buts définis avec efficacité, efficience et satisfaction, dans un contexte d'utilisation spécifié.\"</p><table class=\"fiche-table\"><thead><tr><th>Critère</th><th>Définition</th></tr></thead><tbody><tr><td>Efficacité</td><td>Capacité à atteindre l'objectif donné.</td></tr><tr><td>Efficience</td><td>Capacité à réaliser la tâche avec un minimum d'efforts.</td></tr><tr><td>Satisfaction</td><td>Niveau de confort ressenti par l'utilisateur.</td></tr><tr><td>Apprenabilité*</td><td>Amélioration stable du comportement/processus qui sous-tend l'apprentissage.</td></tr><tr><td>Mémorabilité*</td><td>Consolidation en mémoire des apprentissages.</td></tr><tr><td>Fiabilité</td><td>Capacité à réaliser les tâches sans erreur (pas propre à l'IHM, s'applique à tout le système).</td></tr></tbody></table><p class=\"fiche-note\">*Apprenabilité et mémorabilité sont souvent ajoutées aux 3 critères ISO d'origine. En IHM, on retient généralement les 5 premiers (hors fiabilité).</p><p class=\"fiche-p\">Relations entre critères : un produit efficace n'est pas nécessairement efficient, ni satisfaisant. Un produit très efficient peut être difficile à apprendre. La seule relation garantie : efficient ET facile à apprendre ⇒ efficace.</p><h3 class=\"fiche-h1\">7. Principes de conception en IHM</h3><p class=\"fiche-p\">Concevoir une interface demande des compétences en informatique ET en sciences humaines — d'où des équipes pluridisciplinaires (informaticien, designer, ergonome, sociologue...). Deux piliers indispensables :</p><ul class=\"fiche-ul\"><li>L'intégration active de l'utilisateur pendant la conception (l'humain est trop complexe et changeant pour se fier uniquement à des connaissances théoriques).</li><li>L'itération à chaque étape de conception (chaque contexte de conception étant différent, il faut explorer et vérifier des hypothèses).</li></ul><p class=\"fiche-p\">Trois grandes parties prenantes : les clients (qui commandent l'interface) et les utilisateurs finaux (parfois les mêmes personnes). Trois processus de conception intégrant itération et parties prenantes sont retenus dans ce cours :</p><table class=\"fiche-table\"><thead><tr><th>Processus</th><th>Parties prenantes impliquées</th></tr></thead><tbody><tr><td>Agile</td><td>Les clients (méthode de gestion de projet plutôt que processus de conception à proprement parler).</td></tr><tr><td>Conception centrée utilisateur (UCD)</td><td>Les futurs utilisateurs + une équipe pluridisciplinaire.</td></tr><tr><td>Design thinking</td><td>Les clients, les futurs utilisateurs, une équipe hétérogène = toutes les parties prenantes.</td></tr></tbody></table>",
    fiche: "<h3 class=\"fiche-h1\">Définitions clés</h3><ul class=\"fiche-ul\"><li>IHM : conception + implémentation + évaluation d'un système interactif pour qu'un humain puisse contrôler/communiquer avec une machine.</li><li>UX ≠ IHM : l'UX commence avant l'utilisation (attentes) et peut continuer après ; l'IHM se concentre sur la période d'utilisation.</li><li>Utilité : répondre aux besoins RÉELS (souvent inconscients) des utilisateurs.</li><li>Utilisabilité (ISO 9241-11) : efficacité + efficience + satisfaction, dans un contexte donné.</li></ul><h3 class=\"fiche-h1\">Modèle de Seeheim</h3><p class=\"fiche-p\">Composants d'interaction (traduction utilisateur ↔ machine) séparés du noyau fonctionnel (logique métier).</p><h3 class=\"fiche-h1\">Modèle de Norman — 6 étapes à connaître par cœur</h3><table class=\"fiche-table\"><thead><tr><th>Étape</th><th>Type</th></tr></thead><tbody><tr><td>1. Formation d'une intention</td><td>cognitif</td></tr><tr><td>2. Spécification des actions</td><td>cognitif</td></tr><tr><td>3. Exécution</td><td>moteur</td></tr><tr><td>4. Perception de l'état</td><td>sensoriel</td></tr><tr><td>5. Interprétation</td><td>cognitif</td></tr><tr><td>6. Évaluation vs but initial</td><td>cognitif</td></tr></tbody></table><h3 class=\"fiche-h1\">Les 3 critères ISO + 2 ajoutés</h3><ul class=\"fiche-ul\"><li>Efficacité, Efficience, Satisfaction (norme ISO 9241-11)</li><li>+ Apprenabilité, Mémorabilité (souvent ajoutés)</li><li>Règle à retenir : Efficient + facile à apprendre ⇒ Efficace (seule relation garantie entre critères).</li></ul><h3 class=\"fiche-h1\">Modalités d'interaction</h3><ul class=\"fiche-ul\"><li>WIMP (clavier/souris/écran)</li><li>Tactile (entrée=sortie)</li><li>Tangible (objets physiques)</li><li>Multi-plateforme</li></ul><h3 class=\"fiche-h1\">Les 2 piliers d'une bonne conception</h3><ul class=\"fiche-ul\"><li>Intégration active de l'utilisateur pendant la conception</li><li>Itération à chaque étape</li></ul><h3 class=\"fiche-h1\">3 processus de conception</h3><table class=\"fiche-table\"><thead><tr><th>Processus</th><th>Parties prenantes</th></tr></thead><tbody><tr><td>Agile</td><td>Clients</td></tr><tr><td>UCD</td><td>Futurs utilisateurs + équipe pluridisciplinaire</td></tr><tr><td>Design thinking</td><td>Clients + utilisateurs + équipe hétérogène</td></tr></tbody></table>",
    corriges: "<p class=\"fiche-p\">Les exercices et annales IHM couvrent plusieurs chapitres a la fois : ils seront ajoutes une fois lensemble des chapitres traites.</p>"

  'bda-transactions': {
    matiere: 'Bases de données avancées',
    chapitre: 'Transactions',
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>Transaction.pdf</li><li>niv_isolation.pdf</li><li>TD1-2.pdf</li><li>SpringTransaction.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Pourquoi les transactions ?</h3><p class=\"fiche-p\">Un SGBD doit garantir l'intégrité des données tout en autorisant plusieurs utilisateurs à accéder aux données en même temps. Trois besoins liés justifient la notion de transaction :</p><ul class=\"fiche-ul\"><li>Garantir un état cohérent de la base.</li><li>Contrôler la concurrence entre plusieurs utilisateurs.</li><li>Permettre une reprise après panne.</li></ul><p class=\"fiche-p\">Une transaction est une suite d'opérations (lectures/écritures) qui doit être vue comme une seule unité logique de travail : soit toutes les opérations s'appliquent, soit aucune.</p><p class=\"fiche-example\"><strong>Exemple —</strong> un système de réservation de places de stade lit le nombre de places libres, vérifie qu'il y en a assez, met à jour le nombre de places et débite le solde du client. Si deux clients réservent en même temps sans protection, on peut se retrouver avec plus de places vendues que de places disponibles, ou un débit qui \"disparaît\".</p><h3 class=\"fiche-h1\">2. Les propriétés ACID</h3><table class=\"fiche-table\"><thead><tr><th>Propriété</th><th>Explication</th></tr></thead><tbody><tr><td>Atomicité</td><td>Tout ou rien : soit toutes les opérations de la transaction s'appliquent, soit aucune. Si la transaction échoue en cours de route, tout est annulé (rollback).</td></tr><tr><td>Cohérence</td><td>La transaction fait passer la base d'un état cohérent à un autre. Les contraintes de schéma et les règles métier (ex : \"places restantes ≥ 0\") sont respectées avant et après la transaction.</td></tr><tr><td>Isolation</td><td>Deux transactions concurrentes ne doivent pas se \"voir\" pendant leur exécution : chacune doit se comporter comme si elle s'exécutait seule.</td></tr><tr><td>Durabilité</td><td>Une fois qu'une transaction est validée (COMMIT), ses effets sont définitifs, même en cas de panne juste après.</td></tr></tbody></table><h3 class=\"fiche-h1\">3. Gestion pratique (Oracle / SQL)</h3><ul class=\"fiche-ul\"><li>COMMIT : valide la transaction en cours et en démarre implicitement une nouvelle. Assure la durabilité.</li><li>ROLLBACK : annule toutes les opérations de la transaction, jusqu'au dernier point de sauvegarde (SAVEPOINT) ou, à défaut, jusqu'au dernier COMMIT. Assure l'atomicité.</li><li>Mode AUTOCOMMIT : activé par défaut sous Oracle — chaque instruction est validée individuellement (1 opération = 1 transaction). Il faut le désactiver (SET AUTOCOMMIT OFF) pour regrouper plusieurs opérations dans une même transaction.</li></ul><h3 class=\"fiche-h1\">4. Les 4 problèmes classiques de la concurrence</h3><p class=\"fiche-p\">Quand plusieurs transactions s'exécutent en même temps sans protection, leurs opérations de lecture/écriture s'entrelacent (\"interfoliage\"). Cela peut produire des résultats incohérents, même si chaque transaction est individuellement correcte.</p><h4 class=\"fiche-h2\">4.1 Perte de mise à jour</h4><p class=\"fiche-p\">Deux transactions lisent la même valeur, la modifient chacune de leur côté, puis écrivent : la deuxième écriture écrase la première, dont la modification est perdue.</p><p class=\"fiche-example\"><strong>Exemple —</strong> T1 lit solde=100 et fait solde-10 ; T2 lit solde=100 (avant que T1 n'écrive) et fait solde+100. Si T2 écrit après T1, le -10 de T1 est perdu.</p><h4 class=\"fiche-h2\">4.2 Lecture sale (dirty read)</h4><p class=\"fiche-p\">Une transaction lit une valeur modifiée par une autre transaction qui n'a pas encore validé (ni annulé). Si cette dernière annule finalement ses modifications, la première transaction a travaillé sur une valeur qui n'a jamais \"existé\" officiellement.</p><p class=\"fiche-example\"><strong>Exemple —</strong> T2 met solde+100 (non validé) ; T1 lit ce nouveau solde et fait solde-10 ; T2 annule (rollback) → la base perd la trace de la modification de T2, mais T1 a déjà utilisé cette valeur invalide.</p><h4 class=\"fiche-h2\">4.3 Lecture non reproductible (non-repeatable read)</h4><p class=\"fiche-p\">Une transaction relit une même donnée deux fois et obtient deux valeurs différentes, car une autre transaction l'a modifiée et validée entre les deux lectures. Le cas le plus visible : deux agrégations (SUM, AVG, COUNT) calculées à des instants différents dans la même transaction donnent des résultats incohérents entre eux.</p><h4 class=\"fiche-h2\">4.4 Lecture fantôme (phantom read)</h4><p class=\"fiche-p\">Une transaction ré-exécute une requête qui renvoie un ensemble de lignes, et obtient un ensemble différent (des lignes en plus ou en moins) car une autre transaction a inséré ou supprimé des lignes entre-temps et validé.</p><h3 class=\"fiche-h1\">5. Les niveaux d'isolation SQL</h3><p class=\"fiche-p\">Chaque transaction peut choisir un niveau d'isolation, qui définit quels problèmes ci-dessus sont autorisés ou non. Plus le niveau est strict, plus la concurrence réelle est réduite.</p><table class=\"fiche-table\"><thead><tr><th>Niveau</th><th>Lect. sale</th><th>Lect. non repr.</th><th>Fantôme</th><th>Principe</th></tr></thead><tbody><tr><td>Read Uncommitted</td><td>Oui</td><td>Oui</td><td>Oui</td><td>Aucune protection : lecture non bloquante des données non validées.</td></tr><tr><td>Read Committed</td><td>Non</td><td>Oui</td><td>Oui</td><td>Chaque requête ne voit que les données validées avant son exécution — l'état peut changer entre deux requêtes de la même transaction.</td></tr><tr><td>Repeatable Read</td><td>Non</td><td>Non</td><td>Oui</td><td>Un enregistrement déjà lu ne peut plus être modifié par une autre transaction tant que la première n'a pas terminé — mais de nouvelles lignes peuvent apparaître (fantômes).</td></tr><tr><td>Serializable</td><td>Non</td><td>Non</td><td>Non</td><td>Isolation totale : suit le protocole 2PL strict, la transaction ne voit que l'état au début de son exécution + ses propres écritures.</td></tr></tbody></table><p class=\"fiche-note\">À retenir : de Read Uncommitted vers Serializable, chaque niveau élimine un problème de plus dans l'ordre perte de MAJ/lecture sale → lecture non reproductible → lecture fantôme.</p><h3 class=\"fiche-h1\">6. Sérialisabilité et ordonnancement</h3><p class=\"fiche-p\">Un ordonnancement (ou histoire) est la séquence réelle, entrelacée, des opérations de plusieurs transactions concurrentes. Un ordonnancement est dit sérialisable s'il produit le même résultat qu'une exécution où les transactions se seraient succédées l'une après l'autre (sans jamais se chevaucher).</p><ul class=\"fiche-ul\"><li>Deux opérations sont en conflit si elles portent sur la même donnée et qu'au moins une des deux est une écriture.</li><li>Pas de conflit entre deux lectures, ni entre deux opérations sur des données différentes.</li></ul><h4 class=\"fiche-h2\">6.1 Le graphe de dépendance</h4><p class=\"fiche-p\">Outil pour tester la sérialisabilité : un nœud par transaction, un arc Ti → Tj si Tj lit ou écrit une donnée après que Ti l'ait écrite (ou l'inverse pour une lecture suivie d'une écriture).</p><ul class=\"fiche-ul\"><li>Pas de cycle dans le graphe ⇒ l'ordonnancement est sérialisable (l'ordre des nœuds donne un ordonnancement sériel équivalent).</li><li>Cycle dans le graphe ⇒ l'ordonnancement n'est PAS sérialisable.</li></ul><p class=\"fiche-p\">Limite : le graphe simple ne gère pas bien les écritures \"aveugles\" (sans lecture préalable). On utilise alors un graphe de dépendance labellisé, avec deux nœuds fictifs TE (écriture initiale de toutes les données) et TL (lecture finale de toutes les données), pour trancher les cas ambigus — au prix d'un calcul plus coûteux (jusqu'à 2^m graphes à tester s'il y a m ambiguïtés).</p><h3 class=\"fiche-h1\">7. Le verrouillage (locking)</h3><h4 class=\"fiche-h2\">7.1 Types de verrous</h4><ul class=\"fiche-ul\"><li>Verrou partagé (VL, lecture) : plusieurs transactions peuvent le détenir en même temps sur la même donnée.</li><li>Verrou exclusif (VE, écriture) : une seule transaction à la fois ; incompatible avec tout autre verrou sur la même donnée.</li></ul><p class=\"fiche-p\">Le simple fait de poser des verrous ne suffit PAS à garantir la sérialisabilité : il faut en plus respecter un protocole sur le moment où on les acquiert et on les relâche.</p><h4 class=\"fiche-h2\">7.2 Le verrouillage à deux phases (2PL)</h4><p class=\"fiche-p\">Une transaction respecte le protocole 2PL si toutes ses acquisitions de verrous précèdent toutes ses libérations :</p><ul class=\"fiche-ul\"><li>Phase 1 (croissante) : la transaction acquiert des verrous, n'en libère aucun.</li><li>Phase 2 (décroissante) : la transaction libère des verrous, n'en acquiert plus aucun.</li></ul><p class=\"fiche-p\">Théorème : si toutes les transactions d'un ordonnancement respectent 2PL, alors cet ordonnancement est sérialisable.</p><ul class=\"fiche-ul\"><li>2PL strict : les verrous exclusifs sont gardés jusqu'au COMMIT/ROLLBACK (évite les lectures/écritures sur des données non encore validées).</li><li>2PL rigoureux : TOUS les verrous (partagés et exclusifs) sont gardés jusqu'à la fin — évite complètement les annulations en cascade.</li></ul><p class=\"fiche-p\">Problème des annulations en cascade : si T2 a lu une donnée modifiée (mais pas encore validée) par T1, et que T1 est finalement annulée, alors T2 doit aussi être annulée. Retarder la libération des verrous exclusifs jusqu'au COMMIT (2PL strict) évite ce problème.</p><h4 class=\"fiche-h2\">7.3 Les interblocages (deadlocks)</h4><p class=\"fiche-p\">Un interblocage survient quand deux (ou plus) transactions s'attendent mutuellement pour libérer un verrou.</p><ul class=\"fiche-ul\"><li>Détection : construire un graphe d'attente (un nœud par transaction active, un arc Ti → Tj si Ti attend un verrou détenu par Tj) — un cycle signale un interblocage.</li><li>Résolution a posteriori : timeout, ou annuler intelligemment la transaction la moins coûteuse à défaire, en évitant la famine.</li><li>Prévention : Wait-die — une transaction plus vieille attend, une plus jeune qui bloque une plus vieille est tuée. Wound-wait — une transaction plus vieille \"blesse\" (annule) la plus jeune qui la bloque, une plus jeune attend.</li></ul><h3 class=\"fiche-h1\">8. Contrôle de concurrence par estampillage / MVCC (Oracle)</h3><p class=\"fiche-p\">Oracle utilise un contrôle optimiste multi-versions plutôt qu'un verrouillage systématique en lecture :</p><ul class=\"fiche-ul\"><li>Une lecture ne pose jamais de verrou : elle lit la version de la donnée dont l'estampille est ≤ à celle de la transaction.</li><li>Une écriture pose un verrou exclusif si la donnée n'est pas déjà verrouillée par une transaction plus récente, sinon la transaction est rejetée.</li><li>Au COMMIT, les données modifiées reçoivent une nouvelle estampille correspondant à l'instant de validation.</li></ul><h3 class=\"fiche-h1\">9. Reprise sur panne (recovery)</h3><p class=\"fiche-p\">Un SGBD doit pouvoir restaurer un état correct après une panne, grâce à des sauvegardes périodiques et un journal (log) de toutes les opérations.</p><h4 class=\"fiche-h2\">9.1 Le journal (write-ahead log)</h4><ul class=\"fiche-ul\"><li>Chaque transaction écrit dans le journal : BEGIN, chaque écriture (ancienne et nouvelle valeur), puis COMMIT ou ROLLBACK.</li><li>Write-Ahead Logging : on écrit TOUJOURS dans le journal avant d'écrire dans la base.</li></ul><h4 class=\"fiche-h2\">9.2 Le point de reprise (checkpoint)</h4><p class=\"fiche-p\">Un checkpoint force l'écriture des buffers sur disque, ce qui limite la quantité de journal à relire après une panne. 5 cas de transactions par rapport au checkpoint :</p><ul class=\"fiche-ul\"><li>Validées avant le checkpoint → rien à faire.</li><li>Commencées avant, validées après (avant la panne) → à REFAIRE.</li><li>Commencées avant, toujours en cours à la panne → à DÉFAIRE.</li><li>Commencées et validées après le checkpoint → à REFAIRE.</li><li>Commencées après le checkpoint, en cours à la panne → à DÉFAIRE.</li></ul><h4 class=\"fiche-h2\">9.3 Mise à jour immédiate vs différée</h4><ul class=\"fiche-ul\"><li>Immediate Update : les écritures sont appliquées dès que possible (protégées par le write-ahead log). Risque d'annulations en cascade.</li><li>Deferred Update : les écritures n'atteignent la base qu'au COMMIT. Avantage : rien à défaire si panne avant le COMMIT. Inconvénient : limite la concurrence.</li></ul><h3 class=\"fiche-h1\">10. Les transactions en Spring / JPA (@Transactional)</h3><p class=\"fiche-p\">Spring Boot fournit une gestion déclarative des transactions au-dessus de JDBC/JPA, via l'annotation @Transactional sur une méthode de service.</p><ul class=\"fiche-ul\"><li>@Transactional(readOnly = true) : optimise les accès en lecture seule.</li><li>@Transactional(rollbackFor = ...) : Spring ne fait un ROLLBACK automatique que sur les exceptions listées — attention aux exceptions oubliées !</li></ul><table class=\"fiche-table\"><thead><tr><th>Mode de propagation</th><th>Comportement</th></tr></thead><tbody><tr><td>REQUIRED</td><td>Utilise la transaction existante, sinon en crée une (par défaut).</td></tr><tr><td>REQUIRES_NEW</td><td>Crée toujours une nouvelle transaction, indépendante.</td></tr><tr><td>SUPPORTS</td><td>Utilise la transaction existante si elle existe, sinon s'exécute sans transaction.</td></tr><tr><td>NESTED</td><td>Crée une sous-transaction via un SAVEPOINT si une transaction existe déjà.</td></tr><tr><td>MANDATORY</td><td>Échoue s'il n'existe pas déjà de transaction en cours.</td></tr><tr><td>NEVER</td><td>Échoue si une transaction est déjà en cours.</td></tr><tr><td>NOT_SUPPORTED</td><td>Met en pause la transaction en cours pendant l'exécution de la méthode.</td></tr></tbody></table>",
    fiche: "<h3 class=\"fiche-h1\">ACID</h3><ul class=\"fiche-ul\"><li>Atomicité : tout ou rien (rollback si échec).</li><li>Cohérence : contraintes de schéma + métier respectées avant/après.</li><li>Isolation : chaque transaction se comporte comme si elle était seule.</li><li>Durabilité : après COMMIT, les effets survivent à toute panne.</li></ul><h3 class=\"fiche-h1\">Les 4 anomalies</h3><table class=\"fiche-table\"><thead><tr><th>Anomalie</th><th>En une phrase</th></tr></thead><tbody><tr><td>Perte de MAJ</td><td>2 transactions lisent puis écrivent la même donnée → la 2e écriture écrase la 1re.</td></tr><tr><td>Lecture sale</td><td>On lit une donnée modifiée par une transaction pas encore validée.</td></tr><tr><td>Lecture non reproductible</td><td>Relire la même donnée donne 2 résultats différents.</td></tr><tr><td>Lecture fantôme</td><td>Une requête répétée renvoie des lignes en plus/moins.</td></tr></tbody></table><h3 class=\"fiche-h1\">Niveaux d'isolation — à connaître par cœur</h3><table class=\"fiche-table\"><thead><tr><th>Niveau</th><th>Lect. sale</th><th>Non reprod.</th><th>Fantôme</th></tr></thead><tbody><tr><td>Read Uncommitted</td><td>Oui</td><td>Oui</td><td>Oui</td></tr><tr><td>Read Committed</td><td>Non</td><td>Oui</td><td>Oui</td></tr><tr><td>Repeatable Read</td><td>Non</td><td>Non</td><td>Oui</td></tr><tr><td>Serializable</td><td>Non</td><td>Non</td><td>Non</td></tr></tbody></table><h3 class=\"fiche-h1\">Sérialisabilité</h3><ul class=\"fiche-ul\"><li>Conflit = même donnée + au moins 1 écriture.</li><li>Graphe de dépendance : arc Ti→Tj si conflit ordonné. Cycle = pas sérialisable.</li><li>Graphe labellisé (TE / TL) pour trancher les écritures \"aveugles\".</li></ul><h3 class=\"fiche-h1\">Verrouillage 2PL</h3><ul class=\"fiche-ul\"><li>VL (partagé, lecture) vs VE (exclusif, écriture, incompatible avec tout).</li><li>2PL = acquérir puis relâcher, jamais l'inverse. Respecté partout ⇒ sérialisable.</li><li>2PL strict : verrous exclusifs gardés jusqu'au COMMIT.</li><li>2PL rigoureux : TOUS les verrous gardés jusqu'au COMMIT (évite les cascades).</li></ul><h3 class=\"fiche-h1\">Interblocages</h3><ul class=\"fiche-ul\"><li>Détection : graphe d'attente, cycle = deadlock.</li><li>Résolution : timeout, ou tuer la transaction la moins coûteuse.</li><li>Wait-die : jeune attend une vieille ; vieille bloquée par jeune = jeune tuée.</li><li>Wound-wait : vieille tue la jeune qui la bloque ; jeune attend.</li></ul><h3 class=\"fiche-h1\">Oracle : MVCC / estampillage</h3><ul class=\"fiche-ul\"><li>Lecture = jamais de verrou (lit la version ≤ estampille).</li><li>Écriture = verrou exclusif si libre, sinon attente ou rejet.</li><li>Au COMMIT → nouvelle estampille.</li></ul><h3 class=\"fiche-h1\">Reprise sur panne</h3><ul class=\"fiche-ul\"><li>Write-Ahead Log : toujours écrire dans le journal AVANT la base.</li><li>Checkpoint : force l'écriture sur disque, limite le journal à relire.</li><li>Immediate Update : besoin de LD (à défaire) + LR (à refaire).</li><li>Deferred Update : rien à défaire, seulement à refaire (LR).</li></ul><h3 class=\"fiche-h1\">Spring @Transactional</h3><ul class=\"fiche-ul\"><li>Propagation : REQUIRED (défaut) / REQUIRES_NEW / SUPPORTS / NESTED / MANDATORY / NEVER / NOT_SUPPORTED.</li><li>rollbackFor = Exception.class sinon seules les exceptions listées annulent.</li><li>Isolation : mêmes 4 niveaux SQL.</li></ul>",
    corriges: "<h3 class=\"fiche-h1\">Exercice 1 — Ordonnancement des transactions</h3><h4 class=\"fiche-h2\">A) Anomalies</h4><ul class=\"fiche-ul\"><li>1. L1(x),E1(x),L2(x),E2(y),A1,C2 → ANOMALIE : lecture sale (T2 lit x juste après l'écriture non validée de T1, qui annule ensuite).</li><li>2. L1(x),E1(x),L2(y),E2(y),A1,C2 → pas d'anomalie (données différentes, aucun conflit).</li><li>3. L1(x),L2(x),L2(y),E2(y),L1(z),A1,C2 → pas d'anomalie (T1 ne fait que des lectures).</li><li>4. L1(x),L2(x),E2(x),E1(x),C1,C2 → ANOMALIE : perte de mise à jour (l'écriture de T1, basée sur l'ancienne valeur, écrase celle de T2).</li><li>5. L1(x),L2(x),E2(x),L1(y),C1,C2 → pas d'anomalie (T1 ne réécrit jamais x).</li><li>6. L1(x),E1(x),L2(x),E2(x),C1,C2 → cas limite (motif de lecture sale, mais T1 finit par valider, pas d'incohérence matérialisée ici).</li></ul><h4 class=\"fiche-h2\">B) Sérialisabilité (via le graphe de dépendance)</h4><ul class=\"fiche-ul\"><li>1. Cycle T1↔T2 → NON sérialisable.</li><li>2. Cycle T1↔T2 → NON sérialisable.</li><li>3. Ordre T2, T1, T3 (pas de cycle) → SÉRIALISABLE.</li><li>4. Cycle sur z → NON sérialisable.</li><li>5. Ordre T2, T3, T1 (pas de cycle) → SÉRIALISABLE.</li><li>6. Cycle T1→T2→T3→T1 → NON sérialisable.</li></ul><h3 class=\"fiche-h1\">Exercice 2 — Verrouillage</h3><p class=\"fiche-p\">Ordonnancement : L1(x), L2(y), L3(x), E3(x), E1(y), L2(x), C1, C2, C3</p><h4 class=\"fiche-h2\">A) Conflits et non-sérialisabilité</h4><p class=\"fiche-p\">x : T1→T3 puis T3→T2. y : T2→T1. Cycle T1→T3→T2→T1 → NON sérialisable.</p><h4 class=\"fiche-h2\">B) Exécution par verrouillage à deux phases</h4><p class=\"fiche-p\">T3 obtient x en premier (partagé, compatible avec T1) mais bloque sur son upgrade en exclusif (T1 le détient) ; T1 bloque sur y (détenu par T2) ; T2 termine et valide en premier, débloquant T1, qui valide à son tour et débloque T3.</p><p class=\"fiche-code\">H' = L1(x), L2(y), L3(x), L2(x), C2, E1(y), C1, E3(x), C3</p><p class=\"fiche-p\">Équivalent à l'ordre sériel T2, T1, T3 — cohérent avec le théorème 2PL.</p><h4 class=\"fiche-h2\">C) Annulations en cascade ?</h4><p class=\"fiche-p\">Non : tous les verrous sont gardés jusqu'au COMMIT, aucune transaction ne peut lire le travail non validé d'une autre.</p><h4 class=\"fiche-h2\">D) Autres exécutions (mise en attente sous 2PL)</h4><ul class=\"fiche-ul\"><li>1. Aucune mise en attente : T1 termine et valide avant que T2 ne redemande x.</li><li>2. T3 attend T1 (x) ; T1 attend T2 (y) ; T2 attend T1 (x) → INTERBLOCAGE entre T1 et T2.</li><li>3. T2 attend T1 (x) ; T1 attend T2 et T3 (x) ; T3 attend T1 et T2 (x) ; T5 attend les trois → interblocage croisé T1↔T2 et T1↔T3 ; seule T4 se termine normalement.</li></ul><p class=\"fiche-note\">Pour l'exécution 4 (5 transactions), la méthode est identique — proposer de la tracer ensemble si besoin.</p><h3 class=\"fiche-h1\">Exercice 3 — Interblocage à l'instant 28</h3><p class=\"fiche-p\">En rejouant la table temps par temps :</p><ul class=\"fiche-ul\"><li>T4 attend T2 (b)</li><li>T2 attend T3 (f)</li><li>T3 attend T9 (g)</li><li>T9 attend T8 (h)</li><li>T8 attend T2 (e)</li><li>T12 et T13 attendent T10 (a)</li><li>T11 attend T13 (c)</li></ul><p class=\"fiche-p\">Cycle détecté : T2 → T3 → T9 → T8 → T2 → INTERBLOCAGE (T2, T3, T8, T9). Solutions : détection + annulation de la transaction la moins coûteuse, ou prévention par estampillage (wait-die / wound-wait).</p><p class=\"fiche-note\">Le 2PL garantit la sérialisabilité mais PAS l'absence d'interblocages : un mécanisme séparé est toujours nécessaire.</p><h3 class=\"fiche-h1\">Exercice 4 — Gestion bancaire</h3><p class=\"fiche-p\">T1=Transfert(A,B,100), T2=Crédit(A,200), T3=Débit(B,50).</p><h4 class=\"fiche-h2\">B) Conflits et sérialisabilité</h4><p class=\"fiche-p\">A : T1→T2. B : T3→T1. Graphe T3→T1→T2, pas de cycle → SÉRIALISABLE (ordre T3, T1, T2).</p><h4 class=\"fiche-h2\">C) Exécution 2PL</h4><p class=\"fiche-code\">H' = L1(A), L3(B), E1(A), E3(B), C3, L1(B), E1(B), C1, L2(A), E2(A), C2</p><p class=\"fiche-p\">Correspond exactement à T3, T1, T2. Aucun risque de cascade : chaque transaction attend la validation de la précédente.</p><h3 class=\"fiche-h1\">Exercice 5 — Médecins de garde</h3><ul class=\"fiche-ul\"><li>A) T1 et T2 constatent chacun 3 médecins de garde.</li><li>B) Résultat final : 1 seul médecin de garde (p et m tous deux retirés).</li><li>C) Non sérialisable : si T1 s'exécutait en premier, T2 recalculerait 2 (pas >2) et NE retirerait PAS Michel — l'invariant serait respecté.</li><li>D) En mode sérialisable (écriture bloquée si lue par une autre transaction active) : T1 attend T2 (sur p), T2 attend T1 (sur m) → INTERBLOCAGE, résolu par l'annulation de l'une des deux, qui recalcule alors correctement.</li></ul><h3 class=\"fiche-h1\">Exercice 6 — Verrouillage / estampillage (T1 plus ancienne que T2)</h3><table class=\"fiche-table\"><thead><tr><th>Méthode</th><th>Résultat</th></tr></thead><tbody><tr><td>a) 2PL + détection</td><td>Interblocage détecté (T1 attend B, T2 attend A) → une transaction est annulée puis redémarre.</td></tr><tr><td>b) Wait-die</td><td>T1 (vieille) ATTEND ; T2 (jeune) est TUÉE → T1 termine normalement.</td></tr><tr><td>c) Wound-wait</td><td>T1 (vieille) \"blesse\" T2 immédiatement → T1 continue sans attendre.</td></tr><tr><td>d) Estampillage</td><td>T2 a déjà lu B avant l'écriture de T1 → l'écriture de T1 est REJETÉE (elle est la plus jeune... ici c'est l'inverse : c'est T1 qui est sacrifiée, contrairement à b et c) ; T2 termine normalement.</td></tr></tbody></table><p class=\"fiche-note\">Point clé : (b) et (c) favorisent toujours la transaction la plus ancienne, alors que (d) peut aboutir à l'inverse selon qui a lu quoi en premier.</p><h3 class=\"fiche-h1\">Exercice 7 — Cas concret</h3><ul class=\"fiche-ul\"><li>A) Pascal attend le verrou exclusif de Julie (2PL) ; l'attente finit au Commit ou Rollback de Julie.</li><li>B) Un seul Commit final garde tous les verrous très longtemps (bloque les autres) et fait tout perdre en cas de panne — mieux vaut valider par lots.</li><li>C) Alphonsine a probablement une vue figée (Repeatable Read/Serializable) ou Barnabé n'a pas encore validé — il faut qu'elle termine sa transaction et en relance une nouvelle.</li></ul><h3 class=\"fiche-h1\">Exercice 8 — Reprise sur panne</h3><h4 class=\"fiche-h2\">Journal n°1 — Mise à jour immédiate</h4><ul class=\"fiche-ul\"><li>T1 validée avant checkpoint → rien à faire.</li><li>T4 validée après checkpoint → à REFAIRE.</li><li>T2 et T3 actives à la panne → à DÉFAIRE.</li><li>Pas de risque de cascade (dépendance uniquement vers une transaction déjà validée).</li></ul><h4 class=\"fiche-h2\">Journal n°1 — Mise à jour différée</h4><p class=\"fiche-p\">LR={T4} → REFAIRE. LD={T2,T3} → IGNORÉES (rien n'a touché la base). Pas de phase de défaire nécessaire.</p><h4 class=\"fiche-h2\">Journal n°2</h4><ul class=\"fiche-ul\"><li>a) Immédiate : seule l'écriture de T4 postérieure au checkpoint (F) est à refaire ; T2 et T3 (actives) sont à défaire.</li><li>b) Différée : les DEUX écritures de T4 (E et F) sont à refaire (rien n'atteint la base avant le Commit, checkpoint ou pas) ; T2 et T3 sont simplement ignorées.</li></ul><h3 class=\"fiche-h1\">Cas pratique — Niveaux d'isolation (spectacle / réservation)</h3><h4 class=\"fiche-h2\">READ UNCOMMITTED → lecture sale</h4><p class=\"fiche-code\">T1 lit places_libres=100 → écrit 98 (non validé) | T2 LIT LA VALEUR NON VALIDÉE 98 | T1 échoue → ROLLBACK</p><p class=\"fiche-p\">T2 a basé sa transaction sur une valeur qui n'a jamais officiellement existé.</p><h4 class=\"fiche-h2\">READ COMMITTED → perte de mise à jour malgré des lectures propres</h4><p class=\"fiche-code\">T1 lit 100, T2 lit 100 aussi (avant écriture de T1) | T1 écrit 98 et valide | T2 écrit 95 (basé sur son 100 initial) → écrase le commit de T1</p><h4 class=\"fiche-h2\">REPEATABLE READ → tuple fantôme</h4><p class=\"fiche-code\">T3 lit SUM=12 (2 réservations) | T1 insère une nouvelle réservation et valide | T3 relit SUM=14 (ligne fantôme)</p><h4 class=\"fiche-h2\">SERIALIZABLE → interblocage</h4><p class=\"fiche-code\">T2 verrouille Spectacle puis demande Reservation(client2) | T4 verrouille Reservation(client2) puis demande Spectacle → interblocage</p>"

<script>
const JOURS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const JOURS_LONG = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const KEYS = { cours:"planner:cours", revisions:"planner:revisions", alternance:"planner:alternance", sport:"planner:sport" };
let DATA = { cours:[], revisions:[], alternance:[], sport:[] };
let current = "today";
let loaded = false;
let weekOffset = 0;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return toLocalISO(new Date()); }
function toLocalISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function mondayOf(dateObj){
  const d = new Date(dateObj);
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  d.setHours(0,0,0,0);
  return d;
}
function fmtDateFR(d){
  return d.toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit" });
}
// Remonte l'élément du jour en tête de liste, en conservant l'ordre habituel pour le reste.
function reorderTodayFirst(items, dateOf){
  const today = todayStr();
  const idxToday = items.findIndex(it => dateOf(it) === today);
  if(idxToday <= 0) return items;
  const todayItem = items[idxToday];
  const rest = items.filter((_,i)=>i!==idxToday);
  return [todayItem, ...rest];
}

const IMPORTS = {
  cours:      { version: "v2-alternant-g2",      prefix: "ade",   seed: () => INITIAL_COURS },
  alternance: { version: "v1-calendrier-2026-27", prefix: "alt",   seed: () => INITIAL_ALTERNANCE },
  revisions:  { version: "v1-sessions-examens",   prefix: "rev",   seed: () => INITIAL_REVISIONS },
  sport:      { version: "v2-full-body-hypertrophie", prefix: "sport", seed: () => INITIAL_SPORT }
};

async function loadAll(){
  for(const cat of Object.keys(KEYS)){
    try{
      const res = await window.storage.get(KEYS[cat]);
      DATA[cat] = res ? JSON.parse(res.value) : null;
    }catch(e){ DATA[cat] = null; }
    if(DATA[cat] === null){
      DATA[cat] = IMPORTS[cat] ? IMPORTS[cat].seed().slice() : [];
      await saveCat(cat);
    }
  }

  // Ré-importe automatiquement si une nouvelle version des données pré-remplies est disponible,
  // tout en conservant les éléments ajoutés manuellement.
  for(const cat of Object.keys(IMPORTS)){
    const cfg = IMPORTS[cat];
    let storedVersion = null;
    try{
      const v = await window.storage.get(`planner:${cat}:version`);
      storedVersion = v ? v.value : null;
    }catch(e){ storedVersion = null; }
    if(storedVersion !== cfg.version){
      const manualEntries = DATA[cat].filter(item => !String(item.id).startsWith(cfg.prefix));
      DATA[cat] = cfg.seed().concat(manualEntries);
      await saveCat(cat);
      try{ await window.storage.set(`planner:${cat}:version`, cfg.version); }catch(e){}
    }
  }

  // Chargement du suivi de progression des fiches (indépendant du système d'import)
  try{
    const fp = await window.storage.get("planner:ficheProgress");
    FICHE_PROGRESS = fp ? JSON.parse(fp.value) : {};
  }catch(e){ FICHE_PROGRESS = {}; }

  loaded = true;
  render();
}

async function saveCat(cat){
  try{ await window.storage.set(KEYS[cat], JSON.stringify(DATA[cat])); }
  catch(e){ console.error("Erreur d'enregistrement", e); }
}

function switchTab(cat){
  current = cat;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.cat===cat));
  render();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click", ()=>switchTab(t.dataset.cat)));

function updateCounts(){
  const today = todayStr();
  document.getElementById("count-cours").textContent = (()=>{ const n = DATA.cours.filter(i=>i.date>=today && !i.done).length; return n>0? n : ""; })();
  document.getElementById("count-revisions").textContent = (()=>{ const n = DATA.revisions.filter(i=>!i.done).length; return n>0? n : ""; })();
  document.getElementById("count-alternance").textContent = (()=>{ const n = DATA.alternance.filter(i=>!i.done).length; return n>0? n : ""; })();
  document.getElementById("count-sport").textContent = (()=>{ const n = DATA.sport.filter(i=>!i.done).length; return n>0? n : ""; })();
}

function render(){
  updateCounts();
  const page = document.getElementById("page");
  if(!loaded){ page.innerHTML = '<div class="loading">Ouverture du carnet…</div>'; return; }
  if(current==="today") return renderToday(page);
  if(current==="cours") return renderCours(page);
  if(current==="revisions") return renderRevisions(page);
  if(current==="alternance") return renderAlternance(page);
  if(current==="sport") return renderSport(page);
  if(current==="fiches") return renderFiches(page);
  if(current==="sources") return renderSources(page);
  if(current==="progression") return renderProgression(page);
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function resetBlock(){ return `<div class="reset-link"><button onclick="resetCurrent()">Réinitialiser cette section</button></div>`; }
async function resetCurrent(){
  if(current==="today") return;
  if(!confirm("Effacer tous les éléments de cette section ?")) return;
  DATA[current] = [];
  await saveCat(current);
  render();
}

/* ---------- AUJOURD'HUI ---------- */
function renderToday(page){
  const today = todayStr();
  const now = new Date();
  const todayIdxMon0 = (now.getDay()+6)%7; // 0=lundi
  const todayAbbrev = JOURS[todayIdxMon0];        // "Lun", "Mar", ...
  const todayLong = JOURS_LONG[todayIdxMon0];      // "lundi", "mardi", ...

  const coursAujourdhui = DATA.cours.filter(i=>i.date===today).sort((a,b)=>(a.heureDebut||"").localeCompare(b.heureDebut||""));

  // Révisions : programme du jour (basé sur les cours + sport du jour) + échéances dues/en retard
  const monday = mondayOf(now);
  const todayPlan = buildDayPlan(now).filter(b=>b.type!=="note");
  const revDue = DATA.revisions.filter(i=>!i.done && i.echeance && i.echeance<=today);
  const revCount = todayPlan.filter(b=>b.type!=="repos" && b.type!=="sport").length + revDue.length;

  // Alternance : statut de la semaine en cours

  const altCount = altThisWeek ? 1 : 0;

  // Sport : séance(s) prévue(s) aujourd'hui
  const sportAujourdhui = DATA.sport.filter(i=>i.jour===todayAbbrev);

  let html = `<h1>Aujourd'hui</h1><p class="subtitle">${now.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"})}</p>`;

  </div>`;

  // --- Cours du jour ---
  html += `<div class="section-label">Cours du jour</div><div class="list">`;
  if(coursAujourdhui.length===0){
    html += `<div class="empty">Aucun cours aujourd'hui.</div>`;
  }else{
    coursAujourdhui.forEach(c=>{
      html += `<div class="agenda-item clickable" onclick="openCoursDetail('${c.id}')"><span class="tag cours">${c.heureDebut}</span><span class="txt">${escapeHtml(c.matiere)}</span><span class="meta">${escapeHtml(c.salle||"")}</span></div>`;
    });
  }
  html += `</div>`;

  // --- Révisions du jour ---
  html += `<div class="section-label">Révisions du jour</div><div class="list">`;
  const revBlocks = todayPlan.filter(b=>b.type!=="repos" && b.type!=="sport");
  if(revBlocks.length===0 && revDue.length===0){
    html += `<div class="empty">Rien à réviser aujourd'hui.</div>`;
  }else{
    revBlocks.forEach(b=>{
      const fList = fichesForMatiere(b.matiere);
      const onclick = fList.length>0 ? `openFicheForMatiere('${b.matiere.replace(/'/g,"\\'")}','${b.type}')` : `switchTab('revisions')`;
      const tagLabel = fList.length>0 ? "📄 " + b.heure : b.heure;
      html += `<div class="agenda-item clickable" onclick="${onclick}"><span class="tag revisions">${escapeHtml(tagLabel)}</span><span class="txt">${escapeHtml(b.titre)}</span><span class="meta"></span></div>`;
    });
    revDue.forEach(i=>{
      html += `<div class="agenda-item clickable" onclick="openRevisionDetail('${i.id}')"><span class="tag revisions">Échéance</span><span class="txt">${escapeHtml(i.matiere)}</span><span class="meta">${i.echeance? "à rendre le "+escapeHtml(i.echeance):""}</span></div>`;
    });
  }
  html += `</div>`;

  // --- Alternance ---
  html += `<div class="section-label">Alternance cette semaine</div><div class="list">`;
  if(!altThisWeek){
    html += `<div class="empty">Pas d'information pour cette semaine.</div>`;
  }else{
    html += `<div class="agenda-item clickable" onclick="openAlternanceDetail('${altThisWeek.id}')"><span class="tag alternance">${escapeHtml(altThisWeek.type)}</span><span class="txt">${escapeHtml(altThisWeek.titre||"")}</span><span class="meta"></span></div>`;
  }
  html += `</div>`;

  html += `<div class="section-label">Sport du jour</div><div class="list">`;

function renderCoursList(){
  const content = document.getElementById("cours-content");
  const searchEl = document.getElementById("c-search");
  const q = searchEl ? searchEl.value.trim().toLowerCase() : "";

  if(q){
    const matches = DATA.cours.filter(c =>
      (c.matiere||"").toLowerCase().includes(q) ||
      (c.enseignant||"").toLowerCase().includes(q) ||
      (c.salle||"").toLowerCase().includes(q) ||
      (c.type||"").toLowerCase().includes(q)
    ).sort((a,b)=> a.date.localeCompare(b.date) || (a.heureDebut||"").localeCompare(b.heureDebut||""));
    document.getElementById("week-label").textContent = `${matches.length} résultat(s)`;
    content.innerHTML = matches.length ? matches.map(courseCardHtml).join("") : '<div class="empty">Aucun résultat.</div>';
    return;
  }

  const monday = mondayOf(new Date());
  monday.setDate(monday.getDate() + weekOffset*7);
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(d.getDate()+i);
    days.push(d);
  }
  const sunday = days[6];
  document.getElementById("week-label").textContent = `${fmtDateFR(monday)} – ${fmtDateFR(sunday)}`;

  const today = todayStr();
  const days2 = days.map((d, idx) => ({ d, idx, dStr: toLocalISO(d) }));
  const ordered = reorderTodayFirst(days2, it => it.dStr);
  let html = "";
  let any = false;
  ordered.forEach(({d, idx, dStr})=>{
    const dayCourses = DATA.cours.filter(c=>c.date===dStr).sort((a,b)=>(a.heureDebut||"").localeCompare(b.heureDebut||""));
    if(dayCourses.length===0) return;
    any = true;
    const isToday = dStr===today;
    html += `<div class="day-block ${isToday? "today-highlight":""}" style="${isToday? "border-radius:12px; padding:12px;":""}"><div class="day-heading ${isToday? "today-mark":""}">${JOURS_LONG[idx]} ${fmtDateFR(d)}${isToday? " · aujourd'hui":""}</div>`;
    dayCourses.forEach(c=> html += courseCardHtml(c));
    html += `</div>`;
  });
  content.innerHTML = any ? html : '<div class="empty">Aucun cours cette semaine.</div>';
}

function courseCardHtml(c){
  const metaParts = [c.salle, c.enseignant].filter(Boolean);
  return `<div class="course-card clickable" onclick="openCoursDetail('${c.id}')">
    <div class="course-time">${c.heureDebut||""}${c.heureFin? "–"+c.heureFin:""}</div>
    <div class="course-body">
      <div class="course-title">${escapeHtml(c.matiere||c.type||"")}</div>
      <div class="course-meta">${escapeHtml(metaParts.join(" · "))}</div>
    </div>
    <button class="del" onclick="event.stopPropagation(); deleteItem('cours','${c.id}')" aria-label="Supprimer">✕</button>
  </div>`;
}

// Matières à ignorer dans les rotations de secours (pas de vrai cours ce jour-là)
const EXCLUDE_MATIERE = ["Rentrées","Human Talks","Forum Stages","Rencontre partenariale","Visite entreprise","Spécialisation professionnelle","PIGE - Soutenances","Examens"];
const SEM1_SUBJECTS = [
  "Bases de données avancées",
  "Analyse fontionnelle pour la modélisation de processus",
  "Ingénierie des Interfaces Humain-Machine (IHM)",
  "Processus de développement agiles (PA)",
