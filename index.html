<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon carnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22262B;
    --paper:#EDE6D6;
    --paper-2:#F5F0E4;
    --line:#D8CFB8;
    --line-strong:#22262B;
    --cours:#2F4C7A;      --cours-bg:#DDE6F2;
    --revisions:#A9660A;  --revisions-bg:#F3E3C8;
    --alternance:#3D6B4F; --alternance-bg:#DEEAE1;
    --sport:#9C3540;      --sport-bg:#F2DBDD;
    --muted:#6E6A5E;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink); }
  .app{ display:flex; min-height:100vh; max-width:1040px; margin:0 auto; }
  .sidebar{ display:flex; flex-direction:column; gap:10px; padding:32px 0 32px 18px; width:190px; flex-shrink:0; }
  .brand{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; padding:0 0 20px 6px; letter-spacing:-0.01em; }
  .brand span{ font-style:italic; font-weight:500; color:var(--muted); font-size:15px; display:block; }
  .tab{
    position:relative; border:none; text-align:left; font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    padding:14px 16px 14px 18px; border-radius:10px 0 0 10px; cursor:pointer; color:var(--ink); background:var(--paper-2);
    border:1px solid var(--line); border-right:none; display:flex; align-items:center; gap:10px;
    transform:translateX(0); transition:transform .15s ease;
  }
  .tab:hover{ transform:translateX(-4px); }
  .tab .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .tab[data-cat="today"] .dot{ background:var(--ink); }
  .tab[data-cat="cours"] .dot{ background:var(--cours); }
  .tab[data-cat="revisions"] .dot{ background:var(--revisions); }
  .tab[data-cat="alternance"] .dot{ background:var(--alternance); }
  .tab[data-cat="sport"] .dot{ background:var(--sport); }
  .tab.active{ background:var(--paper); transform:translateX(-8px); border-color:var(--line-strong); z-index:2; }
  .count{ margin-left:auto; font-size:12px; color:var(--muted); font-weight:500; }
  .page{ flex:1; background:var(--paper-2); border-left:1px solid var(--line-strong); padding:36px 40px 60px; min-height:100vh; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:28px; margin:0 0 4px; }
  .subtitle{ color:var(--muted); font-size:14px; margin:0 0 24px; }

  .today-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:30px; }
  .stat-card{ border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--paper); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
  .stat-card:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(34,38,43,0.08); }
  .stat-card .n{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
  .stat-card .l{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .stat-card[data-cat="cours"]{ border-left:4px solid var(--cours); }
  .stat-card[data-cat="revisions"]{ border-left:4px solid var(--revisions); }
  .stat-card[data-cat="alternance"]{ border-left:4px solid var(--alternance); }
  .stat-card[data-cat="sport"]{ border-left:4px solid var(--sport); }

  .section-label{ font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:22px 0 8px; }
  .agenda-item{ display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .agenda-item .tag{ font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; flex-shrink:0; }
  .tag.cours{ background:var(--cours-bg); color:var(--cours); }
  .tag.revisions{ background:var(--revisions-bg); color:var(--revisions); }
  .tag.alternance{ background:var(--alternance-bg); color:var(--alternance); }
  .tag.sport{ background:var(--sport-bg); color:var(--sport); }
  .agenda-item .txt{ flex:1; }
  .agenda-item .meta{ color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .empty{ color:var(--muted); font-size:14px; font-style:italic; padding:14px 4px; }

  .form-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; padding:16px; background:var(--paper); border:1px solid var(--line); border-radius:12px; }
  .form-row input, .form-row select{ font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .form-row input[type="text"]{ flex:2; min-width:140px; }
  .form-row input[type="date"], .form-row input[type="time"]{ flex:1; min-width:110px; }
  .form-row select{ flex:1; min-width:110px; }
  .add-btn{ font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:8px; border:none; color:#fff; cursor:pointer; }
  .add-btn.cours{ background:var(--cours); }
  .add-btn.revisions{ background:var(--revisions); }
  .add-btn.alternance{ background:var(--alternance); }
  .add-btn.sport{ background:var(--sport); }

  .list{ display:flex; flex-direction:column; gap:8px; }
  .item{ display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--paper); border:1px solid var(--line); border-radius:10px; }
  .item.done{ opacity:0.5; }
  .item.done .item-title{ text-decoration:line-through; }
  .check{ width:19px; height:19px; border-radius:50%; border:2px solid var(--line-strong); flex-shrink:0; cursor:pointer; background:transparent; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .item.done .check{ background:var(--ink); }
  .item-body{ flex:1; min-width:0; }
  .item-title{ font-weight:600; font-size:14px; }
  .item-meta{ font-size:12.5px; color:var(--muted); margin-top:1px; }
  .prio{ font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; flex-shrink:0; }
  .prio.haute{ background:#F2DBDD; color:#9C3540; }
  .prio.moyenne{ background:#F3E3C8; color:#A9660A; }
  .prio.basse{ background:#DEEAE1; color:#3D6B4F; }
  .del{ background:none; border:none; cursor:pointer; color:var(--muted); font-size:16px; padding:4px 6px; flex-shrink:0; }
  .del:hover{ color:var(--ink); }

  .loading{ color:var(--muted); font-size:14px; padding:20px 4px; }
  .reset-link{ margin-top:40px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:14px; }
  .reset-link button{ background:none; border:none; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:12px; padding:0; }

  .week-nav{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .week-nav button{ border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:14px; color:var(--ink); }
  .week-nav button:hover{ border-color:var(--line-strong); }
  .week-label{ font-weight:600; font-size:14.5px; flex:1; }
  .week-nav .today-btn{ font-size:12.5px; color:var(--cours); border-color:var(--cours); }
  .search-row{ margin-bottom:16px; }
  .search-row input{ width:100%; font-family:'Inter',sans-serif; font-size:13.5px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .day-block{ margin-bottom:18px; }
  .day-heading{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; margin-bottom:8px; text-transform:capitalize; }
  .day-heading.today-mark{ color:var(--cours); }
  .course-card{ display:flex; gap:12px; padding:12px 14px; background:var(--paper); border:1px solid var(--line); border-radius:10px; margin-bottom:7px; }
  .course-time{ font-weight:600; font-size:13px; color:var(--cours); flex-shrink:0; width:82px; }
  .course-body{ flex:1; min-width:0; }
  .course-title{ font-weight:600; font-size:14px; }

  /* clickable rows */
  .clickable{ cursor:pointer; transition:border-color .12s ease, transform .12s ease; }
  .clickable:hover{ border-color:var(--line-strong); transform:translateX(2px); }

  /* detail modal */
  .detail-overlay{
    position:fixed; inset:0; background:rgba(34,38,43,0.45);
    display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:50;
  }
  .detail-overlay.hidden{ display:none; }
  .detail-card{
    background:var(--paper-2); border-radius:16px; border:1px solid var(--line-strong);
    max-width:480px; width:100%; max-height:85vh; overflow-y:auto;
    padding:28px 30px; box-shadow:0 12px 32px rgba(0,0,0,0.25);
  }
  .detail-close{
    float:right; background:none; border:none; font-size:20px; cursor:pointer;
    color:var(--muted); line-height:1; padding:0 0 0 12px;
  }
  .detail-close:hover{ color:var(--ink); }
  .detail-eyebrow{ font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px; }
  .detail-title{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 18px; padding-right:20px; }
  .detail-row{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row .k{ color:var(--muted); width:110px; flex-shrink:0; font-weight:500; }
  .detail-row .v{ flex:1; }
  .detail-exo{ font-size:13.5px; line-height:1.9; margin-top:6px; }
  .course-meta{ font-size:12.5px; color:var(--muted); margin-top:2px; }
</style>
</head>
<body>
<div class="app">

</div>

</div>

  return d.toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit" });
}

const IMPORTS = {
  cours:      { version: "v2-alternant-g2",      prefix: "ade",   seed: () => INITIAL_COURS },
  alternance: { version: "v1-calendrier-2026-27", prefix: "alt",   seed: () => INITIAL_ALTERNANCE },
  revisions:  { version: "v1-sessions-examens",   prefix: "rev",   seed: () => INITIAL_REVISIONS },
  sport:      { version: "v2-full-body-hypertrophie", prefix: "sport", seed: () => INITIAL_SPORT }
};

async function loadAll(){
  for(const cat of Object.keys(KEYS)){
    try{
      const res = await window.storage.get(KEYS[cat]);
      DATA[cat] = res ? JSON.parse(res.value) : null;
    }catch(e){ DATA[cat] = null; }
    if(DATA[cat] === null){
      DATA[cat] = IMPORTS[cat] ? IMPORTS[cat].seed().slice() : [];
      await saveCat(cat);
    }
  }

  // Ré-importe automatiquement si une nouvelle version des données pré-remplies est disponible,
  // tout en conservant les éléments ajoutés manuellement.
  for(const cat of Object.keys(IMPORTS)){
    const cfg = IMPORTS[cat];
    let storedVersion = null;
    try{
      const v = await window.storage.get(`planner:${cat}:version`);
      storedVersion = v ? v.value : null;
    }catch(e){ storedVersion = null; }
    if(storedVersion !== cfg.version){
      const manualEntries = DATA[cat].filter(item => !String(item.id).startsWith(cfg.prefix));
      DATA[cat] = cfg.seed().concat(manualEntries);
      await saveCat(cat);
      try{ await window.storage.set(`planner:${cat}:version`, cfg.version); }catch(e){}
    }
  }

  loaded = true;
  render();
}

async function saveCat(cat){
  try{ await window.storage.set(KEYS[cat], JSON.stringify(DATA[cat])); }
  catch(e){ console.error("Erreur d'enregistrement", e); }
}

function switchTab(cat){
  current = cat;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.cat===cat));
  render();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click", ()=>switchTab(t.dataset.cat)));

function updateCounts(){
  const today = todayStr();
  document.getElementById("count-cours").textContent = (()=>{ const n = DATA.cours.filter(i=>i.date>=today && !i.done).length; return n>0? n : ""; })();
  document.getElementById("count-revisions").textContent = (()=>{ const n = DATA.revisions.filter(i=>!i.done).length; return n>0? n : ""; })();
  document.getElementById("count-alternance").textContent = (()=>{ const n = DATA.alternance.filter(i=>!i.done).length; return n>0? n : ""; })();
  document.getElementById("count-sport").textContent = (()=>{ const n = DATA.sport.filter(i=>!i.done).length; return n>0? n : ""; })();
}

function render(){
  updateCounts();
  const page = document.getElementById("page");
  if(!loaded){ page.innerHTML = '<div class="loading">Ouverture du carnet…</div>'; return; }
  if(current==="today") return renderToday(page);
  if(current==="cours") return renderCours(page);
  if(current==="revisions") return renderRevisions(page);
  if(current==="alternance") return renderAlternance(page);
  if(current==="sport") return renderSport(page);
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function resetBlock(){ return `<div class="reset-link"><button onclick="resetCurrent()">Réinitialiser cette section</button></div>`; }
async function resetCurrent(){
  if(current==="today") return;
  if(!confirm("Effacer tous les éléments de cette section ?")) return;
  DATA[current] = [];
  await saveCat(current);
  render();
}

/* ---------- AUJOURD'HUI ---------- */
function renderToday(page){
  const today = todayStr();
  const now = new Date();
  const todayIdxMon0 = (now.getDay()+6)%7; // 0=lundi
  const todayAbbrev = JOURS[todayIdxMon0];        // "Lun", "Mar", ...
  const todayLong = JOURS_LONG[todayIdxMon0];      // "lundi", "mardi", ...

  const coursAujourdhui = DATA.cours.filter(i=>i.date===today).sort((a,b)=>(a.heureDebut||"").localeCompare(b.heureDebut||""));

  // Révisions : programme du jour (basé sur les cours + sport du jour) + échéances dues/en retard
  const monday = mondayOf(now);
  const todayPlan = buildDayPlan(now).filter(b=>b.type!=="note");
  const revDue = DATA.revisions.filter(i=>!i.done && i.echeance && i.echeance<=today);
  const revCount = todayPlan.filter(b=>b.type!=="repos" && b.type!=="sport").length + revDue.length;

  // Alternance : statut de la semaine en cours
  const mondayStr = toLocalISO(monday);
  const altThisWeek = DATA.alternance.find(i=>i.date===mondayStr);
  const altCount = altThisWeek ? 1 : 0;

  // Sport : séance(s) prévue(s) aujourd'hui
  const sportAujourdhui = DATA.sport.filter(i=>i.jour===todayAbbrev);

  let html = `<h1>Aujourd'hui</h1><p class="subtitle">${now.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"})}</p>`;
  html += `<div class="today-grid">
    <div class="stat-card" data-cat="cours" onclick="switchTab('cours')"><div class="n">${coursAujourdhui.length}</div><div class="l">cours aujourd'hui</div></div>
    <div class="stat-card" data-cat="revisions" onclick="switchTab('revisions')"><div class="n">${revCount}</div><div class="l">révisions à faire</div></div>
    <div class="stat-card" data-cat="alternance" onclick="switchTab('alternance')"><div class="n">${altCount}</div><div class="l">${altThisWeek? escapeHtml(altThisWeek.type) : "alternance"}</div></div>
    <div class="stat-card" data-cat="sport" onclick="switchTab('sport')"><div class="n">${sportAujourdhui.length}</div><div class="l">séance(s) de sport</div></div>
  </div>`;

  // --- Cours du jour ---
  html += `<div class="section-label">Cours du jour</div><div class="list">`;
  if(coursAujourdhui.length===0){
    html += `<div class="empty">Aucun cours aujourd'hui.</div>`;
  }else{
    coursAujourdhui.forEach(c=>{
      html += `<div class="agenda-item clickable" onclick="openCoursDetail('${c.id}')"><span class="tag cours">${c.heureDebut}</span><span class="txt">${escapeHtml(c.matiere)}</span><span class="meta">${escapeHtml(c.salle||"")}</span></div>`;
    });
  }
  html += `</div>`;

  // --- Révisions du jour ---
  html += `<div class="section-label">Révisions du jour</div><div class="list">`;
  const revBlocks = todayPlan.filter(b=>b.type!=="repos" && b.type!=="sport");
  if(revBlocks.length===0 && revDue.length===0){
    html += `<div class="empty">Rien à réviser aujourd'hui.</div>`;
  }else{
    revBlocks.forEach(b=>{
      html += `<div class="agenda-item clickable" onclick="switchTab('revisions')"><span class="tag revisions">${b.heure}</span><span class="txt">${escapeHtml(b.titre)}</span><span class="meta"></span></div>`;
    });
    revDue.forEach(i=>{
      html += `<div class="agenda-item clickable" onclick="openRevisionDetail('${i.id}')"><span class="tag revisions">Échéance</span><span class="txt">${escapeHtml(i.matiere)}</span><span class="meta">${i.echeance? "à rendre le "+escapeHtml(i.echeance):""}</span></div>`;
    });
  }
  html += `</div>`;

  // --- Alternance ---
  html += `<div class="section-label">Alternance cette semaine</div><div class="list">`;
  if(!altThisWeek){
    html += `<div class="empty">Pas d'information pour cette semaine.</div>`;
  }else{
    html += `<div class="agenda-item clickable" onclick="openAlternanceDetail('${altThisWeek.id}')"><span class="tag alternance">${escapeHtml(altThisWeek.type)}</span><span class="txt">${escapeHtml(altThisWeek.titre||"")}</span><span class="meta"></span></div>`;
  }
  html += `</div>`;

  // --- Sport du jour ---
  html += `<div class="section-label">Sport du jour</div><div class="list">`;
  if(sportAujourdhui.length===0){
    html += `<div class="empty">Pas de séance de sport prévue aujourd'hui.</div>`;
  }else{
    sportAujourdhui.forEach(i=>{
      html += `<div class="agenda-item clickable" onclick="openSportDetail('${i.id}')"><span class="tag sport">${escapeHtml(i.heure||"")}</span><span class="txt">${escapeHtml(i.activite)}</span><span class="meta"></span></div>`;
    });
  }
  html += `</div>`;

  page.innerHTML = html;
}

function renderCoursList(){
  const content = document.getElementById("cours-content");
  const searchEl = document.getElementById("c-search");
  const q = searchEl ? searchEl.value.trim().toLowerCase() : "";

  if(q){
    const matches = DATA.cours.filter(c =>
      (c.matiere||"").toLowerCase().includes(q) ||
      (c.enseignant||"").toLowerCase().includes(q) ||
      (c.salle||"").toLowerCase().includes(q) ||
      (c.type||"").toLowerCase().includes(q)
    ).sort((a,b)=> a.date.localeCompare(b.date) || (a.heureDebut||"").localeCompare(b.heureDebut||""));
    document.getElementById("week-label").textContent = `${matches.length} résultat(s)`;
    content.innerHTML = matches.length ? matches.map(courseCardHtml).join("") : '<div class="empty">Aucun résultat.</div>';
    return;
  }

  const monday = mondayOf(new Date());
  monday.setDate(monday.getDate() + weekOffset*7);
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(d.getDate()+i);
    days.push(d);
  }
  const sunday = days[6];
  document.getElementById("week-label").textContent = `${fmtDateFR(monday)} – ${fmtDateFR(sunday)}`;

  const today = todayStr();
  let html = "";
  let any = false;
  days.forEach((d, idx)=>{
    const dStr = toLocalISO(d);
    const dayCourses = DATA.cours.filter(c=>c.date===dStr).sort((a,b)=>(a.heureDebut||"").localeCompare(b.heureDebut||""));
    if(dayCourses.length===0) return;
    any = true;
    const isToday = dStr===today;
    html += `<div class="day-block"><div class="day-heading ${isToday? "today-mark":""}">${JOURS_LONG[idx]} ${fmtDateFR(d)}${isToday? " · aujourd'hui":""}</div>`;
    dayCourses.forEach(c=> html += courseCardHtml(c));
    html += `</div>`;
  });
  content.innerHTML = any ? html : '<div class="empty">Aucun cours cette semaine.</div>';
}

function courseCardHtml(c){
  const metaParts = [c.salle, c.enseignant].filter(Boolean);
  return `<div class="course-card clickable" onclick="openCoursDetail('${c.id}')">
    <div class="course-time">${c.heureDebut||""}${c.heureFin? "–"+c.heureFin:""}</div>
    <div class="course-body">
      <div class="course-title">${escapeHtml(c.matiere||c.type||"")}</div>
      <div class="course-meta">${escapeHtml(metaParts.join(" · "))}</div>
    </div>
    <button class="del" onclick="event.stopPropagation(); deleteItem('cours','${c.id}')" aria-label="Supprimer">✕</button>
  </div>`;
}

async function addCours(){
  const date = document.getElementById("c-date").value;
  const heureDebut = document.getElementById("c-heure-debut").value;
  const heureFin = document.getElementById("c-heure-fin").value;
  const matiere = document.getElementById("c-matiere").value.trim();

// Matières à ignorer dans les rotations de secours (pas de vrai cours ce jour-là)
const EXCLUDE_MATIERE = ["Rentrées","Human Talks","Forum Stages","Rencontre partenariale","Visite entreprise","Spécialisation professionnelle","PIGE - Soutenances","Examens"];
const SEM1_SUBJECTS = [
  "Bases de données avancées",
  "Analyse fontionnelle pour la modélisation de processus",
  "Ingénierie des Interfaces Humain-Machine (IHM)",
  "Processus de développement agiles (PA)",
  "Patrons et composants",
  "Processus de développement et spécification formelle",
  "Contrôle de gestion",
  "Systèmes d'exploitation et programmation concurrente",
  "Cloud computing"
];
const SEM2_SUBJECTS = [
  "Anglais M1 MIAGE",
  "Projet et UML",
  "Projet développement mobile",
  "Analyse critique et informatique responsable",
  "Gestion financière",
  "Gestion de production",
  "Droit du travail",
  "Droit du numérique"
];
const SEM1_END = new Date("2027-02-02");
let revWeekOffset = 0;

function addMinutes(hhmm, minutes){
  const [h,m] = hhmm.split(":").map(Number);
  const total = h*60 + m + minutes;
  const nh = Math.floor(((total%1440)+1440)%1440 / 60);
  const nm = ((total%60)+60)%60;
  return `${String(nh).padStart(2,"0")}:${String(nm).padStart(2,"0")}`;
}

function coursesOfDay(dateStr){
  return DATA.cours
    .filter(c=>c.date===dateStr && c.matiere && !EXCLUDE_MATIERE.some(k=>c.matiere.includes(k)) && !(c.type||"").includes("PIGE - Tutorat"))
    .sort((a,b)=>(a.heureDebut||"").localeCompare(b.heureDebut||""));
}
function sportOfDay(jourAbbrev){
  return DATA.sport.find(s=>s.jour===jourAbbrev) || null;
}
function fallbackSubject(dateObj){
  const subjects = dateObj < SEM1_END ? SEM1_SUBJECTS : SEM2_SUBJECTS;
  const weekIndex = Math.floor((dateObj - new Date("2026-08-31")) / (7*24*3600*1000));
  return subjects[((weekIndex%subjects.length)+subjects.length)%subjects.length];
}

function buildDayPlan(dateObj){
  const dateStr = toLocalISO(dateObj);
  const jourIdx = (dateObj.getDay()+6)%7;
  const jourAbbrev = JOURS[jourIdx];
  const jourLong = JOURS_LONG[jourIdx];
  const courses = coursesOfDay(dateStr);
  const subjects = [...new Set(courses.map(c=>c.matiere))];
  const sport = sportOfDay(jourAbbrev);
  const lastEnd = courses.length ? courses[courses.length-1].heureFin : null;
  const blocks = [];

  // Dimanche : bilan de la semaine, pas de logique "après les cours"
  if(jourLong === "dimanche"){
    blocks.push({heure:"17h00 – 18h30", titre:"Bilan de la semaine", detail:"Repasser rapidement toutes les matières vues (relecture des fiches, pas de nouvelle matière).", type:"test"});
    return blocks;
  }

  if(sport){
    const sportStart = sport.heure || "18:30";
    const SPORT_DURATION = 75; // 1h15 : efficace pour une séance full body (échauffement + 6 exercices)
    const sportEnd = addMinutes(sportStart, SPORT_DURATION);
    blocks.push({heure:`${sportStart} – ${sportEnd}`, titre:`Sport — ${sport.activite}`, type:"sport"});

    let t = sportEnd;
    let t2 = addMinutes(t, 15);
    blocks.push({heure:`${t} – ${t2}`, titre:"Retour à la maison & douche", type:"repos"});
    t = t2; t2 = addMinutes(t, 45);
    blocks.push({heure:`${t} – ${t2}`, titre:"Cuisiner & dîner", type:"repos"});

    const revStart = t2;
    const s0 = subjects[0] || fallbackSubject(dateObj);
    const s1 = subjects[1] || s0;
    let r1 = addMinutes(revStart, 45);
    blocks.push({heure:`${revStart} – ${r1}`, titre:`Revoir ${s0}`, detail:"Relecture du cours + fiche de synthèse, puis reformulation à voix haute.", type:"revoir"});
    let r2 = addMinutes(r1, 45);
    blocks.push({heure:`${r1} – ${r2}`, titre: subjects.length>1 ? `Exercices ${s1}` : `Exercices ${s0}`, detail:"Exercices ou TD sans le corrigé.", type:"exercices"});
    blocks.push({heure:"", titre:"Séance de révision raccourcie (1h30) pour respecter ton repos après le sport", type:"note"});
    return blocks;
  }

  const restStart = lastEnd || "18:00";
  let revStart = addMinutes(restStart, 60);
  blocks.push({heure:`${restStart} – ${revStart}`, titre:"Pause / repas / repos", type:"repos"});

  const lateStart = parseInt(revStart.split(":")[0],10) >= 21;
  const nbSlots = lateStart ? 2 : 4;

  const s0 = subjects[0] || fallbackSubject(dateObj);
  const s1 = subjects[1] || s0;
  const s2 = subjects[2] || s1;
  const fullSeq = [
    {titre:`Revoir ${s0}`, detail:"Relecture active du cours du jour + fiche de synthèse.", type:"revoir"},
    {titre:`Exercices ${s0}`, detail:"TD/exercices sans le corrigé.", type:"exercices"},
    {titre: subjects.length>1 ? `Revoir ${s1}` : `Exercices ${s0} (approfondissement)`, detail: subjects.length>1 ? "Relecture + fiche de synthèse." : "Exercices plus avancés ou anciens sujets.", type:"revoir"},
    {titre:"Auto-test + bilan de la journée", detail:"Quiz ou questions sans support pour repérer ce qui reste flou.", type:"test"}
  ];
  const seq = fullSeq.slice(0, nbSlots);
  let t = revStart;
  seq.forEach(step=>{
    const t2 = addMinutes(t,60);
    blocks.push({heure:`${t} – ${t2}`, ...step});
    t = t2;
  });
  if(lateStart){
    blocks.push({heure:"", titre:"Journée chargée : séance raccourcie pour préserver le sommeil", type:"note"});
  }
  return blocks;
}

const BLOCK_COLOR = { sport:"var(--sport)", repos:"var(--muted)", revoir:"var(--revisions)", exercices:"var(--revisions)", test:"var(--revisions)", note:"var(--muted)" };

function renderRevWeekPlan(){
  const monday = mondayOf(new Date());
  monday.setDate(monday.getDate() + revWeekOffset*7);
  const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
  document.getElementById("rev-week-label").textContent = `${fmtDateFR(monday)} – ${fmtDateFR(sunday)}`;

  let html = "";
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(d.getDate()+i);
    const blocks = buildDayPlan(d);
    const isToday = toLocalISO(d) === todayStr();
    html += `<div class="day-block"><div class="day-heading ${isToday?"today-mark":""}">${JOURS_LONG[i]} ${fmtDateFR(d)}${isToday? " · aujourd'hui":""}</div>`;
    blocks.forEach(b=>{
      if(b.type==="note"){
        html += `<div class="item-meta" style="margin:2px 4px 8px; font-style:italic;">${escapeHtml(b.titre)}</div>`;
        return;
      }
      html += `<div class="course-card">
        <div class="course-time" style="color:${BLOCK_COLOR[b.type]||"var(--revisions)"}">${escapeHtml(b.heure)}</div>
        <div class="course-body">
          <div class="course-title">${escapeHtml(b.titre)}</div>
          ${b.detail? `<div class="course-meta">${escapeHtml(b.detail)}</div>` : ""}
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById("rev-week-content").innerHTML = html;
}

}

      <select id="a-type">
        <option value="Entreprise">Semaine entreprise</option>
        <option value="École">Semaine école</option>
        <option value="Tâche">Tâche à faire</option>
      </select>
      <input type="text" id="a-titre" placeholder="Détail (ex: rapport, mission...)" />
      <input type="date" id="a-date" />
      <button class="add-btn alternance" onclick="addAlternance()">Ajouter</button>
    </div>
    <div class="list" id="list-alternance"></div>
  `;
  const list = document.getElementById("list-alternance");
  const sorted = [...DATA.alternance].sort((a,b)=> (a.date||"").localeCompare(b.date||""));
  if(sorted.length===0){ list.innerHTML = '<div class="empty">Rien à afficher — ajoute ton rythme ou tes tâches.</div>'; return; }
  list.innerHTML = sorted.map(i=>{
    const meta = `${i.type}${i.date? " · "+i.date:""}`;
    return itemHtml(i,"alternance", meta, i.titre || i.type);
  }).join("");
}
async function addAlternance(){
  const type = document.getElementById("a-type").value;
  const titre = document.getElementById("a-titre").value.trim();
  const date = document.getElementById("a-date").value;
  DATA.alternance.push({id:uid(), type, titre, date, done:false});
  await saveCat("alternance");
  renderAlternance(document.getElementById("page"));
  updateCounts();
}

/* ---------- SPORT ---------- */
const SPORT_DETAIL = {
  "sport0": {
    label: "Jambes & poussée",
    exos: [
      "Échauffement 5-10 min (vélo/rameur léger + mobilité épaules-hanches)",
      "Squat (ou presse à cuisses) — 4 x 8-10",
      "Développé couché (ou pompes lestées) — 4 x 8-10",
      "Rowing barre ou haltère — 3 x 10-12",
      "Développé militaire haltères — 3 x 10",
      "Fentes — 3 x 12/jambe",
      "Gainage — 3 x 30-45 s"
    ]
  },
  "sport1": {
    label: "Dos & tirage",
    exos: [
      "Échauffement 5-10 min",
      "Soulevé de terre (ou hip thrust si débutant) — 4 x 6-8",
      "Tractions ou tirage vertical — 4 x 8-10",
      "Développé incliné haltères — 3 x 10",
      "Leg curl ou soulevé de terre jambes tendues — 3 x 10-12",
      "Élévations latérales — 3 x 12-15",
      "Gainage latéral — 3 x 30 s/côté"
    ]
  },
  "sport2": {
    label: "Accessoires + cardio léger",
    exos: [
      "Échauffement 5-10 min",
      "Presse à cuisses ou squat gobelet — 3 x 12",
      "Tirage horizontal poulie — 3 x 12",
      "Développé couché haltères — 3 x 10",
      "Curl biceps + extension triceps — 3 x 12 chacun",
      "Mollets debout — 3 x 15",
      "15-20 min cardio léger (vélo/rameur), optionnel"
    ]
  }
};

function renderSport(page){
  page.innerHTML = `
    <h1 style="color:var(--sport)">Salle de sport</h1>
    <p class="subtitle">Programme prise de muscle — full body x3/semaine</p>
    <div class="form-row">
      <select id="s-jour">${JOURS.map(j=>`<option>${j}</option>`).join("")}</select>
      <input type="time" id="s-heure" />
      <input type="text" id="s-activite" placeholder="Activité (ex: jambes, cardio...)" />
      <button class="add-btn sport" onclick="addSport()">Ajouter</button>
    </div>
    <div class="list" id="list-sport"></div>
    <p class="item-meta" style="margin:16px 4px 0;">Repos 60-90 s entre séries d'isolation, 90-120 s entre séries polyarticulaires (squat, soulevé de terre, développé). Augmente la charge dès que tu atteins le haut de la fourchette de répétitions avec une bonne forme. Pour progresser en prise de muscle : ~1,6-2 g de protéines/kg/jour et un bon sommeil comptent autant que les séances.</p>
  `;
  const list = document.getElementById("list-sport");
  const sorted = [...DATA.sport].sort((a,b)=> JOURS.indexOf(a.jour)-JOURS.indexOf(b.jour) || (a.heure||"").localeCompare(b.heure||""));
  if(sorted.length===0){ list.innerHTML = '<div class="empty">Aucune séance programmée.</div>'; return; }
  list.innerHTML = sorted.map(i=>{
    const detail = SPORT_DETAIL[i.id];
    const extra = detail ? `<div class="course-meta" style="margin-top:6px;">${detail.exos.map(escapeHtml).join("<br>")}</div>` : "";
    return `<div class="item ${i.done?"done":""}" style="align-items:flex-start;">
      <button class="check" onclick="toggleItem('sport','${i.id}')" style="margin-top:2px;">${i.done? "✓":""}</button>
      <div class="item-body">
        <div class="item-title">${escapeHtml(i.jour)}${i.heure? " · "+escapeHtml(i.heure):""} — ${escapeHtml(i.activite)}</div>
        ${extra}
      </div>
      <button class="del" onclick="deleteItem('sport','${i.id}')" aria-label="Supprimer">✕</button>
    </div>`;
  }).join("");
}
async function addSport(){
  const jour = document.getElementById("s-jour").value;
  const heure = document.getElementById("s-heure").value;
  const activite = document.getElementById("s-activite").value.trim();
  if(!activite){ alert("Indique l'activité."); return; }
  DATA.sport.push({id:uid(), jour, heure, activite, done:false});
  await saveCat("sport");
  renderSport(document.getElementById("page"));
  updateCounts();
}


/* ---------- shared item template + actions ---------- */
function itemHtml(item, cat, meta, title, extra){
  const openFn = cat==="revisions" ? "openRevisionDetail" : cat==="alternance" ? "openAlternanceDetail" : "openSportDetail";
  return `<div class="item clickable ${item.done?"done":""}" onclick="${openFn}('${item.id}')">
    <button class="check" onclick="event.stopPropagation(); toggleItem('${cat}','${item.id}')">${item.done? "✓":""}</button>
    <div class="item-body">
      <div class="item-title">${escapeHtml(title||"(sans titre)")}</div>
      <div class="item-meta">${escapeHtml(meta||"")}</div>
    </div>
    ${extra||""}
    <button class="del" onclick="event.stopPropagation(); deleteItem('${cat}','${item.id}')" aria-label="Supprimer">✕</button>
  </div>`;
}
async function toggleItem(cat, id){
  const it = DATA[cat].find(i=>i.id===id);
  if(!it) return;
  it.done = !it.done;
  await saveCat(cat);
  render();
}
async function deleteItem(cat, id){
  DATA[cat] = DATA[cat].filter(i=>i.id!==id);
  await saveCat(cat);
  render();
}

/* ---------- DÉTAIL (grande section au clic) ---------- */
function closeDetail(){
  document.getElementById("detail-overlay").classList.add("hidden");
}
function closeDetailBg(e){
  if(e.target.id === "detail-overlay") closeDetail();
}
function openDetailCard(eyebrow, title, rows, extraHtml){
  const rowsHtml = rows.filter(r=>r[1]).map(([k,v])=>`<div class="detail-row"><div class="k">${escapeHtml(k)}</div><div class="v">${v}</div></div>`).join("");
  document.getElementById("detail-card").innerHTML = `
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="detail-eyebrow">${escapeHtml(eyebrow)}</div>
    <div class="detail-title">${escapeHtml(title)}</div>
    <div>${rowsHtml}</div>
    ${extraHtml||""}
  `;
  document.getElementById("detail-overlay").classList.remove("hidden");
}

function openCoursDetail(id){
  const c = DATA.cours.find(i=>i.id===id);
  if(!c) return;
  const d = new Date(c.date+"T00:00:00");
  const dateStr = d.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long", year:"numeric"});
  openDetailCard("Cours", c.matiere||c.type||"Cours", [
    ["Date", escapeHtml(dateStr)],
    ["Horaire", escapeHtml(`${c.heureDebut||""}${c.heureFin? " – "+c.heureFin:""}`)],
    ["Salle", escapeHtml(c.salle)],
    ["Enseignant", escapeHtml(c.enseignant)],
    ["Groupe(s)", escapeHtml(c.groupes)],
    ["Type", c.type && c.type!==c.matiere ? escapeHtml(c.type) : ""]
  ]);
}

function openRevisionDetail(id){
  const i = DATA.revisions.find(x=>x.id===id);
  if(!i) return;
  openDetailCard("Révision", i.matiere, [
    ["Échéance", i.echeance? escapeHtml(i.echeance) : ""],
    ["Priorité", i.priorite? `<span class="prio ${i.priorite}">${escapeHtml(i.priorite)}</span>` : ""],
    ["Statut", i.done? "Terminé" : "À faire"]
  ]);
}

function openRevSlotDetail(){
  const now = new Date();
  const plan = buildDayPlan(now).filter(b=>b.type!=="note");
  const eyebrow = "Programme du jour";
  const title = JOURS_LONG[(now.getDay()+6)%7];
  const rows = plan.map(b => [b.heure || "—", `${escapeHtml(b.titre)}${b.detail? " — "+escapeHtml(b.detail):""}`]);
  openDetailCard(eyebrow, title.charAt(0).toUpperCase()+title.slice(1), rows);
}

function openAlternanceDetail(id){
  const i = DATA.alternance.find(x=>x.id===id);
  if(!i) return;
  let periode = "";
  if(i.date){
    const mon = new Date(i.date+"T00:00:00");
    const sun = new Date(mon); sun.setDate(sun.getDate()+6);
    periode = `${fmtDateFR(mon)} – ${fmtDateFR(sun)} ${sun.getFullYear()}`;
  }
  openDetailCard("Alternance", i.titre||i.type, [
    ["Type", escapeHtml(i.type)],
    ["Semaine du", escapeHtml(periode)]
  ]);
}

function openSportDetail(id){
  const i = DATA.sport.find(x=>x.id===id);
  if(!i) return;
  const detail = SPORT_DETAIL[i.id];
  const extra = detail ? `<div class="detail-exo"><strong>Exercices :</strong><br>${detail.exos.map(escapeHtml).join("<br>")}</div>` : "";
  openDetailCard("Sport", `${i.jour}${i.heure? " · "+i.heure:""}`, [
    ["Séance", escapeHtml(i.activite)],
    ["Statut", i.done? "Faite" : "À faire"]
  ], extra);
}

loadAll();
