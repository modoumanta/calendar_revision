  "Processus de développement et spécification formelle",
  "Contrôle de gestion",
  "Systèmes d'exploitation et programmation concurrente",
  "Cloud computing"
];
const SEM2_SUBJECTS = [
  "Anglais M1 MIAGE",
  "Projet et UML",
  "Projet développement mobile",
  "Analyse critique et informatique responsable",
  "Gestion financière",
  "Gestion de production",
  "Droit du travail",
  "Droit du numérique"
];
const SEM1_END = new Date("2027-02-02");
let revWeekOffset = 0;

function addMinutes(hhmm, minutes){
  const [h,m] = hhmm.split(":").map(Number);
  const total = h*60 + m + minutes;
  const nh = Math.floor(((total%1440)+1440)%1440 / 60);
  const nm = ((total%60)+60)%60;
  return `${String(nh).padStart(2,"0")}:${String(nm).padStart(2,"0")}`;
}

function coursesOfDay(dateStr){
  return DATA.cours
    .filter(c=>c.date===dateStr && c.matiere && !EXCLUDE_MATIERE.some(k=>c.matiere.includes(k)) && !(c.type||"").includes("PIGE - Tutorat"))
    .sort((a,b)=>(a.heureDebut||"").localeCompare(b.heureDebut||""));
}
function sportOfDay(jourAbbrev){
  return DATA.sport.find(s=>s.jour===jourAbbrev) || null;
}
function fallbackSubject(dateObj){
  const subjects = dateObj < SEM1_END ? SEM1_SUBJECTS : SEM2_SUBJECTS;
  const weekIndex = Math.floor((dateObj - new Date("2026-08-31")) / (7*24*3600*1000));
  return subjects[((weekIndex%subjects.length)+subjects.length)%subjects.length];
}

function buildDayPlan(dateObj){
  const dateStr = toLocalISO(dateObj);
  const jourIdx = (dateObj.getDay()+6)%7;
  const jourAbbrev = JOURS[jourIdx];
  const jourLong = JOURS_LONG[jourIdx];
  const courses = coursesOfDay(dateStr);
  const subjects = [...new Set(courses.map(c=>c.matiere))];

  const tomorrowObj = new Date(dateObj); tomorrowObj.setDate(tomorrowObj.getDate()+1);
  const tomorrowStr = toLocalISO(tomorrowObj);
  const tomorrowCourses = coursesOfDay(tomorrowStr);
  const tomorrowSubjects = [...new Set(tomorrowCourses.map(c=>c.matiere))];

  const sport = sportOfDay(jourAbbrev);
  const lastEnd = courses.length ? courses[courses.length-1].heureFin : null;
  const blocks = [];

  // Dimanche : bilan de la semaine + préparation de la semaine qui arrive (lundi)
  if(jourLong === "dimanche"){
    const lundiSubject = tomorrowSubjects[0] || fallbackSubject(tomorrowObj);
    blocks.push({heure:"17h00 – 18h00", titre:"Bilan de la semaine", detail:"Repasser rapidement toutes les matières vues (relecture des fiches, pas de nouvelle matière).", type:"test"});
    blocks.push({heure:"18h00 – 18h30", titre:`Préparer ${lundiSubject} (lundi)`, detail:"Parcourir le prochain cours pour ne pas arriver à froid lundi matin.", type:"revoir", matiere:lundiSubject});
    return blocks;
  }

  const today0 = subjects[0] || fallbackSubject(dateObj);
  const tomorrow0 = tomorrowSubjects[0] || fallbackSubject(tomorrowObj);
  const tomorrow1 = tomorrowSubjects[1] || tomorrow0;

  if(sport){
    const sportStart = sport.heure || "18:30";
    const SPORT_DURATION = 75; // 1h15 : efficace pour une séance full body (échauffement + 6 exercices)
    const sportEnd = addMinutes(sportStart, SPORT_DURATION);
    blocks.push({heure:`${sportStart} – ${sportEnd}`, titre:`Sport — ${sport.activite}`, type:"sport"});

    let t = sportEnd;
    let t2 = addMinutes(t, 15);
    blocks.push({heure:`${t} – ${t2}`, titre:"Retour à la maison & douche", type:"repos"});
    t = t2; t2 = addMinutes(t, 45);
    blocks.push({heure:`${t} – ${t2}`, titre:"Cuisiner & dîner", type:"repos"});

    const revStart = t2;
    let r1 = addMinutes(revStart, 45);
    blocks.push({heure:`${revStart} – ${r1}`, titre:`Relire ${today0} (vu aujourd'hui)`, detail:"Relecture rapide du cours du jour + fiche de synthèse.", type:"revoir", matiere:today0});
    let r2 = addMinutes(r1, 45);
    blocks.push({heure:`${r1} – ${r2}`, titre:`Préparer ${tomorrow0} (demain)`, detail:"Parcourir à l'avance le cours de demain pour ne pas arriver à froid.", type:"exercices", matiere:tomorrow0});
    blocks.push({heure:"", titre:"Séance de révision raccourcie (1h30) pour respecter ton repos après le sport", type:"note"});
    return blocks;
  }

  const restStart = lastEnd || "18:00";
  let revStart = addMinutes(restStart, 60);
  blocks.push({heure:`${restStart} – ${revStart}`, titre:"Pause / repas / repos", type:"repos"});

  const lateStart = parseInt(revStart.split(":")[0],10) >= 21;
  const nbSlots = lateStart ? 2 : 4;

  const fullSeq = [
    {titre:`Relire ${today0} (vu aujourd'hui)`, detail:"Relecture active du cours du jour, à chaud, + fiche de synthèse.", type:"revoir", matiere:today0},
    {titre: subjects.length>1 ? `Relire ${subjects[1]} (vu aujourd'hui)` : `Exercices ${today0}`, detail: subjects.length>1 ? "Relecture active de la 2e matière vue aujourd'hui." : "TD/exercices sans le corrigé, sur le cours du jour.", type:"exercices", matiere: subjects.length>1 ? subjects[1] : today0},
    {titre:`Préparer ${tomorrow0} (demain)`, detail:"Parcourir le cours de demain à l'avance : repérer la structure et les notions clés pour suivre plus facilement en classe.", type:"revoir", matiere:tomorrow0},
    {titre: tomorrowSubjects.length>1 ? `Préparer ${tomorrow1} (demain)` : "Auto-test + bilan de la journée", detail: tomorrowSubjects.length>1 ? "Parcourir la 2e matière du lendemain." : "Quiz ou questions sans support pour repérer ce qui reste flou.", type:"test", matiere: tomorrowSubjects.length>1 ? tomorrow1 : tomorrow0}
  ];
  const seq = fullSeq.slice(0, nbSlots);
  let t = revStart;
  seq.forEach(step=>{
    const t2 = addMinutes(t,60);
    blocks.push({heure:`${t} – ${t2}`, ...step});
    t = t2;
  });
  if(lateStart){
    blocks.push({heure:"", titre:"Journée chargée : séance raccourcie pour préserver le sommeil", type:"note"});
  }
  return blocks;
}

function renderRevWeekPlan(){
  const monday = mondayOf(new Date());
  monday.setDate(monday.getDate() + revWeekOffset*7);
  const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
  document.getElementById("rev-week-label").textContent = `${fmtDateFR(monday)} – ${fmtDateFR(sunday)}`;

  let html = "";
  const days2 = [];
  for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(d.getDate()+i); days2.push({d, idx:i}); }
  const ordered = reorderTodayFirst(days2, it => toLocalISO(it.d));
  ordered.forEach(({d, idx:i})=>{
    const blocks = buildDayPlan(d);
    const isToday = toLocalISO(d) === todayStr();
    html += `<div class="day-block ${isToday? "today-highlight":""}" style="${isToday? "border-radius:12px; padding:12px;":""}"><div class="day-heading ${isToday?"today-mark":""}">${JOURS_LONG[i]} ${fmtDateFR(d)}${isToday? " · aujourd'hui":""}</div>`;
    blocks.forEach(b=>{
      if(b.type==="note"){
        html += `<div class="item-meta" style="margin:2px 4px 8px; font-style:italic;">${escapeHtml(b.titre)}</div>`;
        return;
      }
      const fList = fichesForMatiere(b.matiere);
      const clickable = fList.length>0 ? `class="course-card clickable" onclick="openFicheForMatiere('${(b.matiere||"").replace(/'/g,"\\'")}','${b.type}')"` : `class="course-card"`;
      const ficheTag = fList.length===1 ? `<div class="course-meta" style="color:#6B4E9E; font-weight:600; margin-top:4px;">📄 Fiche disponible — clique pour réviser</div>` : fList.length>1 ? `<div class="course-meta" style="color:#6B4E9E; font-weight:600; margin-top:4px;">📄 ${fList.length} fiches disponibles — clique pour choisir</div>` : "";
      html += `<div ${clickable}>
        <div class="course-time" style="color:${BLOCK_COLOR[b.type]||"var(--revisions)"}">${escapeHtml(b.heure)}</div>
        <div class="course-body">
          <div class="course-title">${escapeHtml(b.titre)}</div>
          ${b.detail? `<div class="course-meta">${escapeHtml(b.detail)}</div>` : ""}
          ${ficheTag}
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById("rev-week-content").innerHTML = html;
}

async function toggleFicheDone(ficheKey){
  const current = FICHE_PROGRESS[ficheKey];
  if(current && current.done){
    delete FICHE_PROGRESS[ficheKey];
  } else {
    FICHE_PROGRESS[ficheKey] = { done: true, date: todayStr() };
  }
  try{ await window.storage.set("planner:ficheProgress", JSON.stringify(FICHE_PROGRESS)); }catch(e){}
  render();
}
function isFicheDone(ficheKey){

/* ---------- PROGRESSION (suivi global + par jour) ---------- */
function renderProgression(page){
  const matieres = Object.keys(FICHE_BY_MATIERE);
  let totalFiches = 0, totalDone = 0;
  const perMatiere = matieres.map(m=>{
    const keys = FICHE_BY_MATIERE[m];
    const doneCount = keys.filter(k=>isFicheDone(k)).length;
    totalFiches += keys.length;
    totalDone += doneCount;
    return { matiere:m, keys, doneCount, total: keys.length };
  });
  const globalPct = totalFiches>0 ? Math.round((totalDone/totalFiches)*100) : 0;

  let html = `<h1 style="color:#3D6B4F">Progression</h1>
    <p class="subtitle">Suivi de tes fiches de cours révisées, par matière et par jour</p>
    <div class="progress-global">
      <div class="pg-pct">${globalPct}%</div>
      <div class="pg-label">${totalDone} / ${totalFiches} fiches révisées au total</div>
    </div>
    <div class="section-label">Par matière</div>`;

  perMatiere.forEach(pm=>{
    const pct = pm.total>0 ? Math.round((pm.doneCount/pm.total)*100) : 0;
    html += `<div class="progress-row">
      <div class="pr-label">${escapeHtml(pm.matiere)}</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
      <div class="pr-pct">${pm.total>0? pct+"%" : "—"}</div>
    </div>`;
    if(pm.total>0){
      html += `<div class="list" style="margin:-6px 0 18px;">`;
      pm.keys.forEach(k=>{
        const f = FICHES[k];
        const done = isFicheDone(k);
        html += `<div class="agenda-item clickable" onclick="openFicheDirect('${k}')">
          <span class="tag" style="${done?'background:#DEEAE1; color:#3D6B4F;':'background:#EFEAE0; color:#8A8578;'}">${done? '✓ Révisé' : 'À faire'}</span>
          <span class="txt">${escapeHtml(f.chapitre)}</span>
          <span class="meta">${done? escapeHtml(FICHE_PROGRESS[k].date) : ""}</span>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="empty" style="margin:-6px 0 18px;">Aucune fiche pour l'instant — envoie les cours de cette matière quand tu veux.</div>`;
    }
  });

  // Historique par jour
  const byDate = {};
  Object.keys(FICHE_PROGRESS).forEach(k=>{
    const entry = FICHE_PROGRESS[k];
    if(!entry || !entry.done) return;
    const d = entry.date || "?";
    if(!byDate[d]) byDate[d] = [];
    const f = FICHES[k];
    if(f) byDate[d].push(`${f.matiere} — ${f.chapitre}`);
  });
  const dates = Object.keys(byDate).sort().reverse();

  html += `<div class="section-label">Historique par jour</div>`;
  if(dates.length===0){
    html += `<div class="empty">Aucune fiche marquée comme révisée pour le moment.</div>`;
  } else {
    dates.forEach(d=>{
      const dateObj = new Date(d+"T12:00:00");
      const label = dateObj.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
      html += `<div class="progress-day-group">
        <div class="progress-day-heading">${label.charAt(0).toUpperCase()+label.slice(1)} — ${byDate[d].length} fiche(s)</div>
        <div class="list">`;
      byDate[d].forEach(txt=>{
        html += `<div class="agenda-item"><span class="tag" style="background:#DEEAE1; color:#3D6B4F;">✓</span><span class="txt">${escapeHtml(txt)}</span><span class="meta"></span></div>`;
      });
      html += `</div></div>`;
    });
  }

  page.innerHTML = html;
}

  currentFicheTab = "resume";
  switchTab("fiches");

    periode = `${fmtDateFR(mon)} – ${fmtDateFR(sun)} ${sun.getFullYear()}`;
  }
  openDetailCard("Alternance", i.titre||i.type, [
    ["Type", escapeHtml(i.type)],
    ["Semaine du", escapeHtml(periode)]
  ]);
}

function openSportDetail(id){
  const i = DATA.sport.find(x=>x.id===id);
  if(!i) return;
  const detail = SPORT_DETAIL[i.id];
  const extra = detail ? `<div class="detail-exo"><strong>Exercices :</strong><br>${detail.exos.map(escapeHtml).join("<br>")}</div>` : "";
  openDetailCard("Sport", `${i.jour}${i.heure? " · "+i.heure:""}`, [
    ["Séance", escapeHtml(i.activite)],
    ["Statut", i.done? "Faite" : "À faire"]
  ], extra);
}

loadAll();
</script>
</body>
