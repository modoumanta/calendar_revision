 selon la boisson — cette variation est fixée une fois pour toutes par la sous-classe concernée.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> (a) Stratégie (interchangeable à l'exécution, par composition). (b) Commande (transforme l'action en objet pour permettre file d'attente + undo). (c) Méthode/Template Method (squelette fixe dans la classe mère, étape redéfinie par héritage, figée par sous-classe — statique, pas modifiable à l'exécution).</p><h3 class=\"fiche-h1\">Exercice 6 — Question de synthèse</h3><p class=\"fiche-p\">Explique en une phrase pourquoi le Décorateur et la Stratégie sont souvent confondus, et donne LA différence qui permet de trancher.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> Les deux reposent sur la composition d'objets plutôt que l'héritage, ce qui les rend structurellement proches. La différence est dans l'INTENTION : le Décorateur change l'apparence/le comportement EXTERNE perçu par le client (\"la peau\"), en empilant des enveloppes ; la Stratégie change la LOGIQUE INTERNE d'un traitement (\"les tripes\"), en substituant un algorithme à un autre au sein d'un même contexte.</p>"

  'pc-uml': {

    chapitre: "Revision UML",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>4revison_uml.pdf</li><li>revison_uml.pdf (variante)</li></ul></div><h3 class=\"fiche-h1\">1. Pourquoi UML ?</h3><p class=\"fiche-p\">UML sert de pont entre les BESOINS DES UTILISATEURS et le SYSTÈME INFORMATIQUE, via des MODÈLES CONCEPTUELS D'INFORMATION : acquisition/représentation des connaissances côté besoins, conception logique côté système, avec des allers-retours de validation et vérification entre les deux.</p><p class=\"fiche-p\">UML est à la fois : un outil de communication visuelle, une norme maintenue par l'OMG, un processus de développement, ET un langage — il propose 14 diagrammes possibles (dont seuls quelques-uns sont couverts dans ce cours : classes, objets, séquences, cas d'utilisation).</p><h3 class=\"fiche-h1\">2. Le diagramme de classes</h3><h4 class=\"fiche-h2\">2.1 La classe</h4><p class=\"fiche-p\">Une classe représente un ensemble d'objets qui partagent : mêmes attributs, mêmes méthodes, mêmes relations, même sémantique.</p><table class=\"fiche-table\"><thead><tr><th>Élément</th><th>Convention</th></tr></thead><tbody><tr><td>Nom de la classe</td><td>Commence par une MAJUSCULE. Si abstraite → écrite en italique ou avec {abstraite}, non instanciable.</td></tr><tr><td>Visibilité</td><td>+ Public / # Protected / - Privée</td></tr><tr><td>Nom d'attribut/méthode</td><td>Commence par une MINUSCULE</td></tr><tr><td>Attribut de classe (static)</td><td>Souligné</td></tr><tr><td>Attribut/méthode abstrait(e)</td><td>En italique</td></tr><tr><td>Multiplicité d'attribut</td><td>Entre crochets, ex : [0..2]</td></tr></tbody></table><h4 class=\"fiche-h2\">2.2 Les associations</h4><p class=\"fiche-p\">Une association relie deux classes, avec un NOM, un SENS de lecture, des RÔLES (à ne pas confondre avec le nom de l'association !) et une sémantique.</p><table class=\"fiche-table\"><thead><tr><th>Multiplicité</th><th>Signification</th></tr></thead><tbody><tr><td>1</td><td>un et un seul</td></tr><tr><td>0..1</td><td>zéro ou un</td></tr><tr><td>*</td><td>zéro ou plusieurs</td></tr><tr><td>1..*</td><td>un ou plusieurs</td></tr><tr><td>M..N</td><td>de M à N</td></tr></tbody></table><p class=\"fiche-note\">Piège classique : la multiplicité se lit du côté de la classe DESTINATION — elle précise combien d'objets de la classe destination peuvent être liés à un objet de la classe source.</p><p class=\"fiche-p\">Sens de lecture : une association unidirectionnelle n'est navigable que dans un seul sens ; une association bidirectionnelle n'a pas de sens de lecture imposé (c'est la forme recommandée — il est conseillé de différer l'introduction du sens/navigabilité jusqu'à la conception).</p><p class=\"fiche-p\">Contraintes possibles sur les associations : {inclus} (le président fait partie des membres), {ou-exclusif} (un compte est soit entreprise soit individuel, jamais les deux). Une classe-association (ou classe associative) permet d'attacher des attributs/méthodes/relations directement à une association.</p><h4 class=\"fiche-h2\">2.3 Agrégation vs Composition — LE piège classique</h4><table class=\"fiche-table\"><thead><tr><th>Critère</th><th>Agrégation</th><th>Composition</th></tr></thead><tbody><tr><td>Couplage</td><td>Faible</td><td>Fort</td></tr><tr><td>L'objet partie peut-il être partagé ?</td><td>OUI (entre plusieurs touts)</td><td>NON</td></tr><tr><td>Destruction du tout → destruction des parties ?</td><td>NON</td><td>OUI</td></tr><tr><td>La partie peut-elle exister sans le tout ?</td><td>OUI</td><td>Peut être créée hors du composé, mais est détruite avec lui</td></tr><tr><td>Symbole UML</td><td>Losange VIDE</td><td>Losange PLEIN</td></tr></tbody></table><p class=\"fiche-note\">Exemple du cours pour bien distinguer : un point p1 partagé entre 2 polygones = AGRÉGATION (le point existe indépendamment). Si chaque polygone a SA PROPRE copie du point (même valeur mais objets distincts, détruits avec le polygone) = COMPOSITION.</p><h4 class=\"fiche-h2\">2.4 Généralisation-spécialisation (héritage)</h4><p class=\"fiche-p\">Relation non réflexive, non symétrique, TRANSITIVE, qui évite la duplication mais pose des problèmes de complétude et de recouvrement (bien choisir ses sous-classes). Une spécialisation multiple peut se faire sur un seul axe ({chevauchement} vs {disjoint}) ou sur PLUSIEURS axes de critères différents en parallèle (ex : Enseignant/Chercheur sur un axe, Salarié/Vacataire sur un autre, Public/Privé sur un troisième — un même Employé peut être classé selon les 3 axes simultanément).</p><h3 class=\"fiche-h1\">3. Le diagramme d'objets</h3><p class=\"fiche-p\">Représente des objets et leurs LIENS à un instant donné (vue statique) — utile pour documenter des cas de test ou analyser un exemple concret. Un objet s'écrit nomObjet : NomClasse (souligné), avec ses attributs valorisés. Un LIEN est une instance d'une association entre deux objets précis.</p><p class=\"fiche-note\">Point subtil du cours : la valeur d'un attribut de CLASSE (souligné) est associée à la classe elle-même, pas à chaque objet individuellement — elle est donc partagée par toutes les instances.</p><h3 class=\"fiche-h1\">4. Le diagramme de séquence</h3><p class=\"fiche-p\">Vue DYNAMIQUE (contrairement au diagramme d'objets, statique) : représente une INTERACTION entre objets, via un enchaînement de messages typés, organisé selon 2 axes — l'ordre d'apparition des objets (horizontal) et le temps (vertical, ligne de vie).</p><table class=\"fiche-table\"><thead><tr><th>Type de message</th><th>Sens/usage</th></tr></thead><tbody><tr><td>Synchrone</td><td>L'émetteur attend la réponse avant de continuer.</td></tr><tr><td>Asynchrone</td><td>L'émetteur continue sans attendre de réponse.</td></tr><tr><td>Réflexif</td><td>Un objet s'envoie un message à lui-même.</td></tr><tr><td>De retour</td><td>Réponse à un message synchrone.</td></tr><tr><td>De création</td><td>Crée un nouvel objet.</td></tr><tr><td>De suppression</td><td>Détruit un objet.</td></tr></tbody></table><p class=\"fiche-p\">Structures de contrôle disponibles : conditionnelle (alt, avec if/else séparés par des pointillés) et itérative (loop, avec condition d'arrêt) — permettent de représenter des branchements et répétitions dans un scénario d'interaction.</p>",

    corriges: "<div class=\"fiche-sources\"><strong>📎 PDF associés :</strong><ul class=\"fiche-ul\"><li>Exercice Analyse Metier.pdf</li></ul></div><h3 class=\"fiche-h1\">Exercice — Modéliser un système de dessin (diagramme de classes)</h3><p class=\"fiche-p\"><strong>Énoncé :</strong> modéliser un système permettant de dessiner un graphique. Un Graphique est composé de Lignes, de Rectangles, de Textes et d'Images. Une Image peut elle-même être composée d'autres Images, de Lignes, de Rectangles et de Textes.</p><p class=\"fiche-p\"><strong>Analyse :</strong> le piège de l'énoncé est la récursivité — une Image peut contenir d'autres Images. C'est exactement la structure que documente le patron de conception COMPOSITE (voir chapitre Design Patterns structurels) : traiter un groupe d'éléments et un élément individuel de façon UNIFORME, via une interface commune.</p><p class=\"fiche-p\"><strong>Modélisation proposée :</strong></p><ul class=\"fiche-ul\"><li>Une interface (ou classe abstraite) ÉlémentGraphique définit le contrat commun : par exemple dessiner().</li><li>Ligne, Rectangle, Texte sont des ÉlémentGraphique \"feuilles\" (pas de composition).</li><li>Image est un ÉlémentGraphique COMPOSITE : elle contient une collection (0..*) d'autres ÉlémentGraphique (donc potentiellement d'autres Images, en récursif).</li><li>Graphique est la racine, composée elle aussi de plusieurs ÉlémentGraphique (Lignes, Rectangles, Textes, Images).</li></ul><pre class=\"fiche-code\">+---------------------+\n|  <<interface>>      |\n|  ElementGraphique    |\n|----------------------|\n|  + dessiner()        |\n+----------+-----------+\n     ^      ^       ^        ^\n     |      |       |        |\n  +------+ +--------+ +------+  +--------------------+\n  | Ligne | |Rectangle| |Texte|  |       Image         |\n  +------+ +--------+ +------+  |---------------------|\n                                  | - elements: List<ElementGraphique> [0..*] |\n                                  |---------------------|\n                                  | + dessiner()        |\n                                  +---------------------+\n\nGraphique  o---- [0..*] ElementGraphique  (agrégation)\nImage      o---- [0..*] ElementGraphique  (agrégation récursive)</pre><p class=\"fiche-p\"><strong>Points de notation attendus (d'après la consigne \"suffisamment d'informations\") :</strong></p><ul class=\"fiche-ul\"><li>L'interface/classe abstraite commune (ÉlémentGraphique) avec sa méthode dessiner() — sans elle, pas de traitement uniforme possible.</li><li>La relation d'AGRÉGATION (losange vide) entre Image et ÉlémentGraphique — pas de composition stricte, puisqu'une Ligne pourrait en théorie être partagée entre plusieurs Images.</li><li>La multiplicité [0..*] côté ÉlémentGraphique, montrant qu'une Image peut contenir zéro, un ou plusieurs éléments, y compris d'autres Images.</li><li>Le stéréotype «interface» sur ÉlémentGraphique si elle est modélisée comme une interface Java plutôt qu'une classe abstraite.</li></ul><p class=\"fiche-note\">Ce type d'exercice teste directement le transfert entre 2 chapitres : reconnaître qu'une structure récursive/arborescente décrite en langage naturel correspond au patron Composite, puis savoir le traduire correctement en UML (multiplicités, agrégation, interface commune).</p>"

    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>2Revision Java.pdf</li></ul></div><h3 class=\"fiche-h1\">1. equals() vs hashCode()</h3><table class=\"fiche-table\"><thead><tr><th>Méthode</th><th>Par défaut (non redéfinie)</th><th>Rôle</th></tr></thead><tbody><tr><td>equals()</td><td>Compare par ADRESSE mémoire (deux objets différents sont toujours \"différents\")</td><td>Redéfinie pour comparer les PROPRIÉTÉS des objets entre elles</td></tr><tr><td>hashCode()</td><td>Génère un identifiant lié à l'adresse</td><td>Redéfini pour créer un identifiant unique cohérent avec equals() — indispensable pour les structures comme HashMap/HashSet</td></tr></tbody></table><pre class=\"fiche-code\">class ObjectToCompare {\n  int i;\n  @Override\n  public boolean equals(Object obj) {\n    return (obj instanceof ObjectToCompare) && ((ObjectToCompare) obj).i == this.i;\n  }\n}</pre><p class=\"fiche-note\">Règle à connaître : si on redéfinit equals(), il faut TOUJOURS redéfinir hashCode() en cohérence, sinon les collections basées sur le hachage (HashMap, HashSet) se comportent de façon incohérente.</p><h3 class=\"fiche-h1\">2. Héritage et polymorphisme</h3><p class=\"fiche-p\">L'héritage permet : la redéfinition de comportements du parent, l'ajout de fonctions propres à la sous-classe, tout en conservant TOUS les comportements hérités du parent.</p><p class=\"fiche-p\">Le polymorphisme permet de traiter des objets de sous-types différents de manière uniforme via leur type parent commun (ex : lion, chien, chat peuvent tous être traités comme des \"Animal\" capables de faire un bruit) — mais l'inverse n'est pas vrai (on ne peut pas traiter un Animal générique comme un Lion spécifique sans cast).</p><h3 class=\"fiche-h1\">3. Le contrat d'interface</h3><p class=\"fiche-p\">Une interface détermine les opérations possibles (le contrat), peut fournir des comportements par défaut (méthodes default), peut hériter d'une autre interface, mais NE CONTIENT JAMAIS d'attribut (seulement des constantes implicitement statiques et finales).</p><h3 class=\"fiche-h1\">4. La généricité</h3><p class=\"fiche-p\">Permet de dupliquer un même modèle structurel pour des types finaux différents (ex : List&lt;T&gt; fonctionne pour n'importe quel type T), en amenant en contrepartie de la complexité dans le typage.</p><h3 class=\"fiche-h1\">5. La réflexivité Java</h3><p class=\"fiche-p\">Permet d'inspecter et manipuler du code à l'exécution (runtime), à partir du .class d'un objet : récupérer ses attributs, méthodes, constructeurs, son package, et même modifier des éléments dynamiquement. Utile dans des situations complexes où l'objet n'est pas connu à l'avance, et très utilisé dans les frameworks de tests.</p><h3 class=\"fiche-h1\">6. Les Streams et la programmation fonctionnelle</h3><p class=\"fiche-p\">Un Stream se compose de 3 parties : une SOURCE de données (instanciée via .stream() ou new Stream()), zéro ou plusieurs opérations INTERMÉDIAIRES (chaînées), et une opération TERMINALE (qui déclenche réellement le calcul et produit un résultat, ex : collect, count, sum).</p><pre class=\"fiche-code\">// Écriture impérative classique\nint[] integers = {1,2,3};\nfor (int i = 0; i < integers.length; i++) { integers[i] = integers[i] * 2; }\n\n// Écriture fonctionnelle avec Stream — plus lisible, règles métier explicites\nArrays.stream(integers).map(i -> i * 2).toArray();</pre><p class=\"fiche-p\">Les fonctions LAMBDA ((i) -> ... ou (i) -> {...} sur plusieurs lignes) ne sont pas stockées en mémoire comme des fonctions nommées, et NE PEUVENT PAS s'appeler elles-mêmes en récursion.</p><p class=\"fiche-p\">Les pointeurs de fonction (::) permettent de passer une référence de méthode directement, sans écrire de lambda explicite :</p><pre class=\"fiche-code\">// Avec lambda\nstrings.stream().forEach((string) -> System.out.println(string));\n// Avec pointeur de fonction (équivalent, plus concis)\nstrings.stream().forEach(System.out::println);\n// Avec une méthode d'une classe utilitaire\nstrings.stream().map(new StringUtils()::changeStringToHashcode).collect(Collectors.toList());</pre>",
    fiche: "<h3 class=\"fiche-h1\">equals() / hashCode()</h3><p class=\"fiche-p\">Toujours redéfinir les DEUX ensemble (sinon HashMap/HashSet incohérents). equals() par défaut = comparaison d'adresse.</p><h3 class=\"fiche-h1\">Héritage vs Polymorphisme</h3><ul class=\"fiche-ul\"><li>Héritage : hérite de TOUS les comportements du parent + peut redéfinir/ajouter.</li><li>Polymorphisme : traiter des sous-types différents de façon uniforme via le type parent — sens unique seulement.</li></ul><h3 class=\"fiche-h1\">Interface</h3><p class=\"fiche-p\">Contrat d'opérations + comportements par défaut possibles. JAMAIS d'attribut.</p><h3 class=\"fiche-h1\">Réflexivité</h3><p class=\"fiche-p\">Inspecter/modifier au runtime : attributs, méthodes, constructeurs, package — utile en tests.</p><h3 class=\"fiche-h1\">Streams — structure en 3 parties</h3><ul class=\"fiche-ul\"><li>Source (.stream())</li><li>Opérations intermédiaires (map, filter...)</li><li>Opération terminale (collect, count, sum...)</li></ul><h3 class=\"fiche-h1\">Lambda vs pointeur de fonction</h3><table class=\"fiche-table\"><thead><tr><th></th><th>Lambda</th><th>Pointeur ::</th></tr></thead><tbody><tr><td>Syntaxe</td><td>(i) -> ...</td><td>Classe::méthode</td></tr><tr><td>Récursion</td><td>Impossible</td><td>N/A</td></tr><tr><td>Cas d'usage</td><td>Logique inline</td><td>Référencer une méthode existante</td></tr></tbody></table>",

    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>3revision_test.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Boîte blanche vs boîte noire</h3><table class=\"fiche-table\"><thead><tr><th>Boîte blanche</th><th>Boîte noire</th></tr></thead><tbody><tr><td>On connaît le CODE, le comportement interne, et les erreurs possibles.</td><td>On ne connaît PAS le comportement interne — seulement les entrées/sorties attendues.</td></tr></tbody></table><p class=\"fiche-p\">La pyramide des tests (rappel classique) organise les tests par volume et rapidité : beaucoup de tests unitaires (rapides, isolés) à la base, moins de tests d'intégration au milieu, peu de tests end-to-end (lents, coûteux) au sommet.</p><h3 class=\"fiche-h1\">2. Mocks et Spys (Mockito)</h3><table class=\"fiche-table\"><thead><tr><th>Mock</th><th>Spy</th></tr></thead><tbody><tr><td>Objet totalement simulé : si on ne configure pas explicitement sa réponse, elle reste NULL/vide — il FAUT simuler chaque comportement utilisé.</td><td>Objet basé sur le VRAI comportement : si on ne simule pas une réponse spécifique, le comportement réel s'exécute normalement.</td></tr></tbody></table><p class=\"fiche-note\">Point commun : Mocks ET Spys peuvent tous les deux être \"suivis\" sur leurs appels (vérifier combien de fois une méthode a été appelée, avec quels arguments...).</p><h3 class=\"fiche-h1\">3. JUnit 5 — cycle de vie des tests</h3><table class=\"fiche-table\"><thead><tr><th>Annotation</th><th>Quand ça s'exécute</th></tr></thead><tbody><tr><td>@BeforeAll</td><td>Une seule fois, au tout début (ex : démarrage d'un serveur de test).</td></tr><tr><td>@BeforeEach</td><td>Avant CHAQUE test individuel.</td></tr><tr><td>@AfterEach</td><td>Après CHAQUE test individuel.</td></tr><tr><td>@AfterAll</td><td>Une seule fois, à la toute fin (ex : arrêt du serveur).</td></tr></tbody></table><h3 class=\"fiche-h1\">4. Stratégie de test : Given – When – Then</h3><table class=\"fiche-table\"><thead><tr><th>Étape</th><th>Rôle</th></tr></thead><tbody><tr><td>Given</td><td>Préparation du contexte / des données du test.</td></tr><tr><td>When</td><td>Exécution de l'action / du code testé.</td></tr><tr><td>Then</td><td>Vérification du résultat obtenu par rapport à l'attendu.</td></tr></tbody></table><h3 class=\"fiche-h1\">5. Le TDD (Test-Driven Development)</h3><p class=\"fiche-p\">Processus en 3 étapes cycliques :</p><ul class=\"fiche-ul\"><li>1. Écrire les TESTS AVANT l'implémentation du code (l'IDE aide beaucoup à ce stade, en générant les signatures manquantes).</li><li>2. Faire l'implémentation du code.</li><li>3. Relancer les tests pour vérifier que l'implémentation correspond bien au comportement demandé.</li></ul><p class=\"fiche-note\">L'intérêt du TDD est de clarifier le comportement ATTENDU avant même d'écrire le code — le test devient la spécification exécutable de la fonctionnalité.</p>",
    fiche: "<h3 class=\"fiche-h1\">Boîte blanche vs noire</h3><table class=\"fiche-table\"><thead><tr><th>Blanche</th><th>Noire</th></tr></thead><tbody><tr><td>Connaît le code</td><td>Ne connaît que entrées/sorties</td></tr></tbody></table><h3 class=\"fiche-h1\">Mock vs Spy</h3><table class=\"fiche-table\"><thead><tr><th>Mock</th><th>Spy</th></tr></thead><tbody><tr><td>Réponse par défaut = null (à simuler)</td><td>Réponse par défaut = vrai comportement</td></tr></tbody></table><h3 class=\"fiche-h1\">JUnit 5 — cycle de vie</h3><ul class=\"fiche-ul\"><li>@BeforeAll (1 fois, début)</li><li>@BeforeEach (avant chaque test)</li><li>@AfterEach (après chaque test)</li><li>@AfterAll (1 fois, fin)</li></ul><h3 class=\"fiche-h1\">Given-When-Then</h3><p class=\"fiche-p\">Given = préparation. When = exécution. Then = vérification.</p><h3 class=\"fiche-h1\">TDD — 3 étapes</h3><ul class=\"fiche-ul\"><li>Écrire le test AVANT le code</li><li>Implémenter le code</li><li>Relancer le test pour valider</li></ul>",

  'pc-sonar': {
    matiere: "Patrons et composants",
    chapitre: "Qualite continue avec Sonar",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>5sonar.pdf</li><li>6Qualite continue Sonar.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Pourquoi Sonar ? La sécurisation du code</h3><p class=\"fiche-p\">Sonar (SonarQube) est un OUTIL qui, via une analyse de code approfondie, applique des critères de qualité pour augmenter la qualité du code — une bonne pratique automatisée plutôt qu'une vérification manuelle.</p><h3 class=\"fiche-h1\">2. Les Quality Gates — critères mesurés</h3><ul class=\"fiche-ul\"><li>Duplication de code</li><li>Code smells (mauvaises pratiques détectées, sans être forcément des bugs)</li><li>Coverage (couverture de tests)</li><li>Security hotspots (points sensibles pour la sécurité à vérifier)</li><li>Dette technique</li></ul><p class=\"fiche-p\">La DETTE TECHNIQUE représente le temps à allouer pour corriger le code (issu de l'analyse), à mettre en balance avec le temps disponible pour l'évolution du projet — plus la dette s'accumule, plus elle ralentit les développements futurs.</p><h3 class=\"fiche-h1\">3. Mise en place pratique (projet Maven)</h3><p class=\"fiche-p\">Structure d'un projet Maven (différente d'un simple projet Java) :</p><ul class=\"fiche-ul\"><li>src/main/java : le code source</li><li>src/test/java : les tests</li></ul><p class=\"fiche-p\">Dépendances/plugins clés à ajouter au pom.xml : JUnit (tests), Surefire (exécution des tests), Jacoco (couverture de code).</p><pre class=\"fiche-code\"># Compiler et exécuter les tests\nmvn install\n\n# Nettoyer le projet\nmvn clean\n\n# Lancer l'analyse qualité Sonar (après un mvn install réussi)\nmvn clean verify sonar:sonar -Dsonar.login=monToken</pre><p class=\"fiche-note\">SonarLint est un agent (plugin Eclipse/IDE) qui se connecte directement au serveur SonarQube pour visualiser les métriques de qualité en continu pendant le développement, sans attendre une analyse complète. Les analyses peuvent aussi être automatisées via un serveur d'intégration continue (ex : Jenkins).</p>",
    fiche: "<h3 class=\"fiche-h1\">Sonar en une phrase</h3><p class=\"fiche-p\">Outil d'analyse de code automatisée pour mesurer et améliorer la qualité.</p><h3 class=\"fiche-h1\">5 Quality Gates à citer</h3><ul class=\"fiche-ul\"><li>Duplication de code</li><li>Code smells</li><li>Coverage (couverture de tests)</li><li>Security hotspots</li><li>Dette technique</li></ul><h3 class=\"fiche-h1\">Dette technique</h3><p class=\"fiche-p\">Temps nécessaire pour corriger le code existant — à mettre en balance avec le temps disponible pour faire évoluer le projet.</p><h3 class=\"fiche-h1\">Commandes Maven clés</h3><table class=\"fiche-table\"><thead><tr><th>Commande</th><th>Effet</th></tr></thead><tbody><tr><td>mvn install</td><td>Compile + exécute les tests</td></tr><tr><td>mvn clean</td><td>Nettoie le projet</td></tr><tr><td>mvn clean verify sonar:sonar</td><td>Lance l'analyse qualité Sonar</td></tr></tbody></table><h3 class=\"fiche-h1\">SonarLint</h3><p class=\"fiche-p\">Plugin IDE connecté en direct au serveur SonarQube pour un retour continu, sans attendre une analyse complète.</p>",

  'cloud-git': {
    matiere: "Cloud computing",
    chapitre: "Git - collaboration et workflows",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>2_git.pdf</li><li>2_git_bis.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Pourquoi un VCS (Version Control Software) ?</h3><p class=\"fiche-p\">Travailler en équipe sur du code pose des questions : comment conserver un historique, revenir en arrière, travailler en parallèle sans s'écraser mutuellement, gérer plusieurs versions, savoir qui a modifié quoi et pourquoi. Un VCS comme Git répond à tous ces besoins.</p><table class=\"fiche-table\"><thead><tr><th>Ce qu'on stocke dans Git</th><th>Ce qu'on n'y met PAS</th></tr></thead><tbody><tr><td>Fichiers source (.java, .c, .html...)</td><td>Fichiers temporaires (.log, .out...)</td></tr><tr><td>Fichiers binaires non dérivés du code (images...)</td><td>Fichiers générés (.jar, .class, .o, .exe)</td></tr><tr><td>Fichiers de configuration/compilation (Makefile, .yaml...)</td><td>(géré via .gitignore)</td></tr></tbody></table><h3 class=\"fiche-h1\">2. Le commit et les 3 zones de travail</h3><p class=\"fiche-p\">Un commit stocke l'état d'une partie du dépôt à un instant donné : un pointeur vers son (ou ses) commit(s) précédent(s), les infos sur l'auteur, un message descriptif.</p><p class=\"fiche-p\">Cycle de vie d'un fichier à travers 3 zones (\"The Three States\") :</p><table class=\"fiche-table\"><thead><tr><th>Zone</th><th>Rôle</th><th>Commande pour y arriver</th></tr></thead><tbody><tr><td>Working Directory</td><td>Fichier modifié, pas encore prêt à être commité</td><td>(édition normale)</td></tr><tr><td>Index / Staging Area</td><td>Fichier proposé pour le prochain commit</td><td>git add <fichier></td></tr><tr><td>HEAD (dépôt local)</td><td>Fichier committé (à jour dans l'historique)</td><td>git commit <fichier></td></tr></tbody></table><p class=\"fiche-p\">Retours en arrière possibles : git restore --staged <fichier> (retire de l'Index) ou git restore <fichier> (annule les modifications non commitées dans le Working Directory).</p><h3 class=\"fiche-h1\">3. Historique, branches et fusions</h3><ul class=\"fiche-ul\"><li>Une BRANCHE est un simple pointeur sur un commit. Chaque commit pointe vers son prédécesseur.</li><li>HEAD pointe sur la branche actuellement active.</li><li>Un MERGE est un commit avec un degré sortant supérieur à 1 : il fusionne les historiques de plusieurs branches.</li><li>Un REBASE fusionne entièrement une branche source dans une branche destination, en réécrivant l'historique pour le rendre linéaire (plus simple à lire qu'un merge classique). Règle d'or : ne JAMAIS rebaser des commits déjà poussés sur un dépôt public/partagé.</li><li>Un merge est dit fast-forward quand le commit de destination est déjà un ancêtre direct dans l'historique — Git se contente alors de déplacer le pointeur, sans créer de nouveau commit de fusion.</li></ul><h3 class=\"fiche-h1\">4. Revenir en arrière sur des commits déjà validés</h3><table class=\"fiche-table\"><thead><tr><th>Commande</th><th>Effet</th></tr></thead><tbody><tr><td>amend</td><td>Modifie le DERNIER commit (ajouter des fichiers oubliés, corriger le message).</td></tr><tr><td>revert</td><td>Annule un commit en créant un NOUVEAU commit inverse — ne réécrit pas l'historique.</td></tr><tr><td>reset --soft</td><td>Restaure un ancien commit, en gardant Index + Working Directory intacts.</td></tr><tr><td>reset (par défaut)</td><td>Restaure un ancien commit + l'Index, garde le Working Directory intact.</td></tr><tr><td>reset --hard</td><td>Restaure tout : commit + Index + Working Directory (perte définitive des modifications non sauvegardées ailleurs).</td></tr></tbody></table><p class=\"fiche-note\">Règle de sécurité citée en cours : si l'erreur a déjà été rendue publique (poussée sur le dépôt partagé), la SEULE bonne pratique est revert — jamais reset ni rebase sur de l'historique déjà partagé.</p><h3 class=\"fiche-h1\">5. Les modèles de collaboration (workflows)</h3><h4 class=\"fiche-h2\">5.1 Approche centralisée (Trunk-based)</h4><p class=\"fiche-p\">Tout le monde travaille directement sur la branche master : fetch → merge (ou pull --rebase) → push. Simple, mais rend difficile le travail en parallèle sur plusieurs fonctionnalités, et génère beaucoup de merges inutiles.</p><h4 class=\"fiche-h2\">5.2 Feature Branch</h4><p class=\"fiche-p\">Chaque fonctionnalité (ou correction de bug) est développée dans sa propre branche, nommée selon son objectif, poussée sur le serveur, puis fusionnée dans master une fois terminée. Permet à plusieurs développeurs de collaborer sur une même fonctionnalité.</p><h4 class=\"fiche-h2\">5.3 GitFlow</h4><p class=\"fiche-p\">Modèle pensé pour des projets complexes basés sur des releases versionnées, avec plusieurs branches dédiées :</p><table class=\"fiche-table\"><thead><tr><th>Branche</th><th>Rôle</th></tr></thead><tbody><tr><td>master</td><td>Dernière version STABLE, livrée.</td></tr><tr><td>develop</td><td>Intègre les dernières fonctionnalités en cours.</td></tr><tr><td>feature/*</td><td>Créée à partir de develop, pour une nouvelle fonctionnalité.</td></tr><tr><td>release/*</td><td>Créée à partir de develop, nettoyage avant publication, mergée dans master ET develop.</td></tr><tr><td>hotfix/*</td><td>Créée à partir de master, correction urgente, mergée dans master ET develop.</td></tr></tbody></table><p class=\"fiche-note\">GitFlow est souvent jugé trop complexe pour des projets à livraison continue (sans releases formelles) — d'où l'existence de versions simplifiées (workflow GitHub, workflow GitLab), qui suppriment notamment la branche develop.</p><h4 class=\"fiche-h2\">5.4 Workflow GitHub (livraison continue)</h4><ul class=\"fiche-ul\"><li>La branche master doit TOUJOURS être déployable.</li><li>Utiliser une feature branch pour chaque nouveau développement.</li><li>Pousser régulièrement ses modifications.</li><li>Créer une Pull Request pour obtenir du feedback avant de merger.</li><li>Ne merger dans master qu'après relecture par quelqu'un d'autre.</li><li>Tester le déploiement avant de merger.</li></ul><h4 class=\"fiche-h2\">5.5 Workflow basé sur le Fork</h4><p class=\"fiche-p\">Un FORK crée une copie indépendante d'un projet existant (utile pour contribuer à un projet qu'on ne possède pas, sans affecter l'original). On travaille sur son fork (souvent en feature branch), puis on propose une Pull/Merge Request vers le projet d'origine.</p><h3 class=\"fiche-h1\">6. Pull Request / Merge Request</h3><p class=\"fiche-p\">Mécanisme fourni par les plateformes (GitHub = Pull Request, GitLab = Merge Request, mêmes fonctionnalités) pour organiser une revue de code AVANT intégration dans la branche principale.</p><ul class=\"fiche-ul\"><li>Se fait toujours à partir d'une feature branch.</li><li>On désigne un assignee (responsable d'accepter) et des reviewers (relecteurs).</li><li>On itère sur les commentaires jusqu'à validation, puis la branche peut être supprimée automatiquement.</li></ul><p class=\"fiche-note\">La revue de code (avant toute PR/MR) sert à vérifier la qualité du code ajouté — c'est une bonne pratique indépendante de l'outil utilisé.</p>",
    fiche: "<h3 class=\"fiche-h1\">3 zones (The Three States)</h3><table class=\"fiche-table\"><thead><tr><th>Zone</th><th>Commande pour avancer</th></tr></thead><tbody><tr><td>Working Directory</td><td>(édition)</td></tr><tr><td>Index/Staging</td><td>git add</td></tr><tr><td>HEAD (dépôt local)</td><td>git commit</td></tr></tbody></table><h3 class=\"fiche-h1\">Branche / Merge / Rebase</h3><ul class=\"fiche-ul\"><li>Branche = pointeur sur un commit</li><li>Merge = commit avec 2+ parents</li><li>Rebase = réécrit l'historique en linéaire — JAMAIS sur du public déjà poussé</li><li>Fast-forward = simple déplacement de pointeur, sans nouveau commit</li></ul><h3 class=\"fiche-h1\">Annuler — quelle commande choisir ?</h3><table class=\"fiche-table\"><thead><tr><th>Besoin</th><th>Commande</th></tr></thead><tbody><tr><td>Modifier le dernier commit</td><td>amend</td></tr><tr><td>Annuler un commit déjà public</td><td>revert (crée un commit inverse)</td></tr><tr><td>Revenir en arrière, tout garder</td><td>reset --soft</td></tr><tr><td>Revenir en arrière + Index</td><td>reset</td></tr><tr><td>Tout écraser (irréversible)</td><td>reset --hard</td></tr></tbody></table><h3 class=\"fiche-h1\">Workflows — à savoir distinguer</h3><table class=\"fiche-table\"><thead><tr><th>Modèle</th><th>Cas d'usage</th></tr></thead><tbody><tr><td>Centralisé</td><td>Petit projet, simple, mais peu scalable</td></tr><tr><td>Feature Branch</td><td>1 branche par fonctionnalité</td></tr><tr><td>GitFlow</td><td>Projet à releases versionnées (master+develop+feature+release+hotfix)</td></tr><tr><td>GitHub workflow</td><td>Livraison continue, master toujours déployable</td></tr><tr><td>Fork</td><td>Contribuer à un projet qu'on ne possède pas</td></tr></tbody></table><h3 class=\"fiche-h1\">Pull/Merge Request</h3><p class=\"fiche-p\">Pull Request (GitHub) = Merge Request (GitLab) : revue de code avant fusion dans la branche principale, avec assignee + reviewers.</p>",

  'cloud-virt': {
    matiere: "Cloud computing",
    chapitre: "Concepts de virtualisation",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>3_virtualisation.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Le problème de départ</h3><p class=\"fiche-p\">Chaque application a des besoins spécifiques (CPU, mémoire, stockage, OS, librairies). Solution naïve : une application par serveur physique → sous-utilisation massive des ressources. Deuxième solution : plusieurs applications par serveur → problèmes de contrôle de ressources et d'ISOLATION (ex : une mise à jour système pour l'app A peut casser l'app B sur le même serveur).</p><h3 class=\"fiche-h1\">2. La virtualisation par machines virtuelles (VM)</h3><p class=\"fiche-p\">Idée : créer des ressources virtuelles à partir de ressources physiques, via un HYPERVISEUR — une couche logicielle qui fournit l'abstraction d'une ou plusieurs machines \"nues\" au-dessus d'une vraie machine physique. Depuis l'intérieur d'une VM, impossible de distinguer une ressource physique d'une ressource virtuelle.</p><table class=\"fiche-table\"><thead><tr><th>Type d'hyperviseur</th><th>Principe</th><th>Exemples</th></tr></thead><tbody><tr><td>Type I (natif)</td><td>Couche logicielle de très bas niveau, OS spécialisé, tourne directement sur le matériel — plus EFFICACE.</td><td>VMware ESX, Xen</td></tr><tr><td>Type II (hébergé)</td><td>Application intermédiaire qui s'appuie sur un OS hôte existant — moins efficace (plus de couches) mais plus SIMPLE à installer.</td><td>VMware Workstation/Fusion/Player, VirtualBox</td></tr></tbody></table><p class=\"fiche-p\">Intérêts de la virtualisation : faire tourner plusieurs OS simultanément sur le même matériel, sauvegarder/rembobiner l'état d'un système (snapshot), renforcer l'isolation et la sécurité de certaines applications.</p><h3 class=\"fiche-h1\">3. Scalabilité et élasticité</h3><table class=\"fiche-table\"><thead><tr><th>Notion</th><th>Définition</th></tr></thead><tbody><tr><td>Scalabilité faible (weak scaling)</td><td>Puis-je faire PLUS de travail si j'ai plus de ressources ?</td></tr><tr><td>Scalabilité forte (strong scaling)</td><td>Puis-je faire la MÊME charge en MOINS de temps avec plus de ressources ?</td></tr><tr><td>Élasticité / Autoscaling</td><td>Adapter dynamiquement les ressources à la charge courante — objectif : ni trop peu (perte de qualité de service), ni trop (gaspillage payant).</td></tr></tbody></table><table class=\"fiche-table\"><thead><tr><th>Scalabilité verticale (Scale up/down)</th><th>Scalabilité horizontale (Scale out/in)</th></tr></thead><tbody><tr><td>Remplacer une VM par une VM plus puissante (plus de vCPU/RAM). Simple, mais limitée et à coût non linéaire.</td><td>Ajouter plusieurs instances en parallèle (plusieurs VM). Plus scalable, mais complexifie le développement (synchronisation, débogage d'un système distribué).</td></tr></tbody></table><h3 class=\"fiche-h1\">4. Les conteneurs : une alternative plus légère</h3><p class=\"fiche-p\">Motivation : un microservice par VM consomme trop de ressources (chaque VM embarque son propre OS invité complet) et démarre trop lentement (plusieurs minutes, il faut démarrer tout un système). Les conteneurs permettent de PARTAGER l'OS hôte entre applications, tout en restant le plus isolés possible.</p><p class=\"fiche-p\">On distingue 3 niveaux de virtualisation : Type-1 (natif), Type-2 (hébergé), et Type-3 (conteneurs = virtualisation au niveau OS — OS-level virtualization) où plusieurs conteneurs partagent un même Container Engine sur un seul OS hôte.</p><h4 class=\"fiche-h2\">4.1 Mécanismes Linux exploités par les conteneurs</h4><ul class=\"fiche-ul\"><li>Namespaces : isolent ce qu'un processus donné peut voir (réseau, utilisateurs, PID...).</li><li>Cgroups (control groups) : appliquent des limites d'allocation de ressources.</li><li>Capacités : contrôlent les opérations qu'un processus/utilisateur est autorisé à effectuer.</li><li>Seccomp : filtre les appels système légitimes qu'un processus peut faire.</li></ul><h4 class=\"fiche-h2\">4.2 Image vs Conteneur</h4><p class=\"fiche-p\">Une IMAGE de conteneur empaquette une application et ses dépendances, décrite par un fichier texte (ex : Dockerfile). Un CONTENEUR est une instance d'une image, exécutée dans un environnement isolé.</p><p class=\"fiche-note\">Analogie orientée objet donnée en cours : une image = une classe, un conteneur = une instance de cette classe.</p><table class=\"fiche-table\"><thead><tr><th>Image de VM (snapshot)</th><th>Image de conteneur</th></tr></thead><tbody><tr><td>Sauvegarde un ÉTAT complet (mémoire, disques virtuels...) à un instant donné ; la VM redémarre dans cet état.</td><td>Une simple copie d'une partie d'un système de fichiers ; PAS de notion d'état sauvegardé.</td></tr></tbody></table><h3 class=\"fiche-h1\">5. Conteneurs et CI/CD</h3><ul class=\"fiche-ul\"><li>Portabilité des tests : un environnement de test créé à partir d'une image Docker s'exécute sur n'importe quelle plateforme de CI.</li><li>Isolation des tests : un nouveau conteneur par étape de test → pas de pollution entre étapes ni entre exécutions successives.</li><li>Démarrage rapide → les tests peuvent être exécutés très fréquemment.</li><li>Infrastructure as Code : construire l'application à partir d'images (Dockerfile), les stocker dans un registre, puis les exécuter en production — élimine le fameux \"ça marche pourtant sur ma machine\".</li></ul><h3 class=\"fiche-h1\">6. VM vs Conteneurs — points communs et différences</h3><p class=\"fiche-p\">Points communs : faciliter le déploiement (encapsuler code + configuration pour la portabilité), partager des ressources en sécurité (isolation hôte/invités), isoler la performance (contrôler précisément les ressources allouées à chacun, différencier la qualité de service).</p><p class=\"fiche-note\">Différence fondamentale à retenir pour un examen : une VM embarque son propre OS invité complet (isolation plus forte, mais plus lourde et plus lente à démarrer) ; un conteneur PARTAGE l'OS hôte via le Container Engine (plus léger, démarrage quasi-instantané, mais isolation un cran en dessous de celle d'une VM).</p>",
    fiche: "<h3 class=\"fiche-h1\">Pourquoi virtualiser</h3><p class=\"fiche-p\">1 app/serveur = sous-utilisation. Plusieurs apps/serveur sans virtualisation = problèmes de contrôle de ressources et d'isolation.</p><h3 class=\"fiche-h1\">Hyperviseur — Type I vs Type II</h3><table class=\"fiche-table\"><thead><tr><th>Type</th><th>Principe</th><th>Exemples</th></tr></thead><tbody><tr><td>I (natif)</td><td>Bas niveau, direct sur le matériel, + efficace</td><td>VMware ESX, Xen</td></tr><tr><td>II (hébergé)</td><td>Sur un OS hôte, + simple à installer</td><td>VirtualBox, VMware Workstation</td></tr></tbody></table><h3 class=\"fiche-h1\">Scalabilité — vocabulaire à distinguer</h3><ul class=\"fiche-ul\"><li>Faible : + de ressources → + de travail</li><li>Forte : + de ressources → même travail + vite</li><li>Verticale (scale up/down) : VM plus puissante</li><li>Horizontale (scale out/in) : + de VM en parallèle</li></ul><h3 class=\"fiche-h1\">Conteneurs vs VM — le tableau qui tombe souvent en exam</h3><table class=\"fiche-table\"><thead><tr><th></th><th>VM</th><th>Conteneur</th></tr></thead><tbody><tr><td>OS</td><td>1 OS invité par VM</td><td>Partagé via le Container Engine</td></tr><tr><td>Démarrage</td><td>Lent (minutes)</td><td>Quasi instantané</td></tr><tr><td>Isolation</td><td>Forte</td><td>Plus légère (namespaces, cgroups, capacités, seccomp)</td></tr><tr><td>Image</td><td>Snapshot d'un ÉTAT complet</td><td>Copie d'un système de fichiers, PAS d'état</td></tr></tbody></table><h3 class=\"fiche-h1\">Analogie à retenir</h3><p class=\"fiche-p\">Image de conteneur = classe. Conteneur = instance.</p><h3 class=\"fiche-h1\">Conteneurs + CI/CD</h3><ul class=\"fiche-ul\"><li>Portabilité des tests (même image partout)</li><li>Isolation des tests (1 conteneur/étape)</li><li>Infrastructure as Code : Dockerfile → image → registre → prod</li></ul>",

  'cloud-cicd': {
    matiere: "Cloud computing",
    chapitre: "Integration et livraison continue (CI/CD)",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>4_integration_continue Devops.pdf</li></ul></div><h3 class=\"fiche-h1\">1. DevOps : bien plus qu'un outil</h3><p class=\"fiche-p\">DevOps (simple définition) : ensemble de techniques et d'outils facilitant le passage du développement à la production. Mais c'est en réalité un modèle de fonctionnement de l'entreprise, un modèle d'interactions entre équipes, et une véritable culture.</p><p class=\"fiche-p\">DevOps répond à un antagonisme fort entre deux équipes : les Dev veulent livrer des modifications au moindre coût et le plus vite possible, les Ops veulent la stabilité et la qualité du système. L'AUTOMATISATION est au cœur de la résolution de cette tension.</p><h3 class=\"fiche-h1\">2. Trois notions à bien distinguer</h3><table class=\"fiche-table\"><thead><tr><th>Notion</th><th>Définition</th></tr></thead><tbody><tr><td>Intégration continue (CI)</td><td>Le logiciel est reconstruit et testé à CHAQUE modification apportée par un programmeur.</td></tr><tr><td>Livraison continue (Continuous Delivery)</td><td>CI + techniques de déploiement automatisées, assurant une mise en production RAPIDE ET FIABLE — le logiciel PEUT être mis en prod à tout moment (mais la mise en prod elle-même reste, en général, décidée par un humain).</td></tr><tr><td>Déploiement continu (Continuous Deployment)</td><td>Chaque modification passe AUTOMATIQUEMENT toute la chaîne jusqu'à la mise en production — plus AUCUNE intervention humaine.</td></tr></tbody></table><p class=\"fiche-note\">Piège classique d'examen : livraison continue ≠ déploiement continu. La différence est la présence ou non d'une validation humaine avant la mise en production réelle.</p><h3 class=\"fiche-h1\">3. Pourquoi l'intégration continue ?</h3><p class=\"fiche-p\">Pratiques regroupées sous CI : construire une version fonctionnelle chaque jour, exécuter les tests tous les jours, committer souvent, et un système qui surveille le dépôt : à chaque changement il récupère le code, compile, teste, et prévient le développeur en cas d'échec.</p><p class=\"fiche-example\"><strong>Exemple —</strong> Le chef prévient qu'il arrive dans une heure avec des investisseurs pour voir la dernière version. Avec CI : non-événement, tout marche. Sans CI : stress, l'état du prototype n'est pas clair, le merge est difficile, la démo échoue.</p><p class=\"fiche-example\"><strong>Exemple —</strong> La faillite de Knight Capital (trading haute fréquence) : le 1er août 2012, une erreur de mise à jour + un code de contrôle des transactions cassé (SANS tests de régression) a fait exécuter 4 millions de transactions erronées en quelques minutes → plus de 400 millions de dollars de pertes. Illustration concrète du coût de l'absence de tests de régression automatisés.</p><p class=\"fiche-p\">Bénéfices clés de la CI : échouer AU PLUS TÔT (détecter une erreur tout de suite plutôt que tard), détecter les problèmes d'intégration entre équipes rapidement, détecter les régressions (une fonctionnalité qui casse après une modification).</p><h4 class=\"fiche-h2\">3.1 Mise en place de la CI</h4><p class=\"fiche-p\">Besoins techniques : un dépôt de code source, un processus de construction automatique, une plateforme d'exécution des tests. Besoins organisationnels : volonté de travailler de façon incrémentale, procédure commune d'envoi des modifications.</p><p class=\"fiche-p\">Procédure standard d'envoi de modification : (1) partir de la dernière version, (2) écrire les tests + faire les changements, (3) exécuter tous les tests localement, (4) récupérer les dernières modifications du dépôt et re-tester, (5) envoyer sa contribution — ce qui déclenche automatiquement les tests d'intégration continue.</p><table class=\"fiche-table\"><thead><tr><th>Besoin</th><th>Outils cités en cours</th></tr></thead><tbody><tr><td>Dépôt de code</td><td>svn, git, GitHub</td></tr><tr><td>Construction automatique</td><td>Make, Ant, Maven</td></tr><tr><td>Exécution des tests</td><td>xUnit, JUnit</td></tr><tr><td>Orchestration CI/CD</td><td>Jenkins, GitLab CI/CD, GitHub Actions, Docker</td></tr></tbody></table><h3 class=\"fiche-h1\">4. La livraison continue</h3><p class=\"fiche-p\">Objectif : un logiciel doit pouvoir être mis en production À TOUT MOMENT, avec des procédures de livraison entièrement automatisées. Motivation : la mise en prod est une phase critique et complexe — la faire souvent réduit les risques et améliore la maîtrise du processus.</p><p class=\"fiche-p\">Lien avec le Lean Startup : démarrer \"maigre\", évaluer l'intérêt d'une fonctionnalité avec le minimum d'effort investi.</p><p class=\"fiche-example\"><strong>Exemple —</strong> Site e-commerce : on fait de la pub pour \"choisir son jour de livraison\" AVANT même d'avoir développé la fonctionnalité. Si beaucoup de clics → on développe une version basique rapidement (avantage compétitif offert par la livraison continue), puis on observe l'usage réel pour prioriser les améliorations.</p><h4 class=\"fiche-h2\">4.1 Les étapes d'une procédure de livraison continue</h4><table class=\"fiche-table\"><thead><tr><th>#</th><th>Étape</th><th>Détail</th></tr></thead><tbody><tr><td>1</td><td>Commit d'une modification</td><td></td></tr><tr><td>2</td><td>Tests unitaires (= intégration continue)</td><td>Vérifient le code isolément</td></tr><tr><td>3</td><td>Tests de validation fonctionnelle (acceptance tests)</td><td>Tests boîte noire : le logiciel répond-il au besoin client ? Automatisables</td></tr><tr><td>4</td><td>Tests de performance</td><td>Le logiciel tient-il la charge ? Passage à l'échelle</td></tr><tr><td>5</td><td>Tests exploratoires</td><td>NON automatisés, faits par des experts (ex : tests d'utilisabilité)</td></tr><tr><td>6</td><td>Déploiement en production</td><td></td></tr></tbody></table><h4 class=\"fiche-h2\">4.2 Infrastructure as Code</h4><p class=\"fiche-p\">La configuration de l'infrastructure d'exécution est elle-même écrite comme du CODE, gérée par le gestionnaire de versions (comme n'importe quel fichier source).</p><ul class=\"fiche-ul\"><li>Avantages : limite les risques d'erreur, garantit toujours le même environnement, permet de tracer/reproduire les erreurs, lie les modifications d'infra à celles de l'application, déploiement rapide d'un environnement.</li><li>Outils : Docker/Dockerfile (packaging), Chef/Puppet/Ansible (recettes de configuration), Vagrant/Terraform (approvisionnement de VM/conteneurs).</li></ul><h4 class=\"fiche-h2\">4.3 Techniques de mise en production à moindre risque</h4><table class=\"fiche-table\"><thead><tr><th>Technique</th><th>Principe</th></tr></thead><tbody><tr><td>Canary release</td><td>Rendre la nouvelle version disponible à un petit sous-ensemble d'utilisateurs (ex : 10%) pour tester en conditions réelles avant généralisation.</td></tr><tr><td>Blue-Green deployment</td><td>Deux environnements de production actifs en parallèle (Bleu/Vert), un seul reçoit le trafic réel. On teste le nouveau logiciel sur l'environnement inactif, puis on bascule le ROUTAGE des requêtes — changement de version quasi instantané, et retour en arrière tout aussi rapide.</td></tr></tbody></table><p class=\"fiche-note\">Toujours faire des smoke tests avant la mise en production réelle : vérifier simplement que l'application démarre et fonctionne a minima.</p><h3 class=\"fiche-h1\">5. Le pipeline CI/CD (GitHub Actions / GitLab CI)</h3><p class=\"fiche-p\">Fonctionnement similaire chez GitHub et GitLab, défini dans un fichier YAML (gitlab-ci.yml à la racine, ou fichiers dans .github/workflows/ pour GitHub).</p><table class=\"fiche-table\"><thead><tr><th>Concept</th><th>Définition</th></tr></thead><tbody><tr><td>Workflow (pipeline)</td><td>Procédure automatisée associée au dépôt.</td></tr><tr><td>Job</td><td>Composant d'un workflow ; s'exécute en parallèle par défaut, sauf dépendances définies via des stages.</td></tr><tr><td>Stage</td><td>Regroupe des jobs et définit leur ORDRE d'exécution (l'ordre de déclaration des stages fixe l'ordre d'exécution).</td></tr><tr><td>Step</td><td>Une étape (action/commande) à l'intérieur d'un job.</td></tr><tr><td>Runner</td><td>Agent qui exécute réellement un job sur un serveur (fourni par la plateforme, ou auto-hébergé).</td></tr></tbody></table><p class=\"fiche-note\">Piège à connaître : les jobs s'exécutent dans des contextes d'exécution INDÉPENDANTS et NE PARTAGENT PAS de données entre eux par défaut (chaque job démarre \"propre\"). Sur les runners partagés GitLab, les jobs tournent dans des conteneurs Docker.</p><h3 class=\"fiche-h1\">6. Mesurer l'impact du CI/CD : les 4 métriques DORA</h3><p class=\"fiche-p\">Mettre en place le CI/CD a un coût — il faut pouvoir mesurer si l'investissement porte ses fruits. Les 4 métriques DORA (rapports \"State of DevOps\") :</p><table class=\"fiche-table\"><thead><tr><th>Métrique</th><th>Question posée</th></tr></thead><tbody><tr><td>Fréquence des déploiements</td><td>À quelle fréquence l'équipe livre-t-elle en production ?</td></tr><tr><td>Délai de mise en production (Lead time)</td><td>Temps nécessaire à un commit pour atteindre la production.</td></tr><tr><td>Taux de déploiements problématiques</td><td>% des déploiements qui causent un problème en production.</td></tr><tr><td>Temps de résolution des problèmes (MTTR)</td><td>Combien de temps pour corriger un problème apparu en production ?</td></tr></tbody></table>",

>Fréquence des déploiements</li><li>Délai de mise en prod (lead time)</li><li>Taux de déploiements problématiques</li><li>Temps de résolution (MTTR)</li></ul>",

  'ihm-chap2': {
    matiere: "Ingénierie des Interfaces Humain-Machine (IHM)",
    chapitre: "Chapitre 2 - Ergonomie et accessibilite",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>Chapitre 2 - Ergonomie.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Ergonomie vs Design</h3><p class=\"fiche-p\">L'ergonomie consiste a adapter le travail, les outils et l'environnement a l'homme (et non l'inverse) : ce qui est ergonomique est ce qui est adapte. Le Design est un processus intellectuel creatif, source d'innovation, sans regles obligatoires, mais dont le resultat doit s'inscrire dans le contexte d'utilisation.</p><table class=\"fiche-table\"><thead><tr><th>Critère</th><th>Ergonomie</th><th>Design</th></tr></thead><tbody><tr><td>Nature</td><td>Activité scientifique</td><td>Activité créative (innovation)</td></tr><tr><td>Objectif</td><td>Adapté à un contexte d'utilisation</td><td>Prend en compte le contexte (pas forcément adapté)</td></tr><tr><td>Place dans le cycle</td><td>Intégrée tout au long de la conception</td><td>Étape ponctuelle de la conception</td></tr></tbody></table><h3 class=\"fiche-h1\">2. Les courants de Design informatique</h3><table class=\"fiche-table\"><thead><tr><th>Courant</th><th>Principe</th></tr></thead><tbody><tr><td>Responsive Design</td><td>Règles d'adaptation de la présentation à la résolution/taille de l'écran (media-queries, Bootstrap) pour la lisibilité et la navigation multi-plateforme.</td></tr><tr><td>Flat Design</td><td>Réaction au skeuomorphisme (reproduire l'existant physique) : minimise le graphisme, supprime le relief, utilise seulement couleurs et typographie pour hiérarchiser l'information.</td></tr><tr><td>Material Design (Google)</td><td>Corrige les lacunes du Flat Design (perte du relief = perte de la notion de \"cliquable\", de superposition, de feedback) via la métaphore du papier et de l'encre.</td></tr></tbody></table><h3 class=\"fiche-h1\">3. Les critères ergonomiques génériques</h3><p class=\"fiche-p\">Règles génériques basées sur l'analyse du comportement humain \"moyen\", utilisables en évaluation experte (appliquées par des experts, sans utilisateurs) pour évaluer un produit existant ou éliminer de grossières erreurs d'utilisabilité. Classées en 4 objectifs :</p><ul class=\"fiche-ul\"><li>Faciliter l'apprentissage lors de la première approche (s'appuyer sur l'existant, établir des correspondances naturelles, respecter les habitudes).</li><li>Faciliter la recherche d'information, sa perception, sa reconnaissance, sa compréhension (clarté visuelle, structuration cohérente, minimiser la charge de traitement).</li><li>Faciliter le contrôle de l'activité (planification, exécution, contrôle des résultats, gestion des erreurs).</li><li>S'adapter/permettre l'adaptation à l'utilisateur (plusieurs façons d'accomplir une tâche, marges d'initiative, personnalisation).</li></ul><h3 class=\"fiche-h1\">4. Les 10 heuristiques de Nielsen</h3><p class=\"fiche-p\">Jakob Nielsen a défini dans les années 90, 10 heuristiques pour les systèmes interactifs WIMP :</p><table class=\"fiche-table\"><thead><tr><th>#</th><th>Heuristique</th><th>Idée clé</th></tr></thead><tbody><tr><td>1</td><td>Visibilité de l'état du système</td><td>Feedback approprié, dans un temps raisonnable.</td></tr><tr><td>2</td><td>Correspondance avec le monde réel</td><td>Langage de l'utilisateur, conventions du monde réel, séquence naturelle.</td></tr><tr><td>3</td><td>Liberté et contrôle de l'utilisateur</td><td>\"Sortie de secours\" claire, undo/redo.</td></tr><tr><td>4</td><td>Cohérence et standards</td><td>Suivre les conventions de la plateforme.</td></tr><tr><td>5</td><td>Prévention des erreurs</td><td>Empêcher le problème plutôt que bien l'annoncer après coup.</td></tr><tr><td>6</td><td>Reconnaître plutôt que se souvenir</td><td>Rendre visibles objets/actions/options en permanence.</td></tr><tr><td>7</td><td>Flexibilité d'utilisation</td><td>Raccourcis pour utilisateurs experts, personnalisation des actions récurrentes.</td></tr><tr><td>8</td><td>Esthétique et design minimaliste</td><td>Éviter les informations peu pertinentes qui concurrencent l'essentiel.</td></tr><tr><td>9</td><td>Aide au diagnostic et à la récupération des erreurs</td><td>Messages d'erreur en langage clair, précis, avec solution.</td></tr><tr><td>10</td><td>Aide et documentation</td><td>Facile à trouver, centrée sur la tâche, concrète, concise.</td></tr></tbody></table><p class=\"fiche-note\">Point méthodologique : lors d'une évaluation experte (Nielsen ou Bastien-Scapin), il faut toujours noter la définition du critère, le contexte (plateforme, version), les points positifs à conserver, et les points à améliorer.</p><h3 class=\"fiche-h1\">5. Les Check-lists</h3><p class=\"fiche-p\">Recommandations dépendantes d'un domaine très spécifique (une tâche précise, une technique d'interaction, une plateforme, un type d'utilisateur) — par exemple une check-list dédiée à l'évaluation des formulaires web (ordre des champs, distinction obligatoire/optionnel, position du curseur par défaut, possibilité d'annuler/corriger, page de confirmation...).</p><h3 class=\"fiche-h1\">6. Prise en compte des publics empêchés — Accessibilité numérique</h3><p class=\"fiche-p\">Les recommandations génériques et les heuristiques occultent souvent les empêchements fonctionnels (non/mal-voyants, seniors, daltoniens...). En France, une loi impose depuis 2005 (renforcée en 2012) l'accessibilité numérique de tous les services publics en ligne, encadrée par le RGAA (référentiel général d'amélioration de l'accessibilité).</p><p class=\"fiche-p\">Les recommandations WCAG (W3C) structurent l'accessibilité autour de 4 principes (acronyme POUR) :</p><ul class=\"fiche-ul\"><li>Perceivable (perceptible) : rendre perceptibles les éléments de l'interface.</li><li>Operable (opérable) : rendre opérables les éléments d'action et dispositifs d'entrée.</li><li>Understandable (compréhensible) : rendre compréhensibles les composants de l'interface.</li><li>Robust (compatible/robuste) : rester compatible dans le contexte spécifique d'utilisation.</li></ul><p class=\"fiche-note\">Le respect des WCAG favorise aussi le référencement par les moteurs de recherche (SEO) — un bénéfice indirect de l'accessibilité.</p>",
    fiche: "<h3 class=\"fiche-h1\">Ergonomie vs Design — 1 phrase chacun</h3><ul class=\"fiche-ul\"><li>Ergonomie : adapter l'outil à l'humain (activité scientifique).</li><li>Design : processus créatif qui prend en compte le contexte (pas obligatoirement adapté).</li></ul><h3 class=\"fiche-h1\">3 courants de Design</h3><table class=\"fiche-table\"><thead><tr><th>Courant</th><th>Idée</th></tr></thead><tbody><tr><td>Responsive</td><td>S'adapte à l'écran</td></tr><tr><td>Flat</td><td>Minimalisme, pas de relief</td></tr><tr><td>Material</td><td>Relief + métaphore papier/encre (corrige Flat)</td></tr></tbody></table><h3 class=\"fiche-h1\">4 objectifs des critères ergonomiques</h3><ul class=\"fiche-ul\"><li>Faciliter l'apprentissage</li><li>Faciliter recherche/perception/compréhension de l'info</li><li>Faciliter le contrôle de l'activité</li><li>S'adapter à l'utilisateur</li></ul><h3 class=\"fiche-h1\">10 heuristiques de Nielsen — à savoir citer</h3><ul class=\"fiche-ul\"><li>1.Visibilité état système</li><li>2.Correspondance monde réel</li><li>3.Liberté/contrôle utilisateur</li><li>4.Cohérence/standards</li><li>5.Prévention erreurs</li><li>6.Reconnaître plutôt que se souvenir</li><li>7.Flexibilité d'utilisation</li><li>8.Esthétique minimaliste</li><li>9.Diagnostic/récupération erreurs</li><li>10.Aide et documentation</li></ul><h3 class=\"fiche-h1\">Accessibilité numérique — WCAG (POUR)</h3><ul class=\"fiche-ul\"><li>Perceptible</li><li>Opérable</li><li>Understandable (compréhensible)</li><li>Robuste/compatible</li></ul><p class=\"fiche-note\">RGAA = référentiel français ; loi obligatoire pour le secteur public depuis 2005/2012.</p>",

  'ihm-chap4': {
    matiere: "Ingénierie des Interfaces Humain-Machine (IHM)",
    chapitre: "Chapitre 4 - Taches et fonctionnalites",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>Chapitre 4 - Tâches et fonctionnalités.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Conception orientée fonctionnalités vs orientée tâches</h3><p class=\"fiche-p\">Pour un même besoin, deux grandes démarches de conception existent : la conception PAR FONCTIONNALITÉS et la conception PAR TÂCHE (centrée sur les buts de l'utilisateur). Ce cours se concentre sur la seconde approche.</p><p class=\"fiche-p\">En ergonomie, une TÂCHE est un but donné à l'individu dans des conditions déterminées (une abstraction) ; une ACTIVITÉ est ce qui se fait réellement dans une situation singulière.</p><table class=\"fiche-table\"><thead><tr><th>Type</th><th>Définition</th></tr></thead><tbody><tr><td>Tâche/activité à réaliser</td><td>Telle que conçue</td></tr><tr><td>Tâche/activité prescrite</td><td>Telle que présentée à l'utilisateur</td></tr><tr><td>Tâche/activité attendue</td><td>Telle qu'attendue par le client (prescripteur)</td></tr><tr><td>Tâche/activité redéfinie</td><td>Telle qu'interprétée par l'utilisateur</td></tr><tr><td>Tâche/activité effective</td><td>Telle qu'effectivement réalisée</td></tr></tbody></table><p class=\"fiche-note\">Exemple donné en cours : sèche-linge à minuterie (conception fonctionnelle, l'utilisateur règle un temps) vs sèche-linge à sonde (conception orientée tâche/but, l'utilisateur choisit son objectif \"linge sec\" et le système s'adapte).</p><h3 class=\"fiche-h1\">2. Le modèle de tâches</h3><p class=\"fiche-p\">Représentation arborescente de l'activité : chaque tâche exprime un but, décomposé en sous-tâches organisées temporellement, jusqu'aux tâches élémentaires (unités d'interaction). Plusieurs notations existent (UAN, CTT, K-MAD, E-COMM) ; ce cours utilise l'éditeur K-MADe (notation K-MAD).</p><h3 class=\"fiche-h1\">3. Les tâches : exécutant et ordonnancement</h3><p class=\"fiche-p\">Chaque tâche a un Exécutant qui définit son type :</p><ul class=\"fiche-ul\"><li>Utilisateur (humain) : réalisée par un ou plusieurs individus, sans le système.</li><li>Système : réalisée par le système seul, sans intervention humaine.</li><li>Interaction : communication entre l'humain et la machine.</li><li>Abstrait : uniquement pour une tâche décomposée dont l'exécutant n'est pas défini.</li></ul><p class=\"fiche-p\">L'ordre d'exécution des sous-tâches (opérateurs d'ordonnancement) :</p><table class=\"fiche-table\"><thead><tr><th>Opérateur</th><th>Signification</th></tr></thead><tbody><tr><td>Séquentiel</td><td>Les sous-tâches s'exécutent l'une après l'autre, dans l'ordre de lecture.</td></tr><tr><td>Sans ordre</td><td>L'une après l'autre, mais l'ordre n'est pas imposé.</td></tr><tr><td>Parallèle</td><td>Aucun ordre, pas besoin de terminer l'une avant de commencer l'autre.</td></tr><tr><td>Alternatif</td><td>Une seule des sous-tâches est réalisée.</td></tr></tbody></table><p class=\"fiche-p\">Décorations complémentaires possibles sur une tâche : optionnalité (pas obligatoire pour considérer l'activité complète), itération (réalisable plusieurs fois), pré-condition (condition booléenne requise, ex : avoir une CB pour payer au distributeur).</p><h3 class=\"fiche-h1\">4. Les concepts manipulés</h3><p class=\"fiche-p\">Ce sont les objets (physiques, numériques, virtuels) utilisés dans les tâches de l'arbre — certains seront liés aux données de la base, d'autres seront produits par le traitement informatique (ex : un ticket peut être un QR-code généré après paiement). Une fois définis, ils peuvent servir de conditions aux tâches.</p><h3 class=\"fiche-h1\">5. Validation du modèle de tâches</h3><p class=\"fiche-p\">Deux niveaux de validation à effectuer systématiquement :</p><h4 class=\"fiche-h2\">5.1 Validation syntaxique (règles à vérifier)</h4><ul class=\"fiche-ul\"><li>Chaque tâche décomposée se lit \"Pour faire T il faut faire T1, T2...\"</li><li>Chaque tâche feuille a un exécutant NON abstrait (interactif, système ou utilisateur).</li><li>Une tâche décomposée est abstraite, OU de l'exécutant commun à toutes ses sous-tâches.</li><li>Aucune tâche feuille n'a d'opérateur d'ordonnancement.</li><li>Toute tâche décomposée a un opérateur d'ordonnancement (séquentiel/alternatif/parallèle/sans ordre).</li><li>Aucune tâche décomposée n'a une seule sous-tâche.</li></ul><h4 class=\"fiche-h2\">5.2 Validation sémantique</h4><p class=\"fiche-p\">Le modèle doit correspondre fidèlement aux scénarios d'usage qui ont servi à le construire. Exemple d'incohérence donné en cours : un modèle où deux sous-tâches (envoi du billet par SMS OU par email) sont modélisées en ALTERNATIF, alors que le scénario montre que les deux se produisent en réalité (donc ce devrait être séquentiel ou sans ordre, pas alternatif).</p><p class=\"fiche-note\">Une fois le modèle validé, on peut le confronter à des scénarios plus sommaires (comme des cas d'utilisation UML) pour tester les cas limites non encore envisagés, grâce aux outils d'édition qui permettent de \"dérouler\" un scénario.</p><h3 class=\"fiche-h1\">6. Analyse de l'activité à partir du modèle de tâches</h3><p class=\"fiche-p\">Une fois le modèle syntaxiquement et sémantiquement correct, deux questions de fond à se poser :</p><ul class=\"fiche-ul\"><li>La composition des tâches suit-elle vraiment le BUT de l'utilisateur pour son activité, et non les contraintes d'un logiciel particulier ?</li><li>La dernière sous-tâche de chaque tâche permet-elle bien effectivement d'accomplir la tâche mère ?</li></ul><p class=\"fiche-note\">Cette analyse permet de repérer (et corriger) une conception qui s'éloignerait des objectifs réels du futur utilisateur.</p>",
    fiche: "<h3 class=\"fiche-h1\">2 démarches de conception</h3><ul class=\"fiche-ul\"><li>Par fonctionnalités (ce que fait le système)</li><li>Par tâche (le but de l'utilisateur) — approche retenue dans ce cours</li></ul><h3 class=\"fiche-h1\">5 déclinaisons tâche/activité</h3><ul class=\"fiche-ul\"><li>à réaliser (conçue)</li><li>prescrite (présentée)</li><li>attendue (par le client)</li><li>redéfinie (interprétée)</li><li>effective (réalisée)</li></ul><h3 class=\"fiche-h1\">4 types d'exécutant</h3><ul class=\"fiche-ul\"><li>Utilisateur</li><li>Système</li><li>Interaction</li><li>Abstrait (tâche décomposée uniquement)</li></ul><h3 class=\"fiche-h1\">4 opérateurs d'ordonnancement</h3><table class=\"fiche-table\"><thead><tr><th>Opérateur</th><th>Sens</th></tr></thead><tbody><tr><td>Séquentiel</td><td>L'une après l'autre, ordre imposé</td></tr><tr><td>Sans ordre</td><td>L'une après l'autre, ordre libre</td></tr><tr><td>Parallèle</td><td>En même temps, pas besoin d'attendre</td></tr><tr><td>Alternatif</td><td>Une seule des deux</td></tr></tbody></table><h3 class=\"fiche-h1\">6 règles de validation syntaxique — à connaître par cœur pour un exercice</h3><ul class=\"fiche-ul\"><li>Tâche feuille → exécutant non abstrait</li><li>Tâche décomposée → a un opérateur d'ordonnancement</li><li>Tâche feuille → pas d'opérateur d'ordonnancement</li><li>Pas de tâche décomposée avec 1 seule sous-tâche</li></ul><h3 class=\"fiche-h1\">Validation sémantique</h3><p class=\"fiche-p\">Le modèle doit refléter fidèlement le scénario — piège classique : confondre \"alternatif\" (un seul choix) et \"sans ordre\"/\"séquentiel\" (les deux se produisent).</p>",
    corriges: "<p class=\"fiche-p\">Les annales IHM couvrent plusieurs chapitres a la fois. Voir les corriges rattaches au Chapitre 7 (Developpement/Tests) pour les questions transversales des annales 2020 et 2021.</p>"

  'ihm-chap5': {
    matiere: "Ingénierie des Interfaces Humain-Machine (IHM)",
    chapitre: "Chapitre 5 - Creation, ideation pour UI",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>Chapitre 5 - Conception Vue UI Ideation.pdf</li></ul></div><h3 class=\"fiche-h1\">1. L'exploration : une étape indispensable</h3><p class=\"fiche-p\">Une fois le besoin compris, plusieurs solutions sont généralement possibles. Explorer ces solutions, les comparer et les discuter permet de choisir la meilleure, plutôt que de se figer sur la première idée venue.</p><p class=\"fiche-example\"><strong>Exemple —</strong> L'exemple de la classe de poterie : un groupe noté sur la quantité produit finalement le meilleur pot (en apprenant de ses erreurs au fil des essais), tandis que le groupe noté sur la qualité, resté bloqué à théoriser la perfection, ne produit qu'un tas d'argile raté. Explorer/itérer vaut mieux que chercher la solution parfaite du premier coup.</p><p class=\"fiche-p\">3 pré-requis pour être créatif [Lösch 2009] : être motivé, maîtriser le domaine d'application (bien comprendre les besoins des utilisateurs), et maîtriser des outils/méthodes de créativité.</p><h3 class=\"fiche-h1\">2. Le Design Thinking</h3><p class=\"fiche-p\">Processus de conception visant à résoudre des problèmes complexes par des solutions innovantes, en s'appuyant sur l'empathie, la créativité, la co-création, l'itération et le droit à l'erreur.</p><p class=\"fiche-p\">La d.school (Stanford) propose 5 étapes séquentielles :</p><table class=\"fiche-table\"><thead><tr><th>Étape</th><th>But</th></tr></thead><tbody><tr><td>Empathie</td><td>Se mettre à la place des futurs utilisateurs (ne pas concevoir pour soi-même).</td></tr><tr><td>Définition</td><td>Identifier précisément le problème (méthodes d'analyse du besoin).</td></tr><tr><td>Idéation</td><td>Générer des idées (voir méthodes ci-dessous).</td></tr><tr><td>Prototypes</td><td>Réaliser des prototypes pour tester les idées sélectionnées.</td></tr><tr><td>Tests</td><td>Tester auprès des utilisateurs.</td></tr></tbody></table><p class=\"fiche-note\">Le Nielsen Norman Group propose une variante ITÉRATIVE de ces étapes (plutôt que strictement séquentielle), avec ajout explicite d'une étape d'implémentation après le prototypage et les tests — pour mieux coller aux méthodes de conception centrée utilisateur.</p><h3 class=\"fiche-h1\">3. Les ateliers d'idéation</h3><p class=\"fiche-p\">La production d'idées se fait en ateliers, souvent plusieurs pour un même problème (angles environnemental, technique, usage...). 3 étapes de préparation d'un atelier :</p><ul class=\"fiche-ul\"><li>Sélectionner les participants (pas nécessairement les utilisateurs finaux — dépend de l'objectif de l'atelier).</li><li>Choisir le lieu (salle grande, calme, accueillante, conviviale).</li><li>Prévoir le matériel (contraint par la méthode, + toujours du matériel d'expression libre : tableau blanc, feuilles, feutres, caméscope...).</li></ul><p class=\"fiche-p\">3 temps obligatoires dans le déroulement d'un atelier :</p><ul class=\"fiche-ul\"><li>Exploration : chacun propose ses idées et réagit à celles des autres, sans jugement de valeur.</li><li>Recueil : les animateurs collectent toutes les idées émises.</li><li>Discussion : tri, organisation, sélection collective des idées.</li></ul><p class=\"fiche-note\">Un exercice d'échauffement (\"Ice Breaker\") en tout début d'atelier est recommandé, surtout si les participants ne se connaissent pas ou si le sujet est sensible/intime.</p><h3 class=\"fiche-h1\">4. Méthodes d'idéation</h3><h4 class=\"fiche-h2\">4.1 Le brainstorming</h4><p class=\"fiche-p\">Outil le plus connu et le moins coûteux — idées exprimées par des mots, en 3 phases :</p><ul class=\"fiche-ul\"><li>Préparation : désigner un animateur, fixer la durée (10-20 min), décider du mode de recueil des idées.</li><li>Réunion de créativité : l'animateur fait respecter 4 principes — ne pas critiquer, se laisser aller, rebondir sur les idées des autres, produire un maximum d'idées sans imposer les siennes.</li><li>Exploitation : synthétiser et organiser les idées pour les comparer et choisir.</li></ul><h4 class=\"fiche-h2\">4.2 Le sketching</h4><p class=\"fiche-p\">Un sketch [Buxton, 2007] doit être : rapide à produire, livrable à tout moment, peu coûteux, jetable, nombreux, pas trop détaillé (ni trop proche d'une solution réelle), favorisant la discussion, et volontairement ambigu. Un bon sketch est un sketch qui suscite la discussion — les sketchs doivent être vus ensemble pour être comparés.</p><h4 class=\"fiche-h2\">4.3 Les cartes d'idéation</h4><p class=\"fiche-p\">Cartes (ex : UX-Cards de Carine Lallemand) utilisées pour stimuler l'exploration d'une dimension que les participants n'auraient pas naturellement explorée (ex : une carte \"Plaisir/Stimulation\"). Utilisables en combinaison avec les autres méthodes (ex : pendant un brainstorming).</p><h3 class=\"fiche-h1\">5. La maquette (prototypage)</h3><p class=\"fiche-p\">Représentation graphique (pas nécessairement fonctionnelle) de l'interface, à différents niveaux de fidélité graphique. Supports possibles : papier, carton, écran. Logiciels courants : Balsamiq, Axure.</p><h3 class=\"fiche-h1\">6. Sélection rationnelle des idées : la méthode COQ (QOC)</h3><p class=\"fiche-p\">Après l'exploration, il faut sélectionner et JUSTIFIER les idées retenues, de façon rationnelle plutôt qu'affective. La notation COQ (Critères, Options, Questions) compare les Options (solutions issues des ateliers) à une Question de conception, selon des Critères définis dès le début du projet par l'équipe (besoins non fonctionnels, préférences utilisateur, contraintes d'équipe comme le temps de développement...).</p><p class=\"fiche-p\">Pour chaque couple (option, critère), la relation est catégorisée :</p><table class=\"fiche-table\"><thead><tr><th>Relation</th><th>Représentation graphique</th></tr></thead><tbody><tr><td>Satisfait le critère</td><td>Trait plein</td></tr><tr><td>Contredit le critère</td><td>Trait pointillé</td></tr><tr><td>Neutre / sans objet</td><td>Pas de trait</td></tr></tbody></table><p class=\"fiche-note\">Le schéma de sélection COQ/QOC doit être conservé pour la maintenance et l'évolution futures du système, afin de ne pas se reposer les mêmes questions plus tard.</p>",
    fiche: "<h3 class=\"fiche-h1\">Pourquoi explorer</h3><p class=\"fiche-p\">Comparer plusieurs solutions (justifiées et argumentées) plutôt que de se figer sur la première idée — l'exemple de la classe de poterie l'illustre (itérer > théoriser).</p><h3 class=\"fiche-h1\">Design Thinking — 5 étapes (d.school)</h3><ul class=\"fiche-ul\"><li>Empathie</li><li>Définition</li><li>Idéation</li><li>Prototypes</li><li>Tests</li></ul><p class=\"fiche-note\">Nielsen Norman Group : version itérative + ajout de l'implémentation après prototypes/tests.</p><h3 class=\"fiche-h1\">Atelier d'idéation — 3+3</h3><ul class=\"fiche-ul\"><li>Préparation : participants, lieu, matériel</li><li>Déroulement : exploration → recueil → discussion</li><li>+ Ice Breaker en option au début</li></ul><h3 class=\"fiche-h1\">2 méthodes clés</h3><table class=\"fiche-table\"><thead><tr><th>Méthode</th><th>À retenir</th></tr></thead><tbody><tr><td>Brainstorming</td><td>3 phases (préparation/créativité/exploitation), 4 règles : ne pas critiquer, se laisser aller, rebondir, quantité > qualité</td></tr><tr><td>Sketching</td><td>Rapide, jetable, ambigu volontairement, suscite la discussion</td></tr></tbody></table><h3 class=\"fiche-h1\">Méthode COQ (QOC)</h3><p class=\"fiche-p\">Compare des Options à une Question selon des Critères fixés à l'avance.</p><table class=\"fiche-table\"><thead><tr><th>Trait</th><th>Signification</th></tr></thead><tbody><tr><td>Plein</td><td>Satisfait le critère</td></tr><tr><td>Pointillé</td><td>Contredit le critère</td></tr><tr><td>Absent</td><td>Neutre</td></tr></tbody></table><p class=\"fiche-note\">À garder pour la maintenance : ne pas se reposer les mêmes questions plus tard.</p>",
    corriges: "<p class=\"fiche-p\">Les annales IHM couvrent plusieurs chapitres a la fois. Voir les corriges rattaches au Chapitre 7 (Developpement/Tests) pour les questions transversales des annales 2020 et 2021.</p>"
