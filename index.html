  'ihm-chap6': {
    matiere: "Ingénierie des Interfaces Humain-Machine (IHM)",
    chapitre: "Chapitre 6 - Modelisation de l interaction",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>Chapitre 6 - Modelisation de linteraction.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Le framework CAMELEON</h3><p class=\"fiche-p\">Framework de conception basé modèles : un système interactif adapté au contexte se conçoit en s'appuyant sur une hiérarchie de modèles, du plus abstrait (domaine/tâches, déjà vus aux chapitres 3-4) au plus concret (l'interface développée). Ce chapitre couvre les deux niveaux intermédiaires :</p><ul class=\"fiche-ul\"><li>Abstract UI : modèles représentant l'UI à un niveau indépendant des plateformes et modalités d'interaction.</li><li>Concrete UI : modèles représentant l'UI à un niveau de concrétisation suffisant pour prendre en compte les modalités d'interaction.</li></ul><p class=\"fiche-note\">Limite du framework, à connaître : il suppose que toute la connaissance nécessaire est capturée dans les modèles et qu'une stricte séparation des préoccupations est possible — hypothèses rarement vérifiées en pratique (l'impact des contraintes technologiques est souvent négligé).</p><h3 class=\"fiche-h1\">2. Niveau abstrait : l'IHM Fils de fer</h3><p class=\"fiche-p\">Principe : chaque tâche élémentaire interactive a besoin d'un ESPACE DE TRAVAIL (une zone qui présente les informations utiles et les widgets pour agir). Une IHM fils de fer exprime ces espaces et leurs relations, à partir du modèle de tâches.</p><p class=\"fiche-p\">Un ensemble de concepts (au pluriel) est noté [Concept], un élément unique est noté Concept (sans crochets).</p><p class=\"fiche-p\">Règles de construction à partir des opérateurs d'ordonnancement du modèle de tâches :</p><table class=\"fiche-table\"><thead><tr><th>Opérateur</th><th>Transformation en espaces de travail</th></tr></thead><tbody><tr><td>Séquentiel</td><td>Dans l'espace de la 1re tâche, un élément d'interaction permet d'accéder à l'espace de la 2e.</td></tr><tr><td>Parallèle</td><td>Les deux espaces de travail sont regroupés en un seul.</td></tr><tr><td>Alternatif</td><td>Un espace de travail supplémentaire est créé pour le choix, avec un élément d'interaction vers chacun des espaces des tâches alternatives.</td></tr><tr><td>Sans ordre</td><td>Même transformation que l'alternatif (espace de choix supplémentaire) + un élément d'interaction entre les deux espaces concernés eux-mêmes.</td></tr></tbody></table><p class=\"fiche-p\">Itération : un élément d'interaction doit être ajouté au(x) dernier(s) espace(s) atteint(s), permettant de revenir au(x) premier(s) espace(s) de la tâche répétée. Les pré-conditions du modèle de tâches peuvent être ajoutées sur les transitions (flèches).</p><p class=\"fiche-note\">Exemple fil rouge du cours : application photo avec 4 tâches élémentaires (Sélectionner un album, Sélectionner une photo, Observer une photo, Regarder un ensemble de photos), chacune associée à son propre espace de travail.</p><h3 class=\"fiche-h1\">3. Concept Map — structurer sans naviguer</h3><p class=\"fiche-p\">À la différence de l'IHM fils de fer, la Concept Map structure UNIQUEMENT les concepts (informations), sans représenter la navigation entre groupes de concepts. Limite : ne permet pas de détecter qu'un groupe de concepts serait trop volumineux pour tenir sur un seul écran — aucune recommandation de structuration en espaces n'en découle.</p><h3 class=\"fiche-h1\">4. Niveau concret : la Meta-IHM (répartition par plateforme)</h3><p class=\"fiche-p\">La Meta-IHM exprime comment les tâches/informations d'une IHM abstraite sont réparties selon la ou les plateformes utilisées (ex : ordinateur de bureau seul, smartphone seul, les deux en simultané) — chaque espace de travail abstrait est associé à une ou plusieurs pages concrètes selon la configuration.</p><h3 class=\"fiche-h1\">5. Le comportement dynamique : les modèles de dialogue</h3><p class=\"fiche-p\">Depuis le modèle de Seeheim, la dynamique d'une application est gérée par le contrôleur de dialogue (dialog control), avec une double liaison : vers la sémantique du système (savoir quoi faire) et vers la présentation (donner à voir). Trois grandes familles de formalismes pour décrire ce dialogue :</p><ul class=\"fiche-ul\"><li>Basés sur les grammaires.</li><li>À base d'événements (ex : Java/Swing).</li><li>Basés sur les états : machines à états, statecharts, réseaux de Petri de haut niveau — permettent un raisonnement formel (validation/vérification de propriétés comme la sûreté ou la vivacité).</li></ul><h4 class=\"fiche-h2\">5.1 Les automates (machines à états)</h4><p class=\"fiche-p\">Une machine à états (ou système de transitions étiquetées) se compose de 4 éléments : un ensemble d'états, un état initial, un ensemble de transitions, des étiquettes sur ces transitions.</p><ul class=\"fiche-ul\"><li>Une transition est déclenchée par un événement (ex : clic souris, fin d'horloge).</li><li>Une garde est une condition booléenne pour qu'une transition soit exécutée (vraie par défaut si absente).</li><li>L'action d'une transition est le code exécuté lors du franchissement.</li><li>Chaque état peut avoir une action d'entrée (à l'arrivée dans l'état) et une action de sortie (au départ de l'état).</li></ul><p class=\"fiche-p\">Fonctionnement : à un événement, si une transition part de l'état courant avec sa garde vraie, alors s'exécutent dans l'ordre : action de sortie de l'état courant → action de la transition → action d'entrée du nouvel état. Sinon, l'événement est ignoré. Représentation graphique : états = ellipses, transitions = flèches, état initial = petite flèche entrante.</p><h4 class=\"fiche-h2\">5.2 Les machines à états hiérarchiques (Statecharts)</h4><p class=\"fiche-p\">Étendent les machines à états simples pour rester lisibles quand le dialogue est dense : elles permettent de définir des machines à états À L'INTÉRIEUR d'états (principe des Statecharts de Harel). Utile pour RAFFINER le comportement d'un composant par étapes successives, tout en conservant au premier niveau les états de la version initiale.</p><p class=\"fiche-note\">Exemple donné : un composant email, d'abord modélisé avec seulement Actif/Non actif, puis raffiné en ajoutant un état intermédiaire \"pré-sélectionné\" (affiché mais pas encore éditable) sans perdre les 2 états de départ.</p><h4 class=\"fiche-h2\">5.3 UAN (User Action Notation)</h4><p class=\"fiche-p\">Notation TEXTUELLE (grammaire de symboles) pour décrire les actions de l'utilisateur, le feedback de l'interface, et la connexion au noyau fonctionnel. Quelques symboles clés : ~ (déplacement du curseur), ↓/↑ (appui/relâchement), * (répétition zéro ou plus), + (une ou plusieurs fois), [] (tâche optionnelle), OR (choix entre tâches), & (ordre indifférent), || (concurrence).</p><h3 class=\"fiche-h1\">6. Représentations de la présentation</h3><h4 class=\"fiche-h2\">6.1 Le Wireframe</h4><p class=\"fiche-p\">Représentation qui se concentre sur le CONTENU (les concepts) et la POSITION RELATIVE des informations — jamais sur la forme précise (couleurs, style) ni le détail de l'interaction. Peut être plus ou moins concret (plus ou moins proche de la solution finale), et déjà organisé par plateforme.</p><h4 class=\"fiche-h2\">6.2 La Charte graphique</h4><p class=\"fiche-p\">Document textuel définissant toutes les règles de présentation graphique : logo, icônes, typographie (police/taille/couleur par type de texte), apparence et comportement dynamique des widgets, organisation spatiale des écrans (template), et comportement en cas de redimensionnement.</p><h4 class=\"fiche-h2\">6.3 La Maquette</h4><p class=\"fiche-p\">Lien entre présentation et dynamique (voir chapitre 5) — une fois la charte graphique appliquée et la navigation ajoutée à un wireframe, la maquette obtenue peut visuellement différer sensiblement du wireframe d'origine.</p>",
    fiche: "<h3 class=\"fiche-h1\">Framework CAMELEON — niveaux de modèles</h3><ul class=\"fiche-ul\"><li>Domaine/Tâches (chap. 3-4)</li><li>Abstract UI (indépendant plateforme)</li><li>Concrete UI (dépend des modalités)</li><li>Interface développée (implémentation)</li></ul><h3 class=\"fiche-h1\">IHM Fils de fer — règles par opérateur</h3><table class=\"fiche-table\"><thead><tr><th>Opérateur</th><th>Transformation</th></tr></thead><tbody><tr><td>Séquentiel</td><td>Lien d'un espace vers le suivant</td></tr><tr><td>Parallèle</td><td>Fusion en un seul espace</td></tr><tr><td>Alternatif</td><td>Espace de choix + liens vers chaque option</td></tr><tr><td>Sans ordre</td><td>Espace de choix + liens croisés entre les 2</td></tr></tbody></table><h3 class=\"fiche-h1\">Concept Map vs IHM Fils de fer</h3><p class=\"fiche-p\">Concept Map = structure les concepts SANS navigation. IHM Fils de fer = structure ET navigation (espaces de travail).</p><h3 class=\"fiche-h1\">Meta-IHM</h3><p class=\"fiche-p\">Répartit les espaces de travail abstraits sur les plateformes concrètes (bureau, mobile, les deux).</p><h3 class=\"fiche-h1\">Machine à états — 4 composants</h3><ul class=\"fiche-ul\"><li>États</li><li>État initial</li><li>Transitions</li><li>Étiquettes (événement + garde + action)</li></ul><p class=\"fiche-p\">Sur franchissement : action sortie → action transition → action entrée.</p><h3 class=\"fiche-h1\">Statecharts (machines hiérarchiques)</h3><p class=\"fiche-p\">États contenant eux-mêmes des machines à états — sert à RAFFINER un comportement sans perdre les états de la version simple.</p><h3 class=\"fiche-h1\">UAN</h3><p class=\"fiche-p\">Notation textuelle du dialogue (symboles : ~ déplacement, * répétition, OR choix, & ordre indifférent, || concurrence).</p><h3 class=\"fiche-h1\">3 représentations de présentation</h3><table class=\"fiche-table\"><thead><tr><th>Modèle</th><th>Se concentre sur</th></tr></thead><tbody><tr><td>Wireframe</td><td>Contenu + position relative (pas la forme)</td></tr><tr><td>Charte graphique</td><td>Styles, couleurs, typographie, comportement widgets</td></tr><tr><td>Maquette</td><td>Lien présentation + dynamique (peut différer du wireframe)</td></tr></tbody></table>",

  'ihm-chap7': {
    matiere: "Ingénierie des Interfaces Humain-Machine (IHM)",
    chapitre: "Chapitre 7 - Developpement (Tests IHM)",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>Chapitre 7 - Developpement (partie IHM Tests).pdf</li></ul></div><p class=\"fiche-note\">Ce chapitre est très visuel (peu de texte, beaucoup de schémas/exemples live sur une TodoList Angular) — le résumé se concentre sur les notions clés énoncées explicitement.</p><h3 class=\"fiche-h1\">1. Validation vs Vérification</h3><table class=\"fiche-table\"><thead><tr><th>Terme</th><th>Question posée</th></tr></thead><tbody><tr><td>Validation</td><td>Est-ce que le logiciel répond aux BESOINS (est-ce le bon logiciel) ?</td></tr><tr><td>Vérification</td><td>Est-ce que le logiciel fonctionne CONFORMÉMENT À CE QU'ON ATTEND (le logiciel est-il bien construit) ?</td></tr></tbody></table><p class=\"fiche-note\">Distinction classique en génie logiciel : la validation regarde vers l'utilisateur/le besoin, la vérification regarde vers la spécification/l'implémentation.</p><h3 class=\"fiche-h1\">2. Tests de vérification : boîte noire vs boîte blanche</h3><p class=\"fiche-p\">Un test de vérification d'IHM peut se faire en boîte noire (sans regarder le code, seulement les entrées/sorties par rapport à la spécification) ou en boîte blanche (en s'appuyant sur la structure interne du code).</p><p class=\"fiche-p\">Principe du test en boîte noire : Programme de test → Données d'exécution → Résultats, comparés aux Spécifications pour produire un Résultat des tests (pass/fail).</p><h3 class=\"fiche-h1\">3. Construire des données de test en boîte noire</h3><ul class=\"fiche-ul\"><li>Le testeur lit attentivement la documentation/spécification — ce travail permet aussi de FAIRE REMONTER des questions sur des zones ambiguës de la spec (ex : ce paramètre est-il valide ? peut-on tester toutes les valeurs possibles ?).</li><li>Le testeur joue le rôle de l'ORACLE : il doit spécifier le résultat ATTENDU pour chaque donnée de test — encore une fois, cela révèle des cas non précisés dans la spec (ex : que doit-il se passer si je saisis un label vide ?).</li><li>La comparaison résultat attendu / résultat obtenu peut être manuelle ou automatisée.</li></ul><h3 class=\"fiche-h1\">4. Identifier les valeurs limites</h3><p class=\"fiche-p\">D'expérience, les erreurs sont plus fréquentes sur les valeurs limites (tableau vide, chaîne vide, tableau de taille maximale...). Pour chaque variable, il faut connaître son domaine de valeurs.</p><p class=\"fiche-p\">Méthode : si Ω est une limite du domaine et δ la plus petite variation possible, on teste les 3 valeurs [Ω−δ, Ω, Ω+δ] (juste avant la limite, la limite elle-même, juste après), en complément de valeurs nominales (cas normal) et de valeurs franchement hors limites.</p><h3 class=\"fiche-h1\">5. Partition des entrées (pairwise testing)</h3><p class=\"fiche-p\">Quand plusieurs variables/paramètres interagissent, tester toutes les combinaisons possibles explose rapidement. La technique de partition des entrées (pairwise) vise à construire des classes de tests MINIMALES qui couvrent malgré tout toutes les paires de valeurs possibles entre variables — outils cités : pairwise.teremokgames.com, pairwise.yuuniworks.com.</p><h3 class=\"fiche-h1\">6. Mise en œuvre : tests de bout en bout (e2e) avec Cypress</h3><p class=\"fiche-p\">Conseils pratiques pour structurer des tests e2e maintenables sur une IHM :</p><ul class=\"fiche-ul\"><li>Définir des fonctions ACTIONS : comment interagir avec l'IHM, à deux niveaux — niveau tâche (le but métier) et niveau articulatoire (le geste concret : naviguer, scroller...).</li><li>Définir des fonctions de VÉRIFICATION : ce qu'on doit observer sur l'IHM, à différents niveaux — niveau conceptuel/tâches (C&T), AUI, CUI (cf. chapitre 6 sur les niveaux d'abstraction), ou niveau technique (ex : une référence de balise qui doit rester constante).</li><li>Définir les SCÉNARIOS DE TEST en combinant les fonctions actions et vérification précédentes — plus lisible et plus maintenable dans le temps qu'un test \"à plat\".</li></ul><p class=\"fiche-note\">Ce découpage action/vérification/scénario est directement réutilisable dans n'importe quel framework de test e2e (Cypress, Playwright, Selenium...), pas seulement pour l'exemple Angular du cours.</p>",
    fiche: "<h3 class=\"fiche-h1\">Validation vs Vérification</h3><table class=\"fiche-table\"><thead><tr><th>Terme</th><th>Question</th></tr></thead><tbody><tr><td>Validation</td><td>Est-ce le BON logiciel (répond aux besoins) ?</td></tr><tr><td>Vérification</td><td>Le logiciel fonctionne-t-il CONFORME à l'attendu ?</td></tr></tbody></table><h3 class=\"fiche-h1\">Boîte noire — 3 étapes</h3><ul class=\"fiche-ul\"><li>Lire la spec → construire des données de test</li><li>Jouer l'oracle → définir le résultat attendu</li><li>Comparer résultat attendu vs obtenu (manuel ou auto)</li></ul><h3 class=\"fiche-h1\">Valeurs limites — méthode [Ω-δ, Ω, Ω+δ]</h3><p class=\"fiche-p\">Tester juste avant, sur, et juste après chaque limite du domaine + valeurs nominales + valeurs franchement hors limites.</p><h3 class=\"fiche-h1\">Pairwise testing</h3><p class=\"fiche-p\">Réduire le nombre de combinaisons à tester en couvrant toutes les PAIRES de valeurs entre variables, plutôt que le produit cartésien complet.</p><h3 class=\"fiche-h1\">Structurer un test e2e (Cypress)</h3><ul class=\"fiche-ul\"><li>Fonctions Actions (tâche + articulatoire)</li><li>Fonctions de Vérification (C&T/AUI/CUI + technique)</li><li>Scénarios = combinaison des deux → lisible et maintenable</li></ul>",
    corriges: "<div class=\"fiche-sources\"><strong>📎 PDF associés :</strong><ul class=\"fiche-ul\"><li>MIAGE1 - IHM Examen Session 1 2020 (correction officielle)</li><li>M1MIAGE IHMTC Examen Session 1 2021 (correction officielle)</li></ul></div><p class=\"fiche-note\">Ces deux annales officielles couvrent l'ensemble des 7 chapitres — les questions de cours ci-dessous sont extraites telles quelles avec leur grille de notation officielle.</p><h3 class=\"fiche-h1\">Annale 2020 — Questions de cours (Exercice A)</h3><p class=\"fiche-p\"><strong>Q1) Expliquez (texte + schéma) la conception centrée-utilisateur.</strong></p><p class=\"fiche-p\">Corrigé (barème officiel) : pour les 2 points, il faut que le texte ET le schéma indiquent les 3 éléments : (1) c'est un PROCESSUS de conception, (2) les UTILISATEURS interviennent à TOUTES les étapes, (3) le processus prévoit des ITÉRATIONS. Une simple recopie du cours sans recul/analyse ne vaut qu'1 point sur 2.</p><p class=\"fiche-p\"><strong>Q2) Différence entre efficacité et efficience ?</strong></p><p class=\"fiche-p\">Corrigé : Efficacité = capacité à ATTEINDRE le but. Efficience = capacité à l'atteindre avec un MINIMUM D'EFFORTS. Piège du barème : donner seulement les deux définitions séparément ne suffit pas — il faut que la DIFFÉRENCE elle-même soit rendue explicite (ex : \"on peut être efficace sans être efficient si on atteint le but en se fatiguant beaucoup\").</p><p class=\"fiche-p\"><strong>Q3) Que doit contenir une maquette ?</strong></p><ul class=\"fiche-ul\"><li>La présentation des éléments interactifs, plus ou moins fidèle au résultat final (0,5 pt)</li><li>La présentation du placement des éléments les uns par rapport aux autres (0,5 pt)</li><li>La présentation des conséquences dynamiques des actions de l'utilisateur, ex : passage à une autre page (0,5 pt, x2 car jugé important)</li></ul><p class=\"fiche-p\"><strong>Q4) Différence entre modalité en entrée et en sortie, avec exemples.</strong></p><p class=\"fiche-p\">Corrigé : Modalité en ENTRÉE = comment l'utilisateur transmet de l'information AU système (ex : clavier, souris, micro pour la voix). Modalité en SORTIE = comment le système transmet de l'information à l'utilisateur (ex : écran, haut-parleur). Piège du barème : 0 point si aucun exemple donné ; 1 point (sur 2) si les dispositifs sont cités mais pas les modalités elles-mêmes (bien distinguer \"clavier\" le dispositif de \"saisie de texte\" la modalité).</p><h3 class=\"fiche-h1\">Annale 2021 — Questions de cours (Exercice A)</h3><p class=\"fiche-p\"><strong>Q1) Qu'est-ce qu'une IHM Abstraite ? À quoi sert-elle ? D'où l'obtient-on ?</strong></p><p class=\"fiche-p\">Corrigé officiel : une IHM Abstraite est un modèle qui représente la composition en ESPACES DE TRAVAIL et la NAVIGATION entre eux. Chaque espace est défini par les informations échangées entre système et utilisateur pour réaliser une tâche. Elle NE CONTIENT AUCUN ÉLÉMENT GRAPHIQUE (c'est la différence clé avec une maquette/wireframe). Elle s'obtient par TRANSFORMATION du modèle de tâches — elle permet de passer d'une vue utilisateur de l'activité à une vue système.</p><p class=\"fiche-p\"><strong>Q2) Différence entre utilisateur et client, avec exemple concret.</strong></p><p class=\"fiche-p\">Corrigé : Utilisateur = celui qui UTILISE le système. Client = celui qui ACHÈTE le système. Les deux peuvent être la même personne, mais pas toujours. Exemple attendu : le planning du projet est une préoccupation du CLIENT, alors que les tests d'efficience concernent l'UTILISATEUR — un même sujet peut recevoir des réponses différentes selon qu'on interroge l'un ou l'autre.</p><p class=\"fiche-p\"><strong>Q3) Quel élément du modèle de Norman la méthode KLM-GOMS permet-elle d'évaluer ?</strong></p><p class=\"fiche-p\">Corrigé : la DISTANCE D'EXÉCUTION (l'étape \"Exécution des actions\" du modèle de Norman — combien d'actions/temps il faut à l'utilisateur pour réaliser sa tâche).</p><p class=\"fiche-p\"><strong>Q4) Qu'est-ce qu'une interface efficiente ?</strong></p><p class=\"fiche-p\">Corrigé : une interface qui demande le MINIMUM D'EFFORT à l'utilisateur pour atteindre son but.</p><h3 class=\"fiche-h1\">Annale 2021 — Exercice 1 : détecter des erreurs dans un modèle de tâches</h3><p class=\"fiche-p\">Deux erreurs de syntaxe à repérer sur un modèle donné (méthode directement réutilisable sur n'importe quel modèle de tâches) :</p><ul class=\"fiche-ul\"><li>Une tâche DÉCOMPOSÉE sans opérateur d'ordonnancement (ex : \"Associer la session de jury avec les étudiants\" n'a pas de SEQ/// indiqué) → il en manque toujours un sur une tâche décomposée.</li><li>Une tâche notée comme ABSTRAITE (ex : \"Générer les fiches et analyses de notes\") ne peut pas l'être si elle est en réalité réalisée par le système ou l'utilisateur (ici : Interactif ou Système) — l'abstrait ne s'utilise que pour des tâches dont l'exécutant est réellement indéterminé.</li></ul><p class=\"fiche-note\">Barème officiel : 0,5 point par erreur correctement détectée ET corrigée ; -0,5 point si tu INTRODUIS une nouvelle erreur en corrigeant. Attention à la rigueur : une explication sans solution ne rapporte rien.</p><h3 class=\"fiche-h1\">Annale 2021 — Exercice 3 : grille de sélection des règles ergonomiques</h3><p class=\"fiche-p\">Face à un tableau de critères (Loi de Hick, Loi de Fitts, Nombre magique de Miller, Principe des 3 clics, Gestalt, etc.), la méthode attendue n'est PAS de tous les citer, mais de justifier SPÉCIFIQUEMENT pourquoi un critère est pertinent (ou non) pour CE contexte précis (cet utilisateur, cette tâche, cette plateforme).</p><p class=\"fiche-note\">Barème : 0 point si la justification n'est pas rattachée explicitement à l'utilisateur/au contexte/à la tâche — citer la définition du critère ne suffit jamais, il faut l'ancrer dans le cas concret de l'énoncé.</p>"

  'bda-nosql': {
    matiere: "Bases de données avancées",
    chapitre: "NoSQL et theoreme de CAP",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>NoSQ.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Des bases de données relationnelles au NoSQL</h3><p class=\"fiche-p\">Historique rapide : les SGBD relationnels naissent avec l'arrivée des disques durs et la vision de Codd (modèle formel base sur la theorie des ensembles et l'algebre relationnelle, garantissant l'ACIDite). Puis apparaissent les BD orientees objet, et les BD multidimensionnelles (approche OLAP pour le decisionnel), toujours construites sur les fondations du relationnel.</p><p class=\"fiche-p\">L'arrivee du Big Data (tres gros volumes, forte variete, grande vitesse de generation des donnees) pousse a l'emergence du mouvement NoSQL. Definition centrale du NoSQL : pas de schema fixe impose (contrairement au relationnel), avec une architecture nativement distribuee tres populaire pour ce type de besoin.</p><h3 class=\"fiche-h1\">2. Le théorème de CAP</h3><p class=\"fiche-p\">Le theoreme de CAP enonce qu'un systeme distribue ne peut garantir SIMULTANEMENT que 2 des 3 proprietes suivantes :</p><table class=\"fiche-table\"><thead><tr><th>Propriété</th><th>Définition</th></tr></thead><tbody><tr><td>C — Consistency (Cohérence)</td><td>Chaque client a la même vue de chaque donnée à tout instant.</td></tr><tr><td>A — Availability (Disponibilité)</td><td>Chaque client peut toujours lire et écrire (le système répond toujours).</td></tr><tr><td>P — Partition Tolerance (Tolérance au partitionnement)</td><td>Le système continue de fonctionner malgré une partition physique du réseau/des données.</td></tr></tbody></table><p class=\"fiche-p\">Les bases de données relationnelles classiques (Oracle, MySQL, SQLServer, PostgreSQL, DB2) privilégient CA (Cohérence + Disponibilité), en sacrifiant la tolérance au partitionnement — elles ne sont historiquement pas pensées pour être distribuées à grande échelle.</p><table class=\"fiche-table\"><thead><tr><th>Choix</th><th>Bases concernées</th></tr></thead><tbody><tr><td>CA (Cohérence + Disponibilité)</td><td>Oracle, MySQL, SQLServer, PostgreSQL, DB2 (relationnel)</td></tr><tr><td>AP (Disponibilité + Partition tolerance)</td><td>Elasticsearch, Spark, Neo4j, OrientDB, FlockDB, SimpleDB, Memcached, Redis, DynamoDB*, CouchBase*, Cassandra*</td></tr><tr><td>CP (Cohérence + Partition tolerance)</td><td>HBase, BigTable, MongoDB*, CosmosDB*</td></tr></tbody></table><p class=\"fiche-note\">Les bases marquées * peuvent en réalité ajuster leur curseur cohérence ↔ disponibilité selon la configuration choisie — le triangle CAP est une simplification pédagogique plutôt qu'une règle absolument rigide en pratique.</p><h3 class=\"fiche-h1\">3. Les grandes familles de bases NoSQL</h3><p class=\"fiche-p\">Plus de 225 SGBD NoSQL existent, organisés en grandes familles selon leur modèle de données :</p><table class=\"fiche-table\"><thead><tr><th>Modèle</th><th>Principe</th><th>Exemples / utilisateurs cités en cours</th></tr></thead><tbody><tr><td>Clés-valeurs</td><td>Chaque donnée est stockée comme une paire (clé, valeur) opaque, avec des opérations simples Put/Get/Delete/Update.</td><td>Utilisé par Vodafone, TripAdvisor, Nokia, Samsung, Docker, LiveJournal, Wikipédia, Flickr, WordPress</td></tr><tr><td>Orienté Documents</td><td>Chaque enregistrement est un document semi-structuré (souvent JSON/BSON), pouvant contenir des sous-structures imbriquées.</td><td>MongoDB, DynamoDB — utilisé par AOL, AT&T, Disney, PayPal, Ryanair, eBay, Cisco, BMW, Duolingo</td></tr><tr><td>Big Table (orienté colonnes)</td><td>Les données sont organisées par colonnes plutôt que par lignes, optimisé pour l'agrégation sur de très gros volumes.</td><td>BigTable (Google), Hadoop/HBase (Apache), Spark SQL, Elasticsearch</td></tr><tr><td>Graphe</td><td>Les données sont des nœuds et des relations (arêtes) explicites entre eux, optimisé pour naviguer dans des réseaux de relations.</td><td>Neo4j, OrientDB (eBay, Cisco, UBS, HP), FlockDB (Twitter)</td></tr><tr><td>Hybride RDF (triplestore)</td><td>Issu du Web Sémantique : un ensemble de triplets <sujet, propriété, objet>. Une ontologie définit les contraintes de typage et de hiérarchie entre classes/propriétés. Interrogation via le langage SPARQL.</td><td>Virtuoso (BD colonne), GraphDB (BD graphe)</td></tr></tbody></table><p class=\"fiche-note\">RDF : avantages = schéma très flexible + possibilité d'inférer de nouvelles connaissances par des règles. Inconvénients = beaucoup de jointures nécessaires (triplets peu structurés) et agrégations peu performantes.</p><h3 class=\"fiche-h1\">4. Choisir SQL vs NoSQL : les grandes différences</h3><table class=\"fiche-table\"><thead><tr><th>Aspect</th><th>Relationnel (SQL)</th><th>NoSQL</th></tr></thead><tbody><tr><td>Approche</td><td>Théorique : modèle mathématique d'abord, implémentation physique secondaire.</td><td>Concrète : partir de problèmes réels et de retours d'expérimentation, implémentation directe.</td></tr><tr><td>Agrégat</td><td>Pas de notion d'agrégat native : reconstruit via des requêtes/jointures, schéma indépendant du besoin applicatif.</td><td>Construit directement AUTOUR de l'agrégat (souvent une clé), au plus près du besoin métier — mais difficile à faire évoluer une fois figé.</td></tr><tr><td>Partitionnement</td><td>Complexe : les données de différentes tables sont fortement liées, il faut optimiser les jointures lors du partitionnement (sharding).</td><td>Naturel : les agrégats sans schéma rigide se partitionnent facilement (sharding automatique fréquent).</td></tr><tr><td>Langage</td><td>SQL : déclaratif, proche du besoin, très mature.</td><td>Pas de standard équivalent à SQL (sauf SPARQL pour RDF) — les langages évoluent vite.</td></tr><tr><td>Impédance objet-relationnel</td><td>Forte : nécessite un DAO conséquent ou un framework ORM complexe (gestion ACID).</td><td>Faible : le modèle se mappe facilement aux objets métier, ORM plus simples.</td></tr><tr><td>Traitement</td><td>Plutôt côté serveur (procédures stockées, traitement lourd serveur).</td><td>Plutôt côté client (accès par sérialisation performant, serveur = simple stockage).</td></tr><tr><td>Transactions</td><td>Moteur transactionnel ACID au cœur du système, cohérence multi-tables garantie.</td><td>Transaction au second plan : l'écriture sur un agrégat est naturellement atomique et isolée ; la cohérence entre copies dupliquées nécessite des techniques dédiées (gestion de réplicats, journal pour la durabilité).</td></tr></tbody></table><p class=\"fiche-note\">Point de vigilance rappelé en cours : ne pas tomber dans le piège de croire que le NoSQL remplace systématiquement le relationnel et résout tous les problèmes — le choix dépend du cas d'usage.</p><h3 class=\"fiche-h1\">5. Application pratique : MongoDB (modèle orienté documents)</h3><p class=\"fiche-p\">Une collection MongoDB remplace une table relationnelle ; un document remplace une ligne (tuple). Un document peut contenir des sous-documents ou des tableaux, avec deux stratégies possibles pour représenter une relation entre données :</p><table class=\"fiche-table\"><thead><tr><th>Stratégie</th><th>Principe</th><th>Cas d'usage typique</th></tr></thead><tbody><tr><td>Embedded (imbriqué)</td><td>Les données liées sont stockées directement à l'intérieur du document parent.</td><td>Relation \"contient\" forte, données consultées ensemble la plupart du temps.</td></tr><tr><td>Referenced (référencé)</td><td>Le document contient l'identifiant (référence) d'un autre document stocké séparément, comme une clé étrangère.</td><td>Données volumineuses, partagées entre plusieurs documents, ou mises à jour indépendamment.</td></tr></tbody></table><p class=\"fiche-p\">Opérations principales : InsertOne/InsertMany (insertion), DeleteOne/DeleteMany (suppression), UpdateOne/UpdateMany (modification), filtrage et projection sur une collection (équivalent du WHERE et SELECT de colonnes en SQL). L'agrégation MongoDB fonctionne comme un pipeline d'opérations successives (filtrer, regrouper, trier, transformer...) appliquées en série sur les documents.</p><p class=\"fiche-p\">L'opérateur $lookup permet de réaliser l'équivalent d'une jointure entre deux collections (utile notamment avec le modèle Referenced) ; on peut également manipuler directement des éléments multivalués ou des sous-documents embedded imbriqués dans les requêtes.</p><p class=\"fiche-note\">Pour aller plus loin : documentation officielle sur https://www.mongodb.com/docs/manual/</p>",
    fiche: "<h3 class=\"fiche-h1\">NoSQL en une phrase</h3><p class=\"fiche-p\">Pas de schéma fixe, architecture nativement distribuée, construit autour de la notion d'agrégat.</p><h3 class=\"fiche-h1\">Théorème de CAP — à connaître par cœur</h3><ul class=\"fiche-ul\"><li>C = Consistency (cohérence)</li><li>A = Availability (disponibilité)</li><li>P = Partition tolerance</li><li>On ne peut garantir que 2 des 3 en même temps.</li></ul><table class=\"fiche-table\"><thead><tr><th>Choix</th><th>Exemples</th></tr></thead><tbody><tr><td>CA</td><td>Oracle, MySQL, PostgreSQL (relationnel)</td></tr><tr><td>AP</td><td>Cassandra, DynamoDB, Redis</td></tr><tr><td>CP</td><td>MongoDB, HBase, BigTable</td></tr></tbody></table><h3 class=\"fiche-h1\">5 grandes familles NoSQL</h3><table class=\"fiche-table\"><thead><tr><th>Modèle</th><th>Exemple</th></tr></thead><tbody><tr><td>Clés-valeurs</td><td>Redis, DynamoDB</td></tr><tr><td>Orienté Documents</td><td>MongoDB</td></tr><tr><td>Big Table (colonnes)</td><td>BigTable, HBase</td></tr><tr><td>Graphe</td><td>Neo4j, OrientDB</td></tr><tr><td>Hybride RDF (triplestore)</td><td>Virtuoso, GraphDB, SPARQL</td></tr></tbody></table><h3 class=\"fiche-h1\">SQL vs NoSQL — différences clés</h3><ul class=\"fiche-ul\"><li>Approche théorique (SQL) vs concrète/expérimentale (NoSQL)</li><li>Agrégat absent (SQL) vs central (NoSQL)</li><li>Partitionnement complexe (SQL) vs naturel (NoSQL)</li><li>Forte impédance objet-relationnel (SQL) vs faible (NoSQL)</li><li>Transactions ACID au centre (SQL) vs second plan (NoSQL)</li></ul><h3 class=\"fiche-h1\">MongoDB</h3><ul class=\"fiche-ul\"><li>Collection = table, Document = ligne</li><li>Embedded (imbriqué) vs Referenced (par identifiant)</li><li>$lookup = équivalent d'une jointure</li><li>Agrégation = pipeline d'opérations</li><li>InsertOne/Many, DeleteOne/Many, UpdateOne/Many</li></ul>",
    corriges: "<div class=\"fiche-sources\"><strong>📎 PDF associés :</strong><ul class=\"fiche-ul\"><li>M1MIAGE23_session1.pdf (Q11)</li></ul></div><h3 class=\"fiche-h1\">Question d'annale — Archivage NoSQL de tickets (2 points)</h3><p class=\"fiche-p\"><strong>Énoncé :</strong> l'archivage annuel utilisera une base NoSQL pour des traitements analytiques (agréger des informations selon des besoins d'analyse précis, pas de recherche générique). L'agrégat est le ticket : catégorie, prix, dates, informations sur le spectacle et sa représentation — plus de dossier ni de positionnement en salle. Justifier un modèle de données et donner un exemple de structuration.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> Le modèle <strong>Orienté Documents</strong> (type MongoDB) est le plus adapté ici, pour trois raisons directement tirées des critères du cours :</p><ul class=\"fiche-ul\"><li>L'énoncé définit explicitement un AGRÉGAT (le ticket) : c'est exactement le principe fondateur du modèle Documents, où chaque document EST l'agrégat, avec toutes ses informations utiles regroupées au même endroit.</li><li>Le besoin est analytique et spécifique (pas de recherche générique/transactionnelle) : on n'a plus besoin de la flexibilité relationnelle ni de contraintes d'intégrité complexes entre plusieurs tables — un modèle Big Table (orienté colonnes) conviendrait aussi pour de l'agrégation pure, mais le modèle Documents reste préférable ici car les informations à conserver par ticket (catégorie, prix, dates, spectacle, représentation) sont hétérogènes et hiérarchiques, pas de simples colonnes homogènes.</li><li>On abandonne volontairement le dossier client et le positionnement en salle : cela confirme qu'on restructure les données autour d'un nouvel agrégat, différent du schéma relationnel d'origine — typique d'une bascule vers le NoSQL, qui n'impose pas de conserver un schéma préexistant.</li></ul><p class=\"fiche-p\">Exemple de structuration en document (JSON, style MongoDB) :</p><pre class=\"fiche-code\">{\n  \"_id\": \"ticket_20260214_001\",\n  \"categorie\": \"Or\",\n  \"prix\": 45.00,\n  \"dateAchat\": \"2026-02-10\",\n  \"spectacle\": {\n    \"titre\": \"Le Lac des Cygnes\",\n    \"genre\": \"Danse\"\n  },\n  \"representation\": {\n    \"date\": \"2026-02-14\",\n    \"heure\": \"20h30\",\n    \"salle\": \"Grande Salle\"\n  }\n}</pre><p class=\"fiche-note\">Le choix d'un document EMBEDDED pour spectacle et representation (plutôt que Referenced) se justifie car ces informations sont indissociables du ticket pour l'usage analytique visé — inutile d'aller chercher une autre collection, tout est déjà là pour l'agrégation.</p><h3 class=\"fiche-h1\">Exercice bonus — Appliquer le théorème de CAP</h3><p class=\"fiche-p\">Une plateforme e-commerce mondiale a besoin que son panier d'achat reste accessible même si un data-centre tombe en panne, quitte à ce que deux utilisateurs voient parfois une vue légèrement différente du stock pendant quelques secondes. Quel compromis CAP privilégier ?</p><p class=\"fiche-p\"><strong>Corrigé :</strong> Availability + Partition tolerance (AP), en acceptant une cohérence \"à terme\" (eventual consistency). L'énoncé priorise explicitement la disponibilité (\"reste accessible\") et la tolérance à la panne d'un data-centre (partition), au prix assumé d'une cohérence temporairement dégradée — exactement le compromis fait par des bases comme Cassandra ou DynamoDB.</p>"

    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>optim.pdf</li><li>tdoptim.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Pourquoi optimiser ?</h3><p class=\"fiche-p\">Constat de depart : 80% des donnees se concentrent dans 20% des structures (tables) — l'optimisation cible ces donnees-la en priorite ; quelques milliers de tuples ne necessitent generalement aucune optimisation particuliere. L'optimisation concerne 4 couches : logicielle (programmes JDBC et requetes SQL), structurelle (plan d'execution, index), architecturale (configuration du SGBD, dimensionnement, distribution), et modelisation (normalisation/denormalisation).</p><h4 class=\"fiche-h2\">Le cycle de vie d'une requête</h4><ul class=\"fiche-ul\"><li>Étape 1 — Représentation interne : la requête est analysée (parsée) ; si elle est syntaxiquement et sémantiquement correcte, elle est traduite dans un modèle canonique : l'algèbre relationnelle (succession d'opérateurs).</li><li>Étape 2 — Calcul d'un plan d'exécution : à partir du modèle canonique, plusieurs plans possibles sont générés (choix des index, choix des méthodes de jointure) — il faut trouver le meilleur.</li><li>Étape 3 — Exécution du plan retenu.</li></ul><h3 class=\"fiche-h1\">2. Deux grandes stratégies d'optimisation</h3><table class=\"fiche-table\"><thead><tr><th>Stratégie</th><th>Principe</th></tr></thead><tbody><tr><td>Optimisation algébrique</td><td>Basée sur des règles heuristiques statiques qui réordonnent les opérateurs algébriques d'un plan, sans jamais changer le résultat final.</td></tr><tr><td>Optimisation par calcul de coût</td><td>Évalue le coût de plusieurs plans concurrents à partir de statistiques sur les données (cardinalités, distributions), puis choisit le moins coûteux.</td></tr></tbody></table><p class=\"fiche-p\">Le coût est une combinaison du nombre d'E/S disque, du temps de calcul CPU, et de la charge réseau (taille des données échangées).</p><h3 class=\"fiche-h1\">3. Optimisation algébrique : les règles et heuristiques</h3><p class=\"fiche-p\">Des propriétés algébriques permettent de réordonner les opérateurs sans changer la sémantique : décomposition d'une sélection composée, commutativité des sélections, commutativité de la jointure, possibilité de \"descendre\" une sélection à travers une jointure si elle ne porte que sur une des deux tables, distribution des projections à travers une jointure, associativité des jointures, etc.</p><p class=\"fiche-p\">Ces propriétés se traduisent en 4 heuristiques pratiques, à appliquer dans cet ordre :</p><table class=\"fiche-table\"><thead><tr><th>Heuristique</th><th>Objectif</th></tr></thead><tbody><tr><td>H1 — Sélections au plus tôt</td><td>Réduire la cardinalité des tables le plus vite possible pour alléger tous les opérateurs suivants.</td></tr><tr><td>H2 — Combiner produits cartésiens + sélections</td><td>Transformer les produits cartésiens suivis d'une sélection sur l'égalité en vraies jointures (bien moins coûteuses).</td></tr><tr><td>H3 — Réordonner les jointures (associativité)</td><td>Faire en sorte que les opérations les plus sélectives (qui réduisent le plus la cardinalité) s'exécutent en premier.</td></tr><tr><td>H4 — Projections au plus tôt</td><td>Réduire la taille des tuples transportés dès que possible, pour économiser la mémoire, et éviter de recalculer plusieurs fois une même expression.</td></tr></tbody></table><p class=\"fiche-note\">Méthode d'examen typique : partir d'une requête SQL, l'écrire en algèbre relationnelle \"brute\" (jointures + sélections + projections dans l'ordre naïf), puis réappliquer H1→H4 pour redessiner un arbre optimisé où sélections et projections sont descendues au plus près des tables sources.</p><h3 class=\"fiche-h1\">4. Organisation physique des données et coûts d'accès</h3><p class=\"fiche-p\">Le stockage se fait par page (bloc), pas par tuple : 1 E/S = 1 page. Le facteur de blocage (Fac) est le nombre de tuples par page. Chez Oracle : une base contient des tablespaces, composés de datafiles, eux-mêmes composés de datablocs (2 à 16 Ko = une page). Chaque table et chaque index possède son propre segment de stockage (extensible dynamiquement via des extents).</p><h4 class=\"fiche-h2\">4.1 Balayage séquentiel (FULL SCAN)</h4><p class=\"fiche-p\">Parcourt tous les blocs dans l'ordre physique de stockage, sans aucune structure d'optimisation.</p><table class=\"fiche-table\"><thead><tr><th>Cas</th><th>Coût en E/S</th></tr></thead><tbody><tr><td>Recherche générale / condition non sélective (X clé, X>k...)</td><td>NP(R) — toutes les pages de R</td></tr><tr><td>Recherche X=k avec X clé (résultat unique)</td><td>NP(R)/2 en moyenne</td></tr></tbody></table><h4 class=\"fiche-h2\">4.2 Organisation par indexation</h4><p class=\"fiche-p\">Un index I(k) associe à une clé k une page ou un RowID, permettant de localiser directement un tuple. Types : creux (seul un sous-ensemble des valeurs de k figure dans l'index) vs dense (toutes les valeurs y figurent) ; principal/primaire (les tuples sont physiquement triés selon cette clé) vs secondaire.</p><ul class=\"fiche-ul\"><li>Index B*Tree : structure arborescente équilibrée. Un accès par clé passe de coût NP(R) (balayage) à log(card(R)) grâce à l'arbre.</li><li>Index composite (plusieurs colonnes) : un seul index utilisable à la fois dans un chemin d'accès donné — l'ORDRE des colonnes dans l'index compte (un index sur (Pays, Ville) n'est pas équivalent à (Ville, Pays)).</li><li>Index Bitmap : masque de bits par valeur distincte, adapté aux colonnes à faible cardinalité (peu de valeurs distinctes) et à la combinaison de plusieurs index via des opérateurs logiques (AND/OR sur les bitmaps). Un Bitmap Join permet même d'éviter une jointure en indexant directement une valeur d'une autre table.</li></ul><p class=\"fiche-p\">Bonnes pratiques : indexer les colonnes fréquentes en WHERE/jointures et à forte sélectivité (ex: clé primaire), et les clés étrangères (contrôle d'intégrité référentielle). Éviter d'indexer une colonne utilisée dans un LIKE ou dans une fonction (sauf à créer l'index sur le résultat de la fonction, ex: UPPER(nom)).</p><h3 class=\"fiche-h1\">5. Les algorithmes de jointure et leurs coûts</h3><h4 class=\"fiche-h2\">5.1 Nested Loop (boucles imbriquées)</h4><p class=\"fiche-p\">Pour chaque tuple de la relation externe, on parcourt toute la relation interne à la recherche d'une correspondance.</p><pre class=\"fiche-code\">Coût (E/S) = NP(externe) + NP(externe)/b * NP(interne)\n(b = taille du buffer en pages)\nou de façon équivalente :\nCoût = NP(externe) + card(externe)/(b*Fac(externe)) * NP(interne)</pre><p class=\"fiche-note\">Le choix de la relation externe (la plus petite en général) change le coût total : R*S n'a pas le même coût que S*R avec Nested Loop !</p><h4 class=\"fiche-h2\">5.2 Merge Join (tri-fusion)</h4><p class=\"fiche-p\">Trie R et S sur la clé de jointure puis fusionne les deux ensembles triés avec deux curseurs qui avancent linéairement. Très performant si R et S sont déjà triés.</p><pre class=\"fiche-code\">Coût du tri = 2*NP(R)*log_b(NP(R)) + 2*NP(S)*log_b(NP(S))\nCoût de la fusion = NP(R) + NP(S)</pre><h4 class=\"fiche-h2\">5.3 Hash Join</h4><p class=\"fiche-p\">Construit une table de hashage en mémoire pour la plus petite relation (card(R) << card(S)), puis parcourt S en testant chaque valeur de la clé de jointure contre cette table de hash. Avantage : réduit fortement le nombre de comparaisons, très performant en mémoire, encore plus rapide si la table de hash est réutilisée. Inconvénient : nécessite une construction dynamique coûteuse, et devient inefficace si trop d'enregistrements partagent le même hashcode.</p><h3 class=\"fiche-h1\">6. Le facteur de sélectivité S(p) — estimer la taille des résultats</h3><p class=\"fiche-p\">Le facteur de sélectivité S(p) d'un prédicat p permet d'estimer combien de tuples vérifient une condition : Card(R:p) = S(p) * card(R), avec S(p) ≤ 1.</p><table class=\"fiche-table\"><thead><tr><th>Prédicat</th><th>Formule de S(p)</th></tr></thead><tbody><tr><td>A = x (x une valeur)</td><td>1 / card_R(A) — nombre de valeurs distinctes de A dans R (ou 1/10 si distribution inconnue ; si A est clé, card_R(A)=card(R))</td></tr><tr><td>A > x</td><td>(Max_R(A) - x) / (Max_R(A) - Min_R(A)) — ou 1/3 par défaut</td></tr><tr><td>A < x</td><td>(x - Min_R(A)) / (Max_R(A) - Min_R(A)) — ou 1/3 par défaut</td></tr><tr><td>x1 < A < x2</td><td>(x2 - x1) / (Max_R(A) - Min_R(A)) — ou 1/4 par défaut</td></tr><tr><td>A = B (jointure, B dans une table S)</td><td>1 / max(card_R(A), card_S(B)) — ou 1/10 par défaut</td></tr></tbody></table><table class=\"fiche-table\"><thead><tr><th>Combinaison logique</th><th>Formule</th></tr></thead><tbody><tr><td>p1 AND p2</td><td>S(p1) * S(p2)</td></tr><tr><td>p1 OR p2</td><td>S(p1) + S(p2) - S(p1)*S(p2)</td></tr><tr><td>NOT p</td><td>1 - S(p)</td></tr></tbody></table><p class=\"fiche-p\">Cardinalité estimée d'une jointure sur A=B : Card(R⋈S) = card(R) * card(S) / max(card_R(A), card_S(B)).</p><p class=\"fiche-note\">Ces formules sont la base de la plupart des exercices chiffrés du TD : estimer le nombre de tuples résultat, puis en déduire un coût d'accès en nombre de pages selon la stratégie retenue (séquentiel ou indexé).</p><h3 class=\"fiche-h1\">7. Choix d'une stratégie d'optimisation (vue d'ensemble)</h3><ul class=\"fiche-ul\"><li>Étape 1 — Énumération des chemins d'accès possibles (choix d'index, choix de jointures) : on obtient un arbre de plans, dont on élague déjà les branches manifestement mauvaises.</li><li>Étape 2 — Calcul du coût de chaque chemin restant, puis choix du plan de coût minimal.</li></ul><h3 class=\"fiche-h1\">8. Choix de conception : normalisation vs dénormalisation</h3><p class=\"fiche-p\">La normalisation évite la redondance et les incohérences, mais elle a un coût : reconstruire l'information nécessite des jointures nombreuses et des agrégations, ce qui complexifie et alourdit le requêtage. La dénormalisation est un compromis pragmatique : on accepte un peu de redondance pour simplifier/accélérer les requêtes les plus fréquentes. Exemple classique évoqué en cours : le cas de l'historisation d'un prix qui varie dans le temps, avec plusieurs façons de le modéliser selon le compromis recherché.</p>",
    fiche: "<h3 class=\"fiche-h1\">Les 4 heuristiques d'optimisation algébrique (ordre à respecter)</h3><table class=\"fiche-table\"><thead><tr><th>#</th><th>Heuristique</th></tr></thead><tbody><tr><td>H1</td><td>Sélections au plus tôt</td></tr><tr><td>H2</td><td>Produits cartésiens + sélections → jointures</td></tr><tr><td>H3</td><td>Réordonner les jointures (les plus sélectives en premier)</td></tr><tr><td>H4</td><td>Projections au plus tôt</td></tr></tbody></table><h3 class=\"fiche-h1\">Coûts d'accès à connaître par cœur</h3><table class=\"fiche-table\"><thead><tr><th>Méthode</th><th>Coût (E/S)</th></tr></thead><tbody><tr><td>FULL SCAN</td><td>NP(R), ou NP(R)/2 si recherche par clé unique</td></tr><tr><td>Index (accès direct)</td><td>≈ log(card(R)) avec un B*Tree</td></tr><tr><td>Nested Loop</td><td>NP(externe) + NP(externe)/b * NP(interne)</td></tr><tr><td>Merge Join (tri)</td><td>2·NP(R)·log_b(NP(R)) + 2·NP(S)·log_b(NP(S)) + NP(R)+NP(S)</td></tr><tr><td>Hash Join</td><td>construction table de hash sur la plus petite relation, puis parcours de l'autre</td></tr></tbody></table><h3 class=\"fiche-h1\">Facteur de sélectivité — formules clés</h3><table class=\"fiche-table\"><thead><tr><th>Prédicat</th><th>S(p)</th></tr></thead><tbody><tr><td>A = x</td><td>1/card(A)</td></tr><tr><td>A > x ou A < x</td><td>≈ 1/3 (ou proportion sur le domaine)</td></tr><tr><td>x1<A<x2</td><td>≈ 1/4</td></tr><tr><td>A = B (jointure)</td><td>1/max(card(A),card(B))</td></tr><tr><td>p1 AND p2</td><td>S(p1)×S(p2)</td></tr><tr><td>p1 OR p2</td><td>S(p1)+S(p2)-S(p1)×S(p2)</td></tr><tr><td>NOT p</td><td>1-S(p)</td></tr></tbody></table><h3 class=\"fiche-h1\">Index : à retenir</h3><ul class=\"fiche-ul\"><li>B*Tree : NP(R) → log(card(R))</li><li>Bitmap : faible cardinalité, combinaison AND/OR d'index</li><li>Un seul index utilisable à la fois par chemin d'accès</li><li>Ne pas indexer : colonnes avec LIKE, ou dans une fonction (sauf index fonctionnel)</li></ul><h3 class=\"fiche-h1\">Normalisation vs dénormalisation</h3><p class=\"fiche-p\">Normaliser = pas de redondance mais + de jointures. Dénormaliser = requêtes plus simples/rapides mais redondance à gérer.</p>",
    corriges: "<div class=\"fiche-sources\"><strong>📎 PDF associés :</strong><ul class=\"fiche-ul\"><li>tdoptim.pdf</li></ul></div><h3 class=\"fiche-h1\">Exercice 1 — Optimisation algébrique (Student/Faculty/Class/Enroll)</h3><p class=\"fiche-p\">Q1 : SELECT FACname, Sched, Course# FROM Faculty, Class, Enroll, Student WHERE STUname='Burns, Edward' AND Class.Course#=Enroll.Courseno AND Faculty.FACID=Class.FACno AND Student.STUID=Enroll.STUno</p><p class=\"fiche-p\">Méthode : appliquer H1 (sélection au plus tôt) en descendant STUname='Burns, Edward' directement sur Student (avant toute jointure), puis H2/H3 pour joindre dans un ordre qui exploite cette sélection très tôt : Student (filtré) ⋈ Enroll ⋈ Class ⋈ Faculty, puis H4 pour ne projeter que (FACname, Sched, Course#) dès que les attributs nécessaires aux jointures suivantes ne sont plus utiles.</p><pre class=\"fiche-code\">π FACname,Sched,Course#\n  ⋈ Faculty.FACID=Class.FACno\n    ⋈ Class.Course#=Enroll.Courseno\n      ⋈ Student.STUID=Enroll.STUno\n        σ STUname='Burns, Edward' (Student)      Enroll\n      Class\n    Faculty</pre><p class=\"fiche-note\">Idée clé : comme Student est filtré sur un nom précis (très sélectif, probablement un seul tuple), le placer en premier dans la chaîne de jointures réduit drastiquement la taille de tous les résultats intermédiaires — c'est exactement l'esprit de H1 et H3.</p><h3 class=\"fiche-h1\">Exercice 2 — Fournisseur / Livraison (comparaison de 4 méthodes)</h3><p class=\"fiche-p\">Données : card(Fournisseur)=card(Livraison)=10 000, facteur de blocage=5 (donc NP=2000 pages chacune), buffer=100 tuples, 1 E/S=20ms, 100 tuples de Livraison concernent p1.</p><h4 class=\"fiche-h2\">Méthode 1 — Produit cartésien puis sélection (naïve)</h4><p class=\"fiche-p\">Fournisseur est lu par paquets de 100 tuples (20 blocs) ; pour CHAQUE paquet, Livraison est relue en entier (2000 blocs).</p><pre class=\"fiche-code\">Lectures Fournisseur (1 seule fois, par paquets) = 10000/5 = 2000 blocs\nLectures Livraison = 2000 blocs × 100 paquets = 200 000 blocs\nTotal E/S = 2000 + 200 000 = 202 000 blocs\nTemps = 202 000 × 20 ms ≈ 4040 s (≈ 67 minutes !)\nTuples comparés = 10 000 × 10 000 = 100 000 000</pre><p class=\"fiche-note\">C'est le pire cas possible : aucune sélectivité n'est exploitée avant la jointure complète.</p><h4 class=\"fiche-h2\">Méthode 2 — Sélection anticipée sur Livraison (H1) puis jointure</h4><p class=\"fiche-p\">On parcourt Livraison UNE SEULE FOIS pour construire L1 (les ~100 tuples avec NP='p1'). Comme L1 tient entièrement dans le buffer (100 tuples), plus besoin de le relire à chaque itération.</p><pre class=\"fiche-code\">Construction de L1 : lecture complète de Livraison = 2000 blocs\nLecture de Fournisseur (1 seule fois, L1 déjà en mémoire) = 2000 blocs\nTotal E/S = 2000 + 2000 = 4000 blocs\nTemps = 4000 × 20 ms = 80 s\nTuples comparés = 10 000 × 100 = 1 000 000</pre><p class=\"fiche-note\">Gain énorme par rapport à la méthode 1 : ÷50 sur le temps, ÷100 sur le nombre de comparaisons. C'est la démonstration concrète de l'heuristique H1 (sélection au plus tôt).</p><h4 class=\"fiche-h2\">Méthode 2bis — Livraison en parcours externe</h4><p class=\"fiche-p\">Puisque L1 (≈100 tuples) tient déjà en un seul chargement de buffer, le mettre en position externe ou interne ne change quasiment rien : le coût reste dominé par les deux parcours complets et uniques de Livraison et Fournisseur.</p><pre class=\"fiche-code\">Total E/S ≈ 2000 (Livraison) + 2000 (Fournisseur) = 4000 blocs (identique à la méthode 2)</pre><p class=\"fiche-note\">Enseignement : une fois la sélectivité exploitée (H1), le choix externe/interne n'apporte plus de gain significatif ici — la vraie victoire vient d'avoir réduit une des deux relations à la taille du buffer AVANT la jointure.</p><h4 class=\"fiche-h2\">Méthode 3 — Utilisation des index (LivNP en mémoire + FourNF en B-arbre)</h4><p class=\"fiche-p\">On retrouve directement les ~100 tuples de Livraison via l'index LivNP (en mémoire, coût ≈ 0 pour l'index lui-même, mais chaque tuple trouvé nécessite malgré tout la lecture de son bloc de données) : ≈100 E/S (une par tuple, l'index secondaire ne garantit pas le regroupement physique).</p><p class=\"fiche-p\">Pour chaque tuple trouvé, on cherche le fournisseur correspondant via l'index B-arbre FourNF (ordre 10, seule la racine est en mémoire) :</p><pre class=\"fiche-code\">Profondeur de l'arbre-B (formule du cours, ordre=10, n=10000) :\nlog_5(10000) ≤ v ≤ 1+log_5(5000)  →  v ≈ 6 niveaux\nRacine en mémoire (0 E/S) + reste de l'arbre sur disque + bloc de données\n≈ 6 E/S par recherche\n\nTotal ≈ 100 (accès Livraison) + 100 × 6 (accès Fournisseur via B-arbre) = 700 blocs\nTemps ≈ 700 × 20 ms = 14 s</pre><p class=\"fiche-note\">Encore 5 à 6 fois plus rapide que la méthode 2 ! C'est l'illustration parfaite de la puissance des index quand la sélectivité est forte (ici 100 tuples sur 10 000, soit 1%).</p><table class=\"fiche-table\"><thead><tr><th>Méthode</th><th>E/S estimées</th><th>Temps</th></tr></thead><tbody><tr><td>1 — Naïve</td><td>202 000</td><td>≈ 67 min</td></tr><tr><td>2 — Sélection anticipée</td><td>4 000</td><td>80 s</td></tr><tr><td>2bis — Externe/interne inversé</td><td>4 000</td><td>80 s</td></tr><tr><td>3 — Index (LivNP + FourNF)</td><td>≈ 700</td><td>≈ 14 s</td></tr></tbody></table><h3 class=\"fiche-h1\">Exercice 5 — Chauffeur routier (extrait Q8-Q11)</h3><p class=\"fiche-p\">Statistiques : Chauffeur (card=100, 15 pages), TypePermis indexé en mémoire (card=10), Categorie non indexée (domaine 1 à 10).</p><h4 class=\"fiche-h2\">Q8) SELECT adresse FROM Chauffeur WHERE TypePermis=5 AND Categorie>5</h4><pre class=\"fiche-code\">S(TypePermis=5) = 1/card(TypePermis) = 1/10\nS(Categorie>5) = (Max-5)/(Max-Min) = (10-5)/(10-1) = 5/9\n\nS(p1 AND p2) = 1/10 × 5/9 = 1/18\n\nCard(résultat) = 100 × 1/18 ≈ 5-6 tuples</pre><h4 class=\"fiche-h2\">Q9) Coût d'accès en utilisant l'index sur TypePermis</h4><pre class=\"fiche-code\">Tuples correspondant à TypePermis=5 seul (avant filtre Categorie) = 100 × 1/10 = 10 tuples\nIndex en mémoire → coût de l'index = 0 E/S\nMais chaque tuple trouvé peut être dans un bloc différent (index secondaire, non triant)\n→ Coût ≈ 10 accès page (1 par tuple candidat), le filtre Categorie>5 s'applique ensuite en mémoire</pre><h4 class=\"fiche-h2\">Q10) SELECT adresse,CoutHeure FROM Chauffeur C, GrilleSalaire G WHERE NumPermis=123 AND C.Categorie=G.Categorie</h4><pre class=\"fiche-code\">NumPermis=123 : clé primaire de Chauffeur → exactement 1 tuple\nGrilleSalaire a 1 ligne par Categorie → la jointure renvoie exactement 1 tuple résultat</pre><h4 class=\"fiche-h2\">Q11) Coût d'accès</h4><pre class=\"fiche-code\">Accès à Chauffeur via index primaire NumPermis (en mémoire) → 1 E/S (lecture du bloc de données)\nGrilleSalaire ne tient que sur 1 page → 1 E/S pour la lire entièrement (pas besoin d'index)\nTotal ≈ 1 + 1 = 2 E/S</pre><p class=\"fiche-note\">Les questions Q12-14 (jointure Chauffeur/Transport/Camion avec Nested Loop) et les exercices 3 (T1/T2 abstrait) et 4 (Tirage Photo) suivent exactement la même méthode : calculer S(p), en déduire une cardinalité, puis choisir le chemin d'accès le moins coûteux. Dis-moi si tu veux qu'on les détaille aussi.</p>"

    matiere: "Bases de données avancées",
    chapitre: "BDRO - Relationnel-objet Oracle",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>BDRO.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Le modèle NF2 (Non First Normal Form)</h3><p class=\"fiche-p\">Le SGBDRO (relationnel-objet) d'Oracle permet de sortir de la 1ere forme normale : une table peut contenir un attribut compose de plusieurs sous-attributs, ou un attribut qui est lui-meme une liste de valeurs. Avantages : un niveau conceptuel plus proche du reel, plus besoin d'aplatir artificiellement les donnees, moins de jointures explicites necessaires dans les requetes.</p><p class=\"fiche-note\">Exemple typique : une table Personnes ou un attribut 'voitures' contient directement la liste des voitures de la personne, au lieu de creer une table separee reliee par une cle etrangere.</p><h3 class=\"fiche-h1\">2. Les TAD (Types Abstraits de Donnees)</h3><p class=\"fiche-p\">Oracle n'a pas de vraies classes comme en programmation objet, mais des TAD. Un TAD peut contenir des attributs ET des methodes. On ne peut pas instancier un TAD directement : il faut obligatoirement passer par une table (CREATE TABLE nom_table OF nom_TAD). Chaque instance d'une telle table d'objets possede alors un OID (identifiant d'objet unique, a portee globale) — les tables classiques (non construites sur un TAD) n'ont qu'un ROWID, pas d'OID.</p><pre class=\"fiche-code\">CREATE TYPE Tvoiture AS OBJECT (modele VARCHAR2(15), annee DATE, no INTEGER);\n/\nCREATE TABLE voitures OF Tvoiture;  -- table d'objets, chaque ligne a un OID</pre><p class=\"fiche-p\">On distingue la composition directe (le TAD est utilise tel quel comme colonne) de la composition indirecte (un TAD utilise un autre TAD comme type d'un de ses attributs, ex: Tpersonne contient un attribut de type Tvoiture).</p><p class=\"fiche-p\">Pour recuperer un ensemble d'OBJETS plutot qu'un simple ensemble de valeurs de colonnes, on utilise l'operateur VALUE : SELECT VALUE(v) FROM voitures v.</p><h4 class=\"fiche-h2\">TAD interdépendants</h4><p class=\"fiche-p\">Si deux TAD se referencent mutuellement (ex: Tpersonne utilise Tvoiture ET Tvoiture utilise Tpersonne), on ne peut pas creer les deux completement d'un coup. Solution Oracle : declarer un TAD incomplet (CREATE TYPE nom_type; / sans attribut ni methode), utilisable en reference, puis le completer plus tard.</p><h3 class=\"fiche-h1\">3. Les collections : Varray vs Nested Table</h3><p class=\"fiche-p\">Pour exprimer qu'un objet possede plusieurs valeurs pour un meme attribut (plusieurs prenoms, plusieurs voitures), Oracle propose deux structures de collection :</p><table class=\"fiche-table\"><thead><tr><th>Critère</th><th>Varray</th><th>Nested Table</th></tr></thead><tbody><tr><td>Stockage</td><td>1 valeur (ou BLOB), taille maximale fixee a la creation</td><td>1 sous-table a part entiere</td></tr><tr><td>Relation d'ordre entre éléments</td><td>Oui (liste ordonnée)</td><td>Non</td></tr><tr><td>Requêtable directement</td><td>Non (vue comme 1 valeur atomique)</td><td>Oui, via l'opérateur TABLE</td></tr><tr><td>Indexable / optimisable</td><td>Non</td><td>Oui</td></tr><tr><td>Type des éléments</td><td>Objet ou scalaire</td><td>Objet ou scalaire, avec l'opérateur TABLE</td></tr></tbody></table><pre class=\"fiche-code\">CREATE TYPE liste_prenom AS VARRAY(10) OF VARCHAR2(15);\nCREATE TYPE ens_voiture AS TABLE OF Tvoiture;  -- Nested Table</pre><p class=\"fiche-p\">Pour parcourir une collection comme une table classique (utile surtout pour les Nested Tables), on utilise l'opérateur TABLE : SELECT v.* FROM personnes p, TABLE(p.voitures) v.</p><p class=\"fiche-note\">Attention : une opération sur UN SEUL élément d'une collection dans une Nested Table pose un verrou sur tout le n-uplet propriétaire — une seule opération à la fois sur la collection d'un même objet.</p><p class=\"fiche-p\">Depuis les versions récentes d'Oracle, on peut aussi imbriquer les collections (Nested de Nested, Nested de Varray, Varray + REF, etc.) pour des structures plus riches (ex : une voiture qui contient elle-même une collection de pannes).</p><h3 class=\"fiche-h1\">4. Les références (REF)</h3><p class=\"fiche-p\">Une référence permet de pointer vers un objet d'une AUTRE table d'objets, pour éviter la redondance de données (équivalent objet d'une clé étrangère, mais matérialisé comme un pointeur). Impossible de référencer une collection directement.</p><pre class=\"fiche-code\">CREATE TYPE Tpersonne AS OBJECT (\n  nom VARCHAR2(15), prenoms liste_prenom,\n  date_naissance DATE, voiture REF Tvoiture\n);</pre><ul class=\"fiche-ul\"><li>L'opérateur REF(v) renvoie l'adresse (pointeur) d'un n-uplet d'une table d'objets — utilisé à l'insertion pour peupler un attribut de type REF.</li><li>L'opérateur DEREF(pointeur) fait l'inverse : il retrouve la valeur pointée à partir de la référence.</li><li>Le prédicat IS DANGLING teste si une référence pointe vers rien (objet supprimé) — utile pour nettoyer les références orphelines.</li><li>Modifier un objet référencé À TRAVERS l'objet qui le référence est impossible (ex: on ne peut pas modifier une voiture en passant par personne.voiture) — il faut passer par la table des voitures directement.</li></ul><h3 class=\"fiche-h1\">5. Héritage entre TAD</h3><p class=\"fiche-p\">Oracle permet une hiérarchie de types avec la clause UNDER (définit le sur-type d'un sous-type) et NOT FINAL (autorise un type à devenir un sur-type, sinon il est final par défaut et ne peut pas être hérité).</p><pre class=\"fiche-code\">CREATE TYPE T_Personne AS OBJECT (ninsee NUMBER, nom VARCHAR2(18), prenom VARCHAR2(18), adresse VARCHAR2(200)) NOT FINAL;\n/\nCREATE TYPE T_Etudiant UNDER T_Personne (etab VARCHAR2(18), cycle VARCHAR2(18));</pre><p class=\"fiche-p\">Une table créée sur le sur-type (CREATE TABLE LesPersonnes OF T_Personne) peut alors contenir à la fois des instances du sur-type ET des sous-types (T_Personne et T_Etudiant mélangés).</p><ul class=\"fiche-ul\"><li>VALUE(p) IS OF (T_Etudiant) : teste si un objet est bien du sous-type indiqué (utile en clause WHERE).</li><li>Une référence sur un sous-type doit être explicitement typée. Pour caster une REF T_Personne en REF T_Etudiant, on utilise l'opérateur TREAT(REF(e) AS REF T_Etudiant).</li></ul><h3 class=\"fiche-h1\">6. Les méthodes des TAD</h3><p class=\"fiche-p\">Un TAD peut déclarer des méthodes après ses attributs : MEMBER (invoquée sur une instance, comme une méthode d'instance classique) ou STATIC (invoquée sur le TAD lui-même, comme une méthode de classe).</p><pre class=\"fiche-code\">CREATE TYPE Tpersonne AS OBJECT (\n  nom VARCHAR2(15), prenoms liste_prenom, date_naissance DATE, voiture REF Tvoiture,\n  MEMBER PROCEDURE ajoute_prenom(prenom_sup IN OUT Tprenom)\n);\n/\nCREATE TYPE BODY Tpersonne AS\n  MEMBER PROCEDURE ajoute_prenom(prenom_sup IN OUT Tprenom) IS\n  BEGIN ... END;\nEND;</pre><p class=\"fiche-p\">Le corps des méthodes se déclare séparément avec CREATE [OR REPLACE] TYPE BODY. Le paramètre SELF (implicite ou explicite) permet d'accéder à l'instance courante, comme le 'this' en programmation objet classique.</p><p class=\"fiche-p\">Les appels de méthode peuvent être chaînés (exécution de gauche à droite), à condition que chaque appel intermédiaire renvoie un objet compatible avec le suivant.</p><p class=\"fiche-note\">Côté LDD : ALTER TYPE ne permet de modifier QUE les méthodes d'un TAD (ajout/suppression/modification) — pas les attributs. DROP TYPE supprime le type. La modification/suppression des tables (y compris les tables d'objets) suit les règles SQL classiques.</p>",
    fiche: "<h3 class=\"fiche-h1\">NF2 en une phrase</h3><p class=\"fiche-p\">Une table peut contenir des attributs composés ou des listes de valeurs — sortie de la 1re forme normale.</p><h3 class=\"fiche-h1\">TAD</h3><ul class=\"fiche-ul\"><li>Pas de classe, un TAD (attributs + méthodes).</li><li>Instanciation impossible sans passer par une table : CREATE TABLE t OF TAD.</li><li>OID (table d'objets) vs ROWID (table classique).</li></ul><h3 class=\"fiche-h1\">Varray vs Nested Table — tableau clé</h3><table class=\"fiche-table\"><thead><tr><th></th><th>Varray</th><th>Nested Table</th></tr></thead><tbody><tr><td>Ordre</td><td>Oui</td><td>Non</td></tr><tr><td>Requêtable</td><td>Non</td><td>Oui (opérateur TABLE)</td></tr><tr><td>Indexable</td><td>Non</td><td>Oui</td></tr></tbody></table><h3 class=\"fiche-h1\">Références (REF)</h3><ul class=\"fiche-ul\"><li>REF(objet) : n-uplet → pointeur</li><li>DEREF(pointeur) : pointeur → valeur</li><li>IS DANGLING : teste une référence \"dans le vide\"</li><li>Impossible de modifier l'objet référencé à travers son référenceur</li><li>Impossible de référencer une collection</li></ul><h3 class=\"fiche-h1\">Héritage</h3><ul class=\"fiche-ul\"><li>UNDER = sur-type / NOT FINAL = autorise l'héritage</li><li>VALUE(x) IS OF (SousType) pour filtrer par type</li><li>TREAT(REF(x) AS REF SousType) pour caster une référence</li></ul><h3 class=\"fiche-h1\">Méthodes</h3><ul class=\"fiche-ul\"><li>MEMBER = méthode d'instance</li><li>STATIC = méthode de \"classe\"</li><li>CREATE TYPE BODY pour le code</li><li>ALTER TYPE ne modifie QUE les méthodes</li></ul>",
    corriges: "<p class=\"fiche-note\">Aucune annale d'examen dédiée à BDRO n'a été trouvée dans le ZIP (ce chapitre semble moins testé que Transactions/Triggers). Voici 3 exercices d'entraînement construits à partir du cours, avec leur corrigé, pour t'exercer sur les notions clés.</p><h3 class=\"fiche-h1\">Exercice 1 — Choisir entre TAD simple, Varray et Nested Table</h3><p class=\"fiche-p\">Une bibliothèque veut stocker, pour chaque Livre (titre, auteur), la liste de ses exemplaires (numéro d'inventaire, état). Faut-il utiliser un Varray ou une Nested Table pour la collection d'exemplaires ? Justifie.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> Nested Table est le bon choix, car on doit pouvoir REQUÊTER les exemplaires individuellement (ex : trouver tous les exemplaires en mauvais état, tous SGBD confondus) et potentiellement les INDEXER — deux choses qu'un Varray ne permet pas (il est manipulé comme une valeur atomique, non requêtable directement). Un Varray conviendrait mieux pour une collection bornée, ordonnée et rarement interrogée indépendamment (ex : les 3 auteurs principaux d'un livre, dans un ordre précis).</p><pre class=\"fiche-code\">CREATE TYPE Texemplaire AS OBJECT (noInventaire INTEGER, etat VARCHAR2(20));\n/\nCREATE TYPE ens_exemplaires AS TABLE OF Texemplaire;\n/\nCREATE TYPE Tlivre AS OBJECT (titre VARCHAR2(100), auteur VARCHAR2(100), exemplaires ens_exemplaires);\n/\nCREATE TABLE livres OF Tlivre\nNESTED TABLE exemplaires STORE AS exemplaires_tab;</pre><h3 class=\"fiche-h1\">Exercice 2 — Références et DEREF</h3><p class=\"fiche-p\">On a Tauteur (nom, nationalite) instancié dans une table 'auteurs', et Tlivre (titre, REF Tauteur). Écris la requête qui renvoie le titre de chaque livre et la nationalité de son auteur.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> il faut DEREF la référence pour accéder aux attributs de l'objet pointé :</p><pre class=\"fiche-code\">SELECT l.titre, DEREF(l.auteur).nationalite\nFROM livres l;</pre><p class=\"fiche-p\">Variante avec navigation directe par chemin (équivalente, souvent acceptée en Oracle) :</p><pre class=\"fiche-code\">SELECT l.titre, l.auteur.nationalite FROM livres l;</pre><h3 class=\"fiche-h1\">Exercice 3 — Héritage de TAD</h3><p class=\"fiche-p\">Modélise une hiérarchie TPersonnel (matricule, nom) dont hérite TEnseignant (specialite) et TAdministratif (service). Écris la requête qui renvoie uniquement les enseignants d'une table LesPersonnels contenant les deux sous-types mélangés.</p><pre class=\"fiche-code\">CREATE TYPE TPersonnel AS OBJECT (matricule INTEGER, nom VARCHAR2(30)) NOT FINAL;\n/\nCREATE TYPE TEnseignant UNDER TPersonnel (specialite VARCHAR2(30));\n/\nCREATE TYPE TAdministratif UNDER TPersonnel (service VARCHAR2(30));\n/\nCREATE TABLE LesPersonnels OF TPersonnel;\n\nSELECT p FROM LesPersonnels p WHERE VALUE(p) IS OF (TEnseignant);</pre><p class=\"fiche-note\">Piège classique : oublier NOT FINAL sur le sur-type — sans cette clause, aucun sous-type ne peut être créé avec UNDER.</p>"
