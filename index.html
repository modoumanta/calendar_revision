<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon carnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22262B;
    --paper:#EDE6D6;
    --paper-2:#F5F0E4;
    --line:#D8CFB8;
    --line-strong:#22262B;
    --cours:#2F4C7A;      --cours-bg:#DDE6F2;
    --revisions:#A9660A;  --revisions-bg:#F3E3C8;
    --alternance:#3D6B4F; --alternance-bg:#DEEAE1;
    --sport:#9C3540;      --sport-bg:#F2DBDD;
    --muted:#6E6A5E;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink); }
  .app{ display:flex; min-height:100vh; max-width:1040px; margin:0 auto; }
  .sidebar{ display:flex; flex-direction:column; gap:10px; padding:32px 0 32px 18px; width:190px; flex-shrink:0; }
  .brand{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; padding:0 0 20px 6px; letter-spacing:-0.01em; }
  .brand span{ font-style:italic; font-weight:500; color:var(--muted); font-size:15px; display:block; }
  .tab{
    position:relative; border:none; text-align:left; font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    padding:14px 16px 14px 18px; border-radius:10px 0 0 10px; cursor:pointer; color:var(--ink); background:var(--paper-2);
    border:1px solid var(--line); border-right:none; display:flex; align-items:center; gap:10px;
    transform:translateX(0); transition:transform .15s ease;
  }
  .tab:hover{ transform:translateX(-4px); }
  .tab .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .tab[data-cat="today"] .dot{ background:var(--ink); }
  .tab[data-cat="cours"] .dot{ background:var(--cours); }
  .tab[data-cat="revisions"] .dot{ background:var(--revisions); }
  .tab[data-cat="alternance"] .dot{ background:var(--alternance); }
  .tab[data-cat="sport"] .dot{ background:var(--sport); }
  .tab[data-cat="fiches"] .dot{ background:#6B4E9E; }
  .tab[data-cat="sources"] .dot{ background:#8A8578; }
  .tab[data-cat="progression"] .dot{ background:#3D6B4F; }
  .tab.active{ background:var(--paper); transform:translateX(-8px); border-color:var(--line-strong); z-index:2; }
  .count{ margin-left:auto; font-size:12px; color:var(--muted); font-weight:500; }
  .page{ flex:1; background:var(--paper-2); border-left:1px solid var(--line-strong); padding:36px 40px 60px; min-height:100vh; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:28px; margin:0 0 4px; }
  .subtitle{ color:var(--muted); font-size:14px; margin:0 0 24px; }

  .today-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:30px; }
  .stat-card{ border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--paper); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
  .stat-card:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(34,38,43,0.08); }
  .stat-card .n{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
  .stat-card .l{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .stat-card[data-cat="cours"]{ border-left:4px solid var(--cours); }
  .stat-card[data-cat="revisions"]{ border-left:4px solid var(--revisions); }
  .stat-card[data-cat="alternance"]{ border-left:4px solid var(--alternance); }
  .stat-card[data-cat="sport"]{ border-left:4px solid var(--sport); }

  .section-label{ font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:22px 0 8px; }
  .agenda-item{ display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .agenda-item .tag{ font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; flex-shrink:0; }
  .tag.cours{ background:var(--cours-bg); color:var(--cours); }
  .tag.revisions{ background:var(--revisions-bg); color:var(--revisions); }
  .tag.alternance{ background:var(--alternance-bg); color:var(--alternance); }
  .tag.sport{ background:var(--sport-bg); color:var(--sport); }
  .agenda-item .txt{ flex:1; }
  .agenda-item .meta{ color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .empty{ color:var(--muted); font-size:14px; font-style:italic; padding:14px 4px; }

  .form-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; padding:16px; background:var(--paper); border:1px solid var(--line); border-radius:12px; }
  .form-row input, .form-row select{ font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .form-row input[type="text"]{ flex:2; min-width:140px; }
  .form-row input[type="date"], .form-row input[type="time"]{ flex:1; min-width:110px; }
  .form-row select{ flex:1; min-width:110px; }
  .add-btn{ font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:8px; border:none; color:#fff; cursor:pointer; }
  .add-btn.cours{ background:var(--cours); }
  .add-btn.revisions{ background:var(--revisions); }
  .add-btn.alternance{ background:var(--alternance); }
  .add-btn.sport{ background:var(--sport); }

  .list{ display:flex; flex-direction:column; gap:8px; }
  .item{ display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--paper); border:1px solid var(--line); border-radius:10px; }
  .item.done{ opacity:0.5; }
  .item.done .item-title{ text-decoration:line-through; }
  .check{ width:19px; height:19px; border-radius:50%; border:2px solid var(--line-strong); flex-shrink:0; cursor:pointer; background:transparent; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .item.done .check{ background:var(--ink); }
  .item-body{ flex:1; min-width:0; }
  .item-title{ font-weight:600; font-size:14px; }
  .item-meta{ font-size:12.5px; color:var(--muted); margin-top:1px; }
  .prio{ font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; flex-shrink:0; }
  .prio.haute{ background:#F2DBDD; color:#9C3540; }
  .prio.moyenne{ background:#F3E3C8; color:#A9660A; }
  .prio.basse{ background:#DEEAE1; color:#3D6B4F; }
  .del{ background:none; border:none; cursor:pointer; color:var(--muted); font-size:16px; padding:4px 6px; flex-shrink:0; }
  .del:hover{ color:var(--ink); }

  .loading{ color:var(--muted); font-size:14px; padding:20px 4px; }
  .reset-link{ margin-top:40px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:14px; }
  .reset-link button{ background:none; border:none; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:12px; padding:0; }

  .week-nav{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .week-nav button{ border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:14px; color:var(--ink); }
  .week-nav button:hover{ border-color:var(--line-strong); }
  .week-label{ font-weight:600; font-size:14.5px; flex:1; }
  .week-nav .today-btn{ font-size:12.5px; color:var(--cours); border-color:var(--cours); }
  .search-row{ margin-bottom:16px; }
  .search-row input{ width:100%; font-family:'Inter',sans-serif; font-size:13.5px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .day-block{ margin-bottom:18px; }
  .day-heading{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; margin-bottom:8px; text-transform:capitalize; }
  .day-heading.today-mark{ color:var(--cours); }
  .today-highlight{ border:2px solid var(--cours) !important; background:var(--cours-bg) !important; }
  .course-card{ display:flex; gap:12px; padding:12px 14px; background:var(--paper); border:1px solid var(--line); border-radius:10px; margin-bottom:7px; }
  .course-time{ font-weight:600; font-size:13px; color:var(--cours); flex-shrink:0; width:82px; }
  .course-body{ flex:1; min-width:0; }
  .course-title{ font-weight:600; font-size:14px; }

  /* clickable rows */
  .clickable{ cursor:pointer; transition:border-color .12s ease, transform .12s ease; }
  .clickable:hover{ border-color:var(--line-strong); transform:translateX(2px); }

  /* detail modal */
  .detail-overlay{
    position:fixed; inset:0; background:rgba(34,38,43,0.45);
    display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:50;
  }
  .detail-overlay.hidden{ display:none; }
  .detail-card{
    background:var(--paper-2); border-radius:16px; border:1px solid var(--line-strong);
    max-width:480px; width:100%; max-height:85vh; overflow-y:auto;
    padding:28px 30px; box-shadow:0 12px 32px rgba(0,0,0,0.25);
  }
  .detail-close{
    float:right; background:none; border:none; font-size:20px; cursor:pointer;
    color:var(--muted); line-height:1; padding:0 0 0 12px;
  }
  .detail-close:hover{ color:var(--ink); }
  .detail-eyebrow{ font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px; }
  .detail-title{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 18px; padding-right:20px; }
  .detail-row{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row .k{ color:var(--muted); width:110px; flex-shrink:0; font-weight:500; }
  .detail-row .v{ flex:1; }
  .detail-exo{ font-size:13.5px; line-height:1.9; margin-top:6px; }
  .course-meta{ font-size:12.5px; color:var(--muted); margin-top:2px; }

  /* fiches de cours */
  .fiche-tabs{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .fiche-tab-btn{
    border:1px solid var(--line); background:var(--paper); border-radius:20px;
    padding:8px 16px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink);
  }
  .fiche-tab-btn.active{ background:#6B4E9E; color:#fff; border-color:#6B4E9E; }
  .fiche-content{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:24px 28px; }
  .fiche-h1{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; color:#6B4E9E; margin:26px 0 10px; }
  .fiche-h1:first-child{ margin-top:0; }
  .fiche-h2{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; margin:18px 0 8px; }
  .fiche-p{ font-size:14px; line-height:1.6; margin:0 0 12px; }
  .fiche-ul{ margin:0 0 14px; padding-left:22px; }
  .fiche-ul li{ font-size:14px; line-height:1.6; margin-bottom:6px; }
  .fiche-example{ font-size:13.5px; font-style:italic; background:#F0EAF7; border-left:3px solid #6B4E9E; padding:10px 14px; border-radius:6px; margin:0 0 14px; }
  .fiche-note{ font-size:13px; font-style:italic; color:var(--muted); margin:0 0 14px; }
  .fiche-code{ font-family:'Consolas',monospace; font-size:12.5px; background:#F5F0E4; border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:0 0 12px; white-space:pre-wrap; }
  .fiche-table{ width:100%; border-collapse:collapse; margin:0 0 16px; font-size:13px; }
  .fiche-table th{ background:#6B4E9E; color:#fff; text-align:left; padding:8px 10px; font-weight:600; }
  .fiche-table td{ border-bottom:1px solid var(--line); padding:8px 10px; vertical-align:top; }
  .fiche-card{ display:flex; align-items:center; gap:12px; padding:16px 18px; background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; }
  .fiche-card:hover{ border-color:#6B4E9E; }
  .fiche-card .fc-title{ font-weight:600; font-size:15px; }
  .fiche-card .fc-sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .fiche-sources{ background:#F0EAF7; border-radius:8px; padding:12px 16px; margin-bottom:18px; font-size:13px; }
  .fiche-sources ul{ margin:6px 0 0; padding-left:20px; }
  .fiche-sources li{ margin-bottom:3px; }
  .fiche-check{
    width:22px; height:22px; border-radius:50%; border:2px solid #6B4E9E; flex-shrink:0;
    cursor:pointer; background:transparent; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#fff; margin-right:2px;
  }
  .fiche-check.done{ background:#6B4E9E; }
  .progress-bar-track{ width:100%; height:10px; background:var(--line); border-radius:6px; overflow:hidden; }
  .progress-bar-fill{ height:100%; background:#6B4E9E; border-radius:6px; transition:width .2s ease; }
  .progress-row{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .progress-row .pr-label{ width:230px; flex-shrink:0; font-size:13.5px; font-weight:600; }
  .progress-row .pr-pct{ width:48px; flex-shrink:0; text-align:right; font-size:13px; color:var(--muted); }
  .progress-global{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:22px 26px; margin-bottom:26px; text-align:center; }
  .progress-global .pg-pct{ font-family:'Fraunces',serif; font-size:42px; font-weight:600; color:#6B4E9E; }
  .progress-global .pg-label{ font-size:13px; color:var(--muted); margin-top:4px; }
  .progress-day-group{ margin-bottom:14px; }
  .progress-day-heading{ font-weight:600; font-size:13.5px; margin-bottom:6px; color:#6B4E9E; }
</style>
</head>

  <div class="sidebar">

    <button class="tab active" data-cat="today"><span class="dot"></span>Aujourd'hui</button>

</div>

<div class="detail-overlay hidden" id="detail-overlay" onclick="closeDetailBg(event)">

</div>

  'pc-kotlin': {

    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>kotlin.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Kotlin en une phrase</h3><p class=\"fiche-p\">Langage moderne, 100% interopérable avec Java (même bytecode JVM), qui vise à réduire le code répétitif (boilerplate) et à sécuriser certains pièges classiques de Java (null pointer notamment).</p><h3 class=\"fiche-h1\">2. Variables : val vs var</h3><table class=\"fiche-table\"><thead><tr><th>Mot-clé</th><th>Équivalent Java</th><th>Rôle</th></tr></thead><tbody><tr><td>val</td><td>final</td><td>Valeur immuable, assignée une seule fois</td></tr><tr><td>var</td><td>(rien)</td><td>Valeur modifiable</td></tr></tbody></table><p class=\"fiche-note\">Kotlin encourage l'usage de val par défaut — préférer l'immuabilité sauf besoin explicite de mutabilité.</p><h3 class=\"fiche-h1\">3. La Null Safety — l'apport le plus connu de Kotlin</h3><table class=\"fiche-table\"><thead><tr><th>Notation</th><th>Signification</th></tr></thead><tbody><tr><td>String</td><td>Ne peut JAMAIS être null (vérifié à la compilation)</td></tr><tr><td>String?</td><td>Peut être null — type \"nullable\" explicite</td></tr><tr><td>?.</td><td>Appel sécurisé : n'exécute l'appel que si l'objet n'est pas null, sinon renvoie null</td></tr><tr><td>?:</td><td>Opérateur Elvis : fournit une valeur par défaut si l'expression à gauche est null</td></tr><tr><td>!!</td><td>Force le déréférencement (assume que ce n'est pas null) — À ÉVITER, réintroduit le risque de NullPointerException</td></tr></tbody></table><pre class=\"fiche-code\">val nom: String? = null\nval longueur = nom?.length ?: 0   // sécurisé : si nom est null, longueur = 0\nval force = nom!!.length          // dangereux : lève une exception si nom est null</pre><h3 class=\"fiche-h1\">4. Data class</h3><p class=\"fiche-p\">Une data class génère AUTOMATIQUEMENT : equals()/hashCode(), toString(), et une méthode copy() (pour dupliquer un objet en changeant certains attributs) — l'équivalent de ce que Lombok apporte en Java, mais nativement dans le langage.</p><pre class=\"fiche-code\">data class Personne(val nom: String, val age: Int)\nval p1 = Personne(\"Alice\", 30)\nval p2 = p1.copy(age = 31)  // clone avec un seul attribut modifié</pre><h3 class=\"fiche-h1\">5. Les objets (object) — Singleton natif</h3><p class=\"fiche-p\">Le mot-clé object déclare directement un Singleton : les propriétés/fonctions sont STATIC et INDÉPENDANTES (pas besoin du pattern Singleton fait main comme en Java).</p><h3 class=\"fiche-h1\">6. Instructions vues comme des expressions</h3><p class=\"fiche-p\">Différence fondamentale avec Java : if/else, try/catch et when sont des EXPRESSIONS (elles renvoient une valeur directement), pas de simples instructions.</p><table class=\"fiche-table\"><thead><tr><th>Construction Java</th><th>Équivalent Kotlin</th></tr></thead><tbody><tr><td>if classique + opérateur ternaire (A?B:C)</td><td>if/else UNIQUEMENT, vu comme une expression — le ternaire n'existe pas en Kotlin</td></tr><tr><td>switch</td><td>when — bien plus puissant : conditions d'égalité multiples, conditions booléennes, conditions de TYPE (is MaClasse)</td></tr></tbody></table><p class=\"fiche-note\">Piège Kotlin à connaître : le when N'A PAS BESOIN de branche else si Kotlin peut prouver que tous les cas sont couverts (typiquement avec une sealed class, voir plus bas).</p><h3 class=\"fiche-h1\">7. Héritage et interfaces</h3><p class=\"fiche-p\">Une classe est FINALE par défaut (non héritable) — il faut la marquer explicitement open pour permettre l'héritage (inverse de Java où tout est ouvert par défaut sauf final). Une classe fille transmet les propriétés à la classe mère directement via son constructeur.</p><p class=\"fiche-p\">Un attribut de la classe mère ne peut être redéfini (override) dans une classe fille QUE s'il est marqué open dans la classe mère.</p><h3 class=\"fiche-h1\">8. Les sealed class</h3><p class=\"fiche-p\">Crée un ENSEMBLE FERMÉ de sous-classes connues à la compilation : les classes filles ne peuvent PAS être redéfinies en dehors, et la redéfinition ne se fait qu'à UN SEUL niveau de hiérarchie.</p><p class=\"fiche-note\">Intérêt pratique majeur : dans un when portant sur une sealed class, PAS BESOIN de branche else — le compilateur connaît TOUTES les implémentations possibles et vérifie l'exhaustivité.</p><h3 class=\"fiche-h1\">9. Généricité, covariance et contravariance</h3><table class=\"fiche-table\"><thead><tr><th>Notation</th><th>Nom</th><th>Utilisable en</th><th>Autorise</th></tr></thead><tbody><tr><td>&lt;T&gt;</td><td>Générique simple</td><td>Paramètres et retour</td><td>Le type T</td></tr><tr><td>&lt;out T&gt;</td><td>Covariance</td><td>SEULEMENT en retour (pas en paramètre)</td><td>Les SOUS-types de T</td></tr><tr><td>&lt;in T&gt;</td><td>Contravariance</td><td>SEULEMENT en paramètre (pas en retour)</td><td>Les SUR-types (types plus généraux) de T</td></tr></tbody></table><p class=\"fiche-note\">Moyen mnémotechnique : out = \"sort\" (en sortie/retour) ; in = \"entre\" (en paramètre d'entrée).</p><p class=\"fiche-p\">Any équivaut au type Object de Java ; s'écrit MaClasse&lt;Any&gt; ou de façon équivalente MaClasse&lt;*&gt;.</p><h3 class=\"fiche-h1\">10. Boucles fonctionnelles</h3><p class=\"fiche-p\">Kotlin propose les boucles classiques (for, while, do-while) ET des opérateurs fonctionnels façon streams : .map{}, .mapNotNull{}, .filter{}, .reduce{}, .forEach{}, .first{}, .firstOrNull{} — syntaxe proche de TypeScript.</p><pre class=\"fiche-code\">listOf(1,2,3).map { it * 2 }              // \"it\" = paramètre implicite non nommé\nlistOf(1,2,3).map { valeur -> valeur * 2 } // paramètre nommé explicitement\nlistOf(1,2,3).map(MaClasse::maFonction)    // référence de fonction</pre><p class=\"fiche-note\">Dans un lambda, la DERNIÈRE instruction est automatiquement considérée comme la valeur de retour — pas besoin d'écrire return explicitement.</p>",
    fiche: "<h3 class=\"fiche-h1\">val vs var</h3><p class=\"fiche-p\">val = immuable (final). var = modifiable. Préférer val par défaut.</p><h3 class=\"fiche-h1\">Null Safety — à connaître par cœur</h3><table class=\"fiche-table\"><thead><tr><th>Symbole</th><th>Rôle</th></tr></thead><tbody><tr><td>Type?</td><td>Peut être null</td></tr><tr><td>?.</td><td>Appel sécurisé</td></tr><tr><td>?:</td><td>Valeur par défaut (Elvis)</td></tr><tr><td>!!</td><td>Force (dangereux, à éviter)</td></tr></tbody></table><h3 class=\"fiche-h1\">data class</h3><p class=\"fiche-p\">Génère automatiquement equals/hashCode, toString, copy().</p><h3 class=\"fiche-h1\">object</h3><p class=\"fiche-p\">= Singleton natif du langage.</p><h3 class=\"fiche-h1\">if/when/try = expressions</h3><p class=\"fiche-p\">Renvoient une valeur directement. Pas d'opérateur ternaire en Kotlin (if/else le remplace).</p><h3 class=\"fiche-h1\">Héritage</h3><p class=\"fiche-p\">Classe FERMÉE par défaut → il faut 'open' pour autoriser l'héritage (inverse de Java).</p><h3 class=\"fiche-h1\">sealed class</h3><p class=\"fiche-p\">Ensemble fermé de sous-classes connues → pas de 'else' nécessaire dans un when (exhaustivité vérifiée à la compilation).</p><h3 class=\"fiche-h1\">Covariance / Contravariance — mnémotechnique</h3><table class=\"fiche-table\"><thead><tr><th>Notation</th><th>Sens</th><th>Astuce</th></tr></thead><tbody><tr><td>&lt;out T&gt;</td><td>Covariance, en SORTIE seulement</td><td>out = sort</td></tr><tr><td>&lt;in T&gt;</td><td>Contravariance, en ENTRÉE seulement</td><td>in = entre</td></tr></tbody></table><h3 class=\"fiche-h1\">Boucles fonctionnelles</h3><ul class=\"fiche-ul\"><li>map, filter, reduce, forEach, first/firstOrNull</li><li>it = paramètre implicite</li><li>Dernière instruction du lambda = valeur de retour (pas de 'return')</li></ul>",

    chapitre: "Spring - fondamentaux (IoC, DI, Beans, REST)",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>Cours-fondamentaux-Spring.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Spring en une phrase</h3><p class=\"fiche-p\">Framework serveur web Java, basé sur les principes du Java 2E (Java Entreprise Edition), qui aide les développeurs à se concentrer sur le MÉTIER plutôt que sur la plomberie technique, pour créer des applications robustes.</p><h3 class=\"fiche-h1\">2. Inversion de contrôle (IoC) et Inversion de dépendance (IoD)</h3><p class=\"fiche-p\">Principe général de l'inversion de contrôle : au lieu que le code applicatif contrôle directement la création et l'orchestration de ses dépendances, c'est le FRAMEWORK (le conteneur Spring) qui prend ce contrôle à sa charge.</p><p class=\"fiche-p\">L'inversion de dépendance va plus loin : le code dépend d'ABSTRACTIONS (interfaces) plutôt que d'implémentations concrètes — cohérent avec le principe SOLID \"Dependency Inversion\" vu dans le chapitre anti-patterns.</p><h3 class=\"fiche-h1\">3. Injection de dépendance (DI)</h3><p class=\"fiche-p\">Concrétisation de l'IoC/IoD dans Spring : les dépendances d'un objet lui sont FOURNIES (injectées) plutôt que créées par lui-même. 2 façons de faire :</p><table class=\"fiche-table\"><thead><tr><th>Méthode</th><th>Principe</th></tr></thead><tbody><tr><td>Annotation @Autowired</td><td>Spring injecte automatiquement la dépendance dans un champ ou un setter.</td></tr><tr><td>Par constructeur</td><td>Les dépendances sont passées en paramètres du constructeur (approche recommandée pour la testabilité).</td></tr></tbody></table><h3 class=\"fiche-h1\">4. L'Application Context et les Beans</h3><p class=\"fiche-p\">L'Application Context est le conteneur central de Spring, qui gère des BEANS (objets gérés par le framework) et des CONFIGURATIONS.</p><table class=\"fiche-table\"><thead><tr><th>Catégorie</th><th>Annotations</th></tr></thead><tbody><tr><td>Beans</td><td>@Repository, @Component, @Service, @Controller, @ControllerAdvice</td></tr><tr><td>Configuration</td><td>@Configuration, @Bean</td></tr></tbody></table><h4 class=\"fiche-h2\">Les annotations liées aux Beans</h4><table class=\"fiche-table\"><thead><tr><th>Annotation</th><th>Rôle</th></tr></thead><tbody><tr><td>@Bean</td><td>Déclare la création d'un objet ou d'une méthode, enregistré dans l'Application Context — toutes les autres annotations de bean (@Component, @Service...) en sont un héritage/une spécialisation.</td></tr><tr><td>@Primary</td><td>Donne la PRIORITÉ à un bean particulier quand plusieurs candidats existent pour une même injection.</td></tr><tr><td>@Configuration</td><td>Couplée avec @Properties — sert à déclarer des beans ou des primary beans dans une classe de configuration dédiée.</td></tr></tbody></table><h3 class=\"fiche-h1\">5. Les API REST avec Spring</h3><p class=\"fiche-p\">Flux typique : un objet Request (JSON d'entrée) est DÉSÉRIALISÉ vers un objet applicatif, traité, puis un objet DTO est SÉRIALISÉ en JSON de sortie.</p><table class=\"fiche-table\"><thead><tr><th>Annotation</th><th>Verbe HTTP</th><th>Usage</th></tr></thead><tbody><tr><td>@GetMapping</td><td>GET</td><td>Récupérer de l'information</td></tr><tr><td>@PostMapping</td><td>POST</td><td>Envoyer de l'information (création)</td></tr><tr><td>@PutMapping</td><td>PUT</td><td>Remplacement complet de l'information</td></tr><tr><td>@PatchMapping</td><td>PATCH</td><td>Mise à jour partielle de l'information</td></tr><tr><td>@DeleteMapping</td><td>DELETE</td><td>Suppression de l'information</td></tr></tbody></table><h3 class=\"fiche-h1\">6. Bonnes pratiques architecturales</h3><h4 class=\"fiche-h2\">6.1 Architecture hexagonale</h4><p class=\"fiche-p\">Organise le code en isolant la logique métier des détails techniques (API REST, base de données...), reliés via des ADAPTATEURS (patron Adapter, voir chapitre Patrons structurels) — permet de changer une brique technique sans toucher au métier.</p><h4 class=\"fiche-h2\">6.2 Approche DTO (Data Transfer Object)</h4><p class=\"fiche-p\">Ne JAMAIS exposer directement une Entité de base de données via l'API — toujours passer par un Mapper qui convertit MonEntity en MonEntityDTO. Deux raisons principales données en cours :</p><ul class=\"fiche-ul\"><li>Éviter les StackOverflowError : la sérialisation d'une entité avec des relations BIDIRECTIONNELLES crée facilement une boucle infinie.</li><li>Appliquer des transformations sur l'objet exposé : modifier des mises en forme (dates...), retirer des champs sensibles (ex : l'id technique de la base).</li></ul><h4 class=\"fiche-h2\">6.3 Organisation des classes (architecture hexagonale complète)</h4><p class=\"fiche-p\">Flux typique : Utilisateur → @Controller → @Service (logique métier) → @Repository/@Entity (données) → Base de données, avec @Mapper pour les conversions DTO↔Entité, @Config pour la configuration, et un @ControllerAdvice pour la gestion centralisée des exceptions REST.</p><h3 class=\"fiche-h1\">7. Gestion des erreurs — 2 types d'exceptions à distinguer</h3><table class=\"fiche-table\"><thead><tr><th>Type</th><th>Hérite de</th><th>Rôle</th></tr></thead><tbody><tr><td>Exception technique</td><td>Exception</td><td>Couvre toutes les erreurs possibles de la logique applicative ; doit être explicite pour faciliter le débogage.</td></tr><tr><td>Exception d'API</td><td>RuntimeException</td><td>Récupérée par un handler (@ControllerAdvice) pour renvoyer une erreur COMPRÉHENSIBLE au client, sans exposer les détails techniques internes.</td></tr></tbody></table><h3 class=\"fiche-h1\">8. Outils complémentaires courants</h3><ul class=\"fiche-ul\"><li>Lombok : génère automatiquement du code répétitif (getters/setters, builders...) à partir d'annotations.</li><li>MapStruct : génère automatiquement le code d'un Mapper à partir d'un contrat d'interface (ex : MonEntity ↔ MonEntityDTO).</li><li>Swagger : documentation interactive et testable des API REST.</li><li>Gestionnaire de dépendances (Maven/Gradle) : importer/exporter les librairies du projet.</li><li>Docker / Docker-compose : créer des conteneurs isolés du système hôte, adaptables à toute machine, et mettre en relation plusieurs conteneurs à la fois (ex : app + base de données).</li></ul>",
    fiche: "<h3 class=\"fiche-h1\">Spring en une phrase</h3><p class=\"fiche-p\">Framework Java qui inverse le contrôle des dépendances pour que le développeur se concentre sur le métier.</p><h3 class=\"fiche-h1\">IoC / IoD / DI — à distinguer</h3><ul class=\"fiche-ul\"><li>IoC : le framework prend le contrôle (création/orchestration)</li><li>IoD : dépendre d'abstractions, pas d'implémentations</li><li>DI : concrétisation via @Autowired ou par constructeur</li></ul><h3 class=\"fiche-h1\">Beans — annotations clés</h3><table class=\"fiche-table\"><thead><tr><th>Annotation</th><th>Rôle</th></tr></thead><tbody><tr><td>@Bean</td><td>Déclare un objet géré par Spring</td></tr><tr><td>@Component/@Service/@Repository/@Controller</td><td>Spécialisations de @Bean</td></tr><tr><td>@Primary</td><td>Priorité entre plusieurs candidats</td></tr><tr><td>@Configuration</td><td>Classe de config, couplée à @Properties</td></tr></tbody></table><h3 class=\"fiche-h1\">API REST — verbes HTTP</h3><table class=\"fiche-table\"><thead><tr><th>Annotation</th><th>Verbe</th></tr></thead><tbody><tr><td>@GetMapping</td><td>GET</td></tr><tr><td>@PostMapping</td><td>POST</td></tr><tr><td>@PutMapping</td><td>PUT</td></tr><tr><td>@PatchMapping</td><td>PATCH</td></tr><tr><td>@DeleteMapping</td><td>DELETE</td></tr></tbody></table><h3 class=\"fiche-h1\">DTO — pourquoi ne jamais exposer l'Entité directement</h3><ul class=\"fiche-ul\"><li>Éviter les StackOverflow (relations bidirectionnelles)</li><li>Transformer/filtrer les champs exposés (dates, id technique...)</li></ul><h3 class=\"fiche-h1\">2 types d'exceptions</h3><table class=\"fiche-table\"><thead><tr><th>Type</th><th>Hérite de</th><th>But</th></tr></thead><tbody><tr><td>Technique</td><td>Exception</td><td>Explicite, pour le debug</td></tr><tr><td>D'API</td><td>RuntimeException</td><td>Récupérée par un handler, message client compréhensible</td></tr></tbody></table><h3 class=\"fiche-h1\">Outils à citer</h3><ul class=\"fiche-ul\"><li>Lombok (génère le code répétitif)</li><li>MapStruct (génère les Mappers)</li><li>Swagger (doc API)</li><li>Docker/Docker-compose (conteneurs)</li></ul>",
    corriges: "<p class=\"fiche-p\">Pas d annales dediees. Ce chapitre est surtout pratique (TP), les erreurs classiques sont deja notees dans le resume (mappedBy, DTO...).</p>"
  },
  'pc-jpa': {
    matiere: "Patrons et composants",
    chapitre: "JPA - ORM, relations, repositories",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>Cours-JPA.pdf</li></ul></div><h3 class=\"fiche-h1\">1. DAO vs JPA — le point de départ</h3><table class=\"fiche-table\"><thead><tr><th>DAO (fait main)</th><th>JPA</th></tr></thead><tbody><tr><td>Le développeur représente les données de la table, écrit lui-même les actions CRUD, gère les relations et les cascades — le tout dépendant du SGBD utilisé.</td><td>Déclaration du modèle + des relations : JPA fait le CRUD lui-même et gère la connexion entre les objets Java et la base, de façon standardisée.</td></tr></tbody></table><h3 class=\"fiche-h1\">2. ORM et JPA</h3><p class=\"fiche-p\">L'ORM (Object Relationship Mapping) transforme un MODÈLE APPLICATIF (classes Java) en SCHÉMA RELATIONNEL (tables), et inversement. JPA (Java Persistence API) est un STANDARD : un contrat d'interface + des annotations, que différents ORM (Hibernate étant le plus courant) implémentent concrètement.</p><p class=\"fiche-p\">3 avantages de JPA : réduit la complexité du code, réduit sa lourdeur, permet de ne plus écrire de SQL directement.</p><p class=\"fiche-p\">2 paradigmes possibles : mode CREATE (JPA crée le schéma de base à partir du mapping des entités) vs mode VALIDATE (JPA s'adapte à un schéma de base déjà existant, sans le modifier).</p><h3 class=\"fiche-h1\">3. Mapper une entité simple</h3><table class=\"fiche-table\"><thead><tr><th>Annotation</th><th>Rôle</th></tr></thead><tbody><tr><td>@Entity</td><td>Rend une classe persistante. Si name n'est pas précisé, le nom de la table = nom de la classe en snake_case ; sinon c'est le name indiqué qui est utilisé.</td></tr><tr><td>@Table</td><td>Précise le nom de la table (important si elle existe déjà en base), son schéma, ses index, ses contraintes d'unicité.</td></tr><tr><td>@Id</td><td>OBLIGATOIRE pour JPA — désigne la clé primaire de l'entité.</td></tr><tr><td>@Column</td><td>Déclare une colonne et ses particularités. Plus ou moins obligatoire en mode validate (documentation, lisibilité) ; inutile en mode create sauf pour déclarer une particularité spécifique.</td></tr></tbody></table><h3 class=\"fiche-h1\">4. Les 4 types de relations entre entités</h3><p class=\"fiche-p\">Nommage systématique : @CardinalitéClasseCouranteToCardinalitéClasseCible. Chaque relation peut être UNIDIRECTIONNELLE (un seul sens de navigation) ou BIDIRECTIONNELLE (les deux entités se référencent mutuellement).</p><h4 class=\"fiche-h2\">4.1 @OneToOne</h4><p class=\"fiche-p\">Piège à bien retenir : en bidirectionnel, on NE PEUT PAS mettre @OneToOne des deux côtés sans précision — cela créerait 2 colonnes de clé étrangère incohérentes entre elles. La solution est mappedBy : un seul côté est \"propriétaire\" de la relation (porte la colonne), l'autre déclare @OneToOne(mappedBy = \"nomAttributCoteProprietaire\").</p><pre class=\"fiche-code\">@Entity\npublic class LogicielEntity {\n  @Id private String name;\n  @OneToOne(mappedBy = \"logiciel\")  // côté \"inverse\", pas de colonne\n  private LicenceEntity licence;\n}\n@Entity\npublic class LicenceEntity {\n  @Id private UUID uuid;\n  @OneToOne  // côté \"propriétaire\", porte la clé étrangère\n  private LogicielEntity logiciel;\n}</pre><h4 class=\"fiche-h2\">4.2 @ManyToOne et @OneToMany</h4><p class=\"fiche-p\">@ManyToOne (unidirectionnel) : plusieurs Patients pointent vers UN Dentiste — la clé étrangère est du côté \"Many\" (Patient). @OneToMany (unidirectionnel) nécessite un @JoinColumn explicite car, sans mappedBy, JPA doit créer une table intermédiaire par défaut, ce qui n'est pas toujours voulu.</p><p class=\"fiche-p\">En BIDIRECTIONNEL, la combinaison classique est : le côté @ManyToOne est propriétaire (porte la clé étrangère), le côté @OneToMany utilise mappedBy pour pointer vers l'attribut du côté propriétaire.</p><pre class=\"fiche-code\">@Entity\npublic class DentisteEntity {\n  @OneToMany(mappedBy = \"dentiste\")\n  private Set<PatientEntity> patients;\n}\n@Entity\npublic class PatientEntity {\n  @ManyToOne  // côté propriétaire, porte la clé étrangère dentiste_id\n  private DentisteEntity dentiste;\n}</pre><h4 class=\"fiche-h2\">4.3 @ManyToMany</h4><p class=\"fiche-p\">Nécessite une TABLE D'ASSOCIATION intermédiaire en base (générée automatiquement par JPA). En bidirectionnel, même principe que les autres relations : un seul côté est propriétaire, l'autre utilise mappedBy pour éviter de créer DEUX tables d'association distinctes et incohérentes.</p><pre class=\"fiche-code\">@Entity\npublic class LivreEntity {\n  @ManyToMany  // côté propriétaire\n  private Set<AuteurEntity> auteurs;\n}\n@Entity\npublic class AuteurEntity {\n  @ManyToMany(mappedBy = \"auteurs\")  // côté inverse\n  private Set<LivreEntity> livres;\n}</pre><p class=\"fiche-note\">Règle générale à retenir pour TOUTE relation bidirectionnelle : un seul côté porte la relation physiquement (colonne ou table d'association), l'autre utilise systématiquement mappedBy pour pointer vers l'attribut du côté propriétaire — sinon JPA crée une structure incohérente ou redondante en base.</p><h3 class=\"fiche-h1\">5. Égalité, Fetch et Cascade</h3><table class=\"fiche-table\"><thead><tr><th>Notion</th><th>Type 1</th><th>Type 2</th></tr></thead><tbody><tr><td>Égalité</td><td>Naturelle : correspond au .equals() Java, utilisée dans les collections Java</td><td>En base : correspond à l'id en base de données</td></tr><tr><td>Fetch</td><td>EAGER : les données sont chargées immédiatement, dès le chargement de l'entité</td><td>LAZY : les données ne sont chargées qu'au moment où on les appelle explicitement (ex : monObjet.getMaRelation())</td></tr></tbody></table><p class=\"fiche-p\">CASCADE : propage une opération de l'entité \"parent\" vers ses entités liées. 5 types : PERSIST, REMOVE, DETACH, REFRESH, MERGE (peuvent se combiner).</p><h3 class=\"fiche-h1\">6. Les Repositories Spring Data JPA</h3><p class=\"fiche-p\">JpaRepository&lt;T, ID&gt; est une interface Java STANDARD fournissant déjà save(), findAll(), findAllById(), getOne(), delete()... sans écrire une seule ligne de SQL.</p><p class=\"fiche-p\">2 façons d'ajouter des requêtes personnalisées :</p><pre class=\"fiche-code\">@Repository\npublic interface DentisteRepository extends JpaRepository<DentisteEntity, String> {\n\n  // Création de requête par INTERPOLATION DU NOM de la méthode\n  Optional<DentisteEntity> findDentisteByNomAndPrenom(String nom, String prenom);\n\n  // Requête JPQL explicite (portable, orientée objet/entités)\n  @Query(\"select d from Dentiste d where d.nom = ?1 and d.prenom = ?2\")\n  DentisteEntity getWithJpqlQuery(String nom, String prenom);\n\n  // Requête SQL native (dépendante du SGBD)\n  @Query(value = \"select * from public.dentiste_entity d where d.nom = ?1 and d.prenom = ?2\", nativeQuery = true)\n  DentisteEntity getWithSqlQuery(String nom, String prenom);\n}</pre><h3 class=\"fiche-h1\">7. JPQL</h3><p class=\"fiche-p\">Langage de requête orienté OBJETS (porte sur les entités Java, pas directement les tables SQL) — mêmes opérateurs et fonctions que SQL (agrégations COUNT/SUM, fonctions arithmétiques ABS/SQRT, fonctions chaînes CONCAT...), mais À UTILISER AVEC PARCIMONIE : JPQL perd l'avantage de portabilité/abstraction de JPA dès qu'on l'utilise trop, en se rapprochant à nouveau du SQL brut.</p>",
    fiche: "<h3 class=\"fiche-h1\">DAO vs JPA</h3><p class=\"fiche-p\">DAO = tout fait main, dépendant du SGBD. JPA = déclaratif (modèle + relations), le CRUD est automatique.</p><h3 class=\"fiche-h1\">Annotations de base d'une entité</h3><table class=\"fiche-table\"><thead><tr><th>Annotation</th><th>Rôle</th></tr></thead><tbody><tr><td>@Entity</td><td>Rend la classe persistante</td></tr><tr><td>@Table</td><td>Nom/schéma/index de la table</td></tr><tr><td>@Id</td><td>OBLIGATOIRE, clé primaire</td></tr><tr><td>@Column</td><td>Colonne + particularités</td></tr></tbody></table><h3 class=\"fiche-h1\">Règle d'or des relations bidirectionnelles</h3><p class=\"fiche-p\">Un seul côté est PROPRIÉTAIRE (porte la colonne/table d'association) ; l'autre utilise mappedBy = \"attribut du côté propriétaire\".</p><h3 class=\"fiche-h1\">4 types de relations</h3><table class=\"fiche-table\"><thead><tr><th>Relation</th><th>Cas typique</th></tr></thead><tbody><tr><td>@OneToOne</td><td>Logiciel ↔ Licence</td></tr><tr><td>@ManyToOne</td><td>Patient → Dentiste (côté propriétaire)</td></tr><tr><td>@OneToMany</td><td>Dentiste → Patients (mappedBy)</td></tr><tr><td>@ManyToMany</td><td>Livre ↔ Auteur (table d'association)</td></tr></tbody></table><h3 class=\"fiche-h1\">Fetch : EAGER vs LAZY</h3><table class=\"fiche-table\"><thead><tr><th>EAGER</th><th>LAZY</th></tr></thead><tbody><tr><td>Chargé immédiatement</td><td>Chargé seulement à l'appel explicite</td></tr></tbody></table><h3 class=\"fiche-h1\">Cascade — 5 types</h3><ul class=\"fiche-ul\"><li>PERSIST</li><li>REMOVE</li><li>DETACH</li><li>REFRESH</li><li>MERGE</li></ul><h3 class=\"fiche-h1\">JpaRepository — 2 façons de requêter</h3><ul class=\"fiche-ul\"><li>Interpolation du nom de méthode (findXxxByYyy)</li><li>@Query (JPQL portable, ou SQL natif avec nativeQuery=true)</li></ul><p class=\"fiche-note\">JPQL : à utiliser avec parcimonie, sinon on perd l'intérêt de l'abstraction JPA.</p>",
    corriges: "<p class=\"fiche-p\">Pas d annales dediees. Ce chapitre est surtout pratique (TP), les erreurs classiques sont deja notees dans le resume (mappedBy, DTO...).</p>"

  'pc-antipattern': {
    matiere: "Patrons et composants",
    chapitre: "Anti-patterns et principes SOLID",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>anti-pattern.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Définition d'un anti-pattern</h3><p class=\"fiche-p\">Un anti-pattern (à l'inverse d'un design pattern, qui documente une BONNE solution) documente un ENSEMBLE D'ERREURS COURANTES de conception logicielle / mauvaises pratiques. Ils tirent leur nom de leurs conséquences typiques : lenteur, coûts de mise en place et de MAINTENANCE élevés, comportements anormaux et bugs.</p><p class=\"fiche-note\">Il existe aussi les GreyPatterns : des solutions qui ne sont ni clairement bonnes ni clairement mauvaises, à évaluer au cas par cas selon le contexte.</p><p class=\"fiche-p\">Deux origines fréquentes d'un anti-pattern : l'EXPÉRIENCE (une solution qui fonctionnait dans un contexte est mal réappliquée ailleurs) ou la MÉCONNAISSANCE (ignorance des bonnes pratiques/design patterns existants).</p><h3 class=\"fiche-h1\">2. Les anti-patterns classiques</h3><table class=\"fiche-table\"><thead><tr><th>Anti-pattern</th><th>Problème</th></tr></thead><tbody><tr><td>Objet divin (God Object)</td><td>Un objet avec BEAUCOUP TROP de responsabilités — devient difficile à tester et à faire évoluer.</td></tr><tr><td>Abstraction inverse</td><td>Un client d'une interface a besoin d'une fonctionnalité cachée dans l'implémentation, alors il RÉIMPLÉMENTE et duplique du code au lieu d'exposer proprement cette fonctionnalité dans l'interface.</td></tr><tr><td>Not Invented Here (NIH)</td><td>Refuser d'utiliser une solution existante simplement parce qu'elle n'a pas été développée en interne par l'entreprise.</td></tr><tr><td>Réinventer la roue carrée</td><td>Réinventer un objet qui existait déjà, mais en produisant une SOLUTION MOINS BONNE que l'originale.</td></tr><tr><td>Marteau doré (Golden Hammer)</td><td>Utiliser systématiquement le MÊME outil (une bibliothèque, une base de données, une suite logicielle) pour résoudre TOUS les problèmes, même quand il n'est pas adapté.</td></tr><tr><td>Spaghetti (code spaghetti)</td><td>Code tellement enchevêtré qu'il devient impossible de le modifier sans risquer de casser le fonctionnement existant.</td></tr><tr><td>Lasagnes</td><td>Trop de couches d'abstraction empilées, rendant le code difficile à suivre et à comprendre dans son ensemble.</td></tr></tbody></table><h3 class=\"fiche-h1\">3. Don't be S.T.U.P.I.D — les 6 défauts à éviter</h3><table class=\"fiche-table\"><thead><tr><th>Lettre</th><th>Défaut</th><th>Explication</th></tr></thead><tbody><tr><td>S</td><td>Singleton (couplage fort)</td><td>Trop de dépendances fortes vers d'autres classes (Tight Coupling).</td></tr><tr><td>T</td><td>Untestability (non testable)</td><td>Trop dépendant, non-respect de la responsabilité unique.</td></tr><tr><td>U</td><td>(inclus dans le précédent en pratique)</td><td>Voir ci-dessus.</td></tr><tr><td>P</td><td>Premature Optimization</td><td>Anticiper des problèmes qui n'existent pas encore — mieux vaut aller au plus simple d'abord.</td></tr><tr><td>I</td><td>Indescriptive Naming</td><td>Des noms de variables/méthodes trop complexes ou peu clairs — préférer un nommage descriptif.</td></tr><tr><td>D</td><td>Duplication</td><td>Répétition du code au lieu de le factoriser.</td></tr></tbody></table><h3 class=\"fiche-h1\">4. Be S.O.L.I.D — les 5 principes à respecter (le pendant positif)</h3><table class=\"fiche-table\"><thead><tr><th>Lettre</th><th>Principe</th><th>Définition</th></tr></thead><tbody><tr><td>S</td><td>Single Responsibility Principle</td><td>Une classe/fonction/méthode doit avoir UNE SEULE raison d'être modifiée.</td></tr><tr><td>O</td><td>Open/Closed</td><td>Une entité doit être FERMÉE à la modification directe mais OUVERTE à l'extension.</td></tr><tr><td>L</td><td>Liskov Substitution</td><td>Une instance de type T doit pouvoir être remplacée par une instance d'un sous-type G sans casser la cohérence du programme.</td></tr><tr><td>I</td><td>Interface Segregation</td><td>Préférer PLUSIEURS interfaces spécifiques par client plutôt qu'une seule interface générale fourre-tout.</td></tr><tr><td>D</td><td>Dependency Inversion</td><td>Dépendre des ABSTRACTIONS, pas des implémentations concrètes.</td></tr></tbody></table><p class=\"fiche-note\">S.O.L.I.D est directement lié aux design patterns : beaucoup des 23 patrons GoF sont des applications concrètes de ces 5 principes (ex : Strategy applique Open/Closed, Dependency Inversion justifie l'usage des interfaces dans Factory/Adapter...).</p>",
    fiche: "<h3 class=\"fiche-h1\">Anti-pattern en une phrase</h3><p class=\"fiche-p\">Documente une MAUVAISE solution récurrente (l'inverse d'un design pattern), caractérisée par lenteur, coût de maintenance, bugs.</p><h3 class=\"fiche-h1\">7 anti-patterns à savoir citer</h3><table class=\"fiche-table\"><thead><tr><th>Nom</th><th>Problème en 1 mot</th></tr></thead><tbody><tr><td>Objet divin</td><td>Trop de responsabilités</td></tr><tr><td>Abstraction inverse</td><td>Réimplémente au lieu d'exposer</td></tr><tr><td>Not Invented Here</td><td>Refuse l'existant par principe</td></tr><tr><td>Roue carrée</td><td>Réinvente, mais moins bien</td></tr><tr><td>Marteau doré</td><td>Un seul outil pour tout</td></tr><tr><td>Spaghetti</td><td>Code enchevêtré, impossible à modifier</td></tr><tr><td>Lasagnes</td><td>Trop de couches d'abstraction</td></tr></tbody></table><h3 class=\"fiche-h1\">Don't be S.T.U.P.I.D</h3><ul class=\"fiche-ul\"><li>S : couplage fort</li><li>T/U : non testable, trop dépendant</li><li>P : optimisation prématurée</li><li>I : nommage pas descriptif</li><li>D : duplication de code</li></ul><h3 class=\"fiche-h1\">Be S.O.L.I.D — à connaître par cœur</h3><ul class=\"fiche-ul\"><li>S : Responsabilité unique</li><li>O : Ouvert/fermé</li><li>L : Substitution de Liskov</li><li>I : Ségrégation des interfaces</li><li>D : Inversion des dépendances</li></ul>",

  'pc-reactivite': {
    matiere: "Patrons et composants",
    chapitre: "La reactivite (Spring WebFlux, Reactor)",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>reactivite.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Qu'est-ce que la réactivité ?</h3><p class=\"fiche-p\">Réagir en fonction d'événements, sur le pattern comportemental Observable (voir chapitre patrons comportementaux), basé sur l'ASYNCHRONISME, pour être NON BLOQUANT. Implémentée notamment par Angular (RxJS) et Spring (WebFlux).</p><h3 class=\"fiche-h1\">2. Spring Boot en mode bloquant (le modèle par défaut, vu en TP)</h3><p class=\"fiche-p\">Fonctionnement : un THREAD est attribué par requête cliente (dans un pool de threads). Ce thread lit la requête, interroge la base de données, ATTEND la réponse (bloqué pendant ce temps), écrit la réponse, puis se libère.</p><p class=\"fiche-note\">Conséquence : le serveur n'utilise PAS toutes ses ressources — un thread bloqué en attente de la BD ou d'un client externe lent est un thread \"gaspillé\", incapable de traiter une autre requête pendant ce temps. Modèle PEU PRÉDICTIBLE en cas de latences (BD lente, connexions lentes, clients externes lents).</p><h3 class=\"fiche-h1\">3. Spring Boot en mode non-bloquant (Reactor)</h3><p class=\"fiche-p\">Basé sur le design pattern REACTOR : un mécanisme d'event loop + démultiplexeur qui associe les opérations d'entrée/sortie à des handlers, sans jamais bloquer un thread en attente.</p><p class=\"fiche-p\">Fonctionnement : un petit nombre de WORKER THREADS traitent les requêtes de façon non-bloquante — un thread lance une opération d'E/S (ex : requête BD) et se libère IMMÉDIATEMENT pour traiter autre chose, sans attendre la réponse ; c'est l'event loop (Reactor) qui se charge de reprendre le traitement quand la réponse arrive.</p><table class=\"fiche-table\"><thead><tr><th>Modèle bloquant</th><th>Modèle non-bloquant (Reactor)</th></tr></thead><tbody><tr><td>1 thread par requête, attend la réponse</td><td>Peu de threads, jamais bloqués en attente d'E/S</td></tr><tr><td>N'utilise pas toutes les ressources serveur</td><td>Utilise complètement les ressources serveur</td></tr><tr><td>Peu prédictible (latences BD/réseau/client)</td><td>Résilient et SCALABLE</td></tr></tbody></table><p class=\"fiche-note\">Frameworks basés sur ce principe : Spring WebFlux (Reactor), Quarkus.</p><h3 class=\"fiche-h1\">4. Le pattern Observable appliqué : Publisher / Subscriber</h3><p class=\"fiche-p\">Un Publisher émet des données via onNext(data), potentiellement plusieurs fois, jusqu'à un signal complete ou error. Un Subscriber s'abonne pour recevoir ces émissions. Le BACKPRESSURE régule le flux entre les deux, pour éviter qu'un Publisher trop rapide ne submerge un Subscriber trop lent.</p><h3 class=\"fiche-h1\">5. Project Reactor : Mono&lt;T&gt; et Flux&lt;T&gt;</h3><table class=\"fiche-table\"><thead><tr><th>Type</th><th>Cardinalité</th><th>Usage</th></tr></thead><tbody><tr><td>Mono&lt;T&gt;</td><td>0 à 1 résultat</td><td>Transporte UN objet (ou aucun), peut subir des opérations (map, etc.) qui le transforment en Mono&lt;T'&gt;.</td></tr><tr><td>Flux&lt;T&gt;</td><td>1 à plusieurs résultats</td><td>Transporte PLUSIEURS objets dans un pipeline réactif ; peut être sérialisé en flux SSE (Server-Sent Events).</td></tr></tbody></table><pre class=\"fiche-code\">// API bloquante classique — bloque le thread pendant l'attente\ninterface UserRepository {\n  fun findByUsername(username: String): User  // renvoie un User ou lève une exception\n}\n\n// API non-bloquante (réactive) — libère le thread immédiatement\ninterface ReactiveUserRepository {\n  fun findByUsername(username: String): Mono<User>  // se termine sur un event complete ou error\n}</pre><p class=\"fiche-p\">Exemple Mono : Mono.just(\"Hello World!\").map(String::uppercase).subscribe(::println) — la transformation ne s'exécute qu'au moment du subscribe (traitement paresseux/lazy), et le thread appelant n'est jamais bloqué en attendant le résultat.</p><p class=\"fiche-p\">Exemple Flux en Server-Sent Events (SSE) : la réponse HTTP transmet les objets un par un, AU FUR ET À MESURE qu'ils deviennent disponibles (ex : un élément toutes les secondes), plutôt que d'attendre que TOUS les éléments soient prêts avant de répondre — le client reçoit chaque donnée dès qu'elle existe.</p><p class=\"fiche-note\">Piège à bien distinguer : sans SSE, un Flux attend l'événement complete (tous les éléments) avant de répondre en une seule fois ; en SSE, chaque élément est transmis dès qu'il est disponible, en flux continu (type text/event-stream).</p>",
    fiche: "<h3 class=\"fiche-h1\">Réactivité en une phrase</h3><p class=\"fiche-p\">Réagir aux événements de façon asynchrone et non bloquante — basé sur le pattern Observable (Publisher/Subscriber).</p><h3 class=\"fiche-h1\">Bloquant vs Non-bloquant (Reactor) — LE tableau à connaître</h3><table class=\"fiche-table\"><thead><tr><th></th><th>Bloquant</th><th>Non-bloquant (Reactor)</th></tr></thead><tbody><tr><td>Threads</td><td>1 par requête, attend</td><td>Peu, jamais bloqués</td></tr><tr><td>Ressources serveur</td><td>Sous-utilisées</td><td>Pleinement utilisées</td></tr><tr><td>Comportement</td><td>Peu prédictible (latences)</td><td>Résilient, scalable</td></tr></tbody></table><h3 class=\"fiche-h1\">Publisher / Subscriber</h3><ul class=\"fiche-ul\"><li>onNext(data) : émission</li><li>complete / error : fin du flux</li><li>Backpressure : régule le débit entre les deux</li></ul><h3 class=\"fiche-h1\">Mono vs Flux</h3><table class=\"fiche-table\"><thead><tr><th>Type</th><th>Cardinalité</th></tr></thead><tbody><tr><td>Mono&lt;T&gt;</td><td>0..1</td></tr><tr><td>Flux&lt;T&gt;</td><td>1..*</td></tr></tbody></table><h3 class=\"fiche-h1\">SSE (Server-Sent Events)</h3><p class=\"fiche-p\">Transmet chaque élément du Flux dès qu'il est disponible (flux continu), plutôt que d'attendre que tout le Flux se termine (complete) avant de répondre en bloc.</p><h3 class=\"fiche-h1\">Frameworks réactifs à citer</h3><ul class=\"fiche-ul\"><li>Spring WebFlux (basé sur Reactor)</li><li>Quarkus</li><li>Angular (RxJS, côté client)</li></ul>",
    corriges: "<p class=\"fiche-p\">Pas d annales dediees a ce chapitre pour l instant.</p>"

  'pc-dp-structurel': {
    matiere: "Patrons et composants",
    chapitre: "Design Patterns structurels (Adapter, Proxy, Composite...)",
    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>9patron_structurel.pdf</li></ul></div><h3 class=\"fiche-h1\">Principe général des patrons structurels</h3><p class=\"fiche-p\">Ils mettent en évidence les RELATIONS entre classes et objets, pour construire de gros systèmes et répondre à des problèmes spécifiques de composition. Deux notions de domaine à distinguer :</p><table class=\"fiche-table\"><thead><tr><th>Relations entre CLASSES</th><th>Relations entre OBJETS</th></tr></thead><tbody><tr><td>Via l'HÉRITAGE, de manière STATIQUE, souvent immuable une fois définie.</td><td>Via la COMPOSITION, de manière DYNAMIQUE (à l'exécution) — permet de spécifier finement le comportement d'un objet à travers celui des objets qui le composent.</td></tr></tbody></table><p class=\"fiche-p\">7 patrons structurels au programme : Adapter, Proxy, Composite, Décorateur, Bridge, Façade, Flyweight.</p><h3 class=\"fiche-h1\">1. Adapter</h3><p class=\"fiche-p\">Principe : faire collaborer deux interfaces INCOMPATIBLES, en transformant les données de l'une pour les rendre compatibles avec l'autre.</p><p class=\"fiche-p\">2 implémentations possibles : PAR CLASSES (via héritage) ou PAR OBJETS (via une interface) — l'implémentation par objets est la plus souvent utilisée et la plus simple à mettre en place.</p><p class=\"fiche-note\">Exemple cité en cours : l'architecture hexagonale, où les adaptateurs gèrent les appels vers des API externes.</p><h3 class=\"fiche-h1\">2. Proxy</h3><p class=\"fiche-p\">Principe : créer un SUBSTITUT d'un objet original, qui contrôle l'accès à cet objet — il peut agir AVANT et APRÈS avoir transmis (ou non) la demande à l'objet réel.</p><p class=\"fiche-note\">Les Proxy ne sont PAS obligés de transmettre systématiquement les appels selon la même logique — ce concept se retrouve aussi dans la manipulation de composants (ex : Excel, Word).</p><h3 class=\"fiche-h1\">3. Composite</h3><p class=\"fiche-p\">Principe : agencer des classes en ARBORESCENCE, et permettre de traiter un composite (groupe) exactement COMME un objet individuel — via une interface commune unifiant les deux cas.</p><p class=\"fiche-p\">Difficulté principale citée : le choix du CONTAINER (list, set...) et l'assemblage effectif des composites peut être complexe à coder correctement.</p><p class=\"fiche-note\">Peut être vu comme un Design Pattern à la fois structurel ET objet.</p><h3 class=\"fiche-h1\">4. Décorateur</h3><p class=\"fiche-p\">Principe : ajouter DYNAMIQUEMENT de nouveaux comportements à un objet, en le plaçant dans des wrappers (\"décorateurs\") qui implémentent ce nouveau comportement — de façon transparente pour le code appelant.</p><p class=\"fiche-note\">Exemple cité : @RestController en Spring appelle en réalité un objet intermédiaire qui gère la sérialisation/désérialisation avant d'atteindre vos méthodes.</p><h3 class=\"fiche-h1\">Décorateur vs Composite — LE piège classique</h3><table class=\"fiche-table\"><thead><tr><th></th><th>Décorateur</th><th>Composite</th></tr></thead><tbody><tr><td>Intention</td><td>Ajouter un comportement dynamique</td><td>Structurer une hiérarchie générique/hétérogène</td></tr><tr><td>Mécanisme</td><td>Composition d'objet (PAS de l'héritage)</td><td>Agrégation, structure arborescente</td></tr><tr><td>Classe des objets</td><td>Reste dans la MÊME classe/interface dans les séquences d'appel</td><td>Structure hétérogène (feuilles ET composites)</td></tr></tbody></table><h3 class=\"fiche-h1\">5. Bridge</h3><p class=\"fiche-p\">Principe : séparer une ABSTRACTION de son IMPLÉMENTATION, en 2 structures de classes DISTINCTES qui peuvent évoluer indépendamment l'une de l'autre.</p><h3 class=\"fiche-h1\">Bridge vs Adapter — LE piège classique</h3><table class=\"fiche-table\"><thead><tr><th></th><th>Bridge</th><th>Adapter</th></tr></thead><tbody><tr><td>Intention</td><td>Faire du DÉCOUPLAGE (prévu dès la conception)</td><td>Faire du \"code glue\" pour un manque de compatibilité (souvent après-coup)</td></tr><tr><td>Moment</td><td>Anticipé À LA CONCEPTION</td><td>Résout une incompatibilité EXISTANTE entre 2 interfaces</td></tr><tr><td>Solutions</td><td>Assez proches structurellement !</td><td></td></tr></tbody></table><h3 class=\"fiche-h1\">6. Façade</h3><p class=\"fiche-p\">Principe : apporter une interface SIMPLIFIÉE à un ensemble de classes complexes (typiquement un framework ou une librairie), en cachant leur complexité interne.</p><h3 class=\"fiche-h1\">Façade vs Adapter — encore un piège classique</h3><table class=\"fiche-table\"><thead><tr><th></th><th>Façade</th><th>Adapter</th></tr></thead><tbody><tr><td>But</td><td>RENDRE UTILISABLE une interface existante (simplifier)</td><td>TRANSFORMER une interface pour la rendre compatible avec une autre</td></tr></tbody></table><p class=\"fiche-note\">Une Façade utilise fréquemment un objet Singleton pour son point d'accès unique.</p><h3 class=\"fiche-h1\">7. Flyweight</h3><p class=\"fiche-p\">Principe : stocker PLUS d'objets en RAM en PARTAGEANT les états similaires entre plusieurs objets, plutôt que de dupliquer ces données dans chaque instance individuellement.</p><p class=\"fiche-note\">Patron très ciblé (optimisation mémoire), PEU UTILISÉ en pratique et DIFFICILE à mettre en place correctement — bon à connaître pour la culture, moins central que les autres.</p>",
    fiche: "<h3 class=\"fiche-h1\">7 patrons structurels — résumé express</h3><table class=\"fiche-table\"><thead><tr><th>Patron</th><th>Principe en 1 ligne</th></tr></thead><tbody><tr><td>Adapter</td><td>Rendre compatibles 2 interfaces incompatibles (par classe ou par objet)</td></tr><tr><td>Proxy</td><td>Substitut qui contrôle l'accès à l'objet réel (avant/après)</td></tr><tr><td>Composite</td><td>Traiter un groupe d'objets comme un objet individuel (arborescence)</td></tr><tr><td>Décorateur</td><td>Ajouter un comportement dynamiquement via un wrapper (composition, pas héritage)</td></tr><tr><td>Bridge</td><td>Sépare abstraction et implémentation en 2 structures indépendantes</td></tr><tr><td>Façade</td><td>Interface simplifiée sur un système complexe</td></tr><tr><td>Flyweight</td><td>Partager des états similaires pour économiser la RAM</td></tr></tbody></table><h3 class=\"fiche-h1\">Les 3 confusions classiques à l'examen</h3><table class=\"fiche-table\"><thead><tr><th>Confusion</th><th>Différence clé</th></tr></thead><tbody><tr><td>Décorateur vs Composite</td><td>Décorateur = comportement dynamique (composition) ; Composite = structure hiérarchique générique</td></tr><tr><td>Bridge vs Adapter</td><td>Bridge = découplage anticipé À LA CONCEPTION ; Adapter = code glue pour incompatibilité EXISTANTE</td></tr><tr><td>Façade vs Adapter</td><td>Façade = simplifie une interface existante ; Adapter = transforme pour rendre compatible</td></tr></tbody></table><h3 class=\"fiche-h1\">Le moins utilisé</h3><p class=\"fiche-p\">Flyweight : optimisation mémoire ciblée, peu utilisé et difficile à implémenter.</p>",
    corriges: "<p class=\"fiche-note\">Aucune annale d'examen dédiée aux Design Patterns n'a été trouvée dans le ZIP pour PC. Voici des exercices d'entraînement construits à partir des pièges de confusion explicitement soulignés dans le cours — ce sont exactement le type de questions qui tombent dans ce genre d'évaluation (identifier LE bon patron).</p><h3 class=\"fiche-h1\">Exercice 1 — Identifier le bon patron de création</h3><p class=\"fiche-p\">Tu développes une classe de configuration applicative qui doit être lue une seule fois au démarrage et partagée partout dans le code, sans jamais être recréée. Quel patron utiliser, et pourquoi n'est-ce PAS une Factory ?</p><p class=\"fiche-p\"><strong>Corrigé :</strong> Singleton. Une Factory encapsule la création d'objets mais ne garantit ni leur unicité ni leur partage global — elle peut produire un nouvel objet à chaque appel. Le Singleton, lui, se renvoie LUI-MÊME et garantit qu'une seule instance existe dans toute l'application — exactement le besoin ici (config partagée, lue une fois).</p><h3 class=\"fiche-h1\">Exercice 2 — Builder ou Abstract Factory ?</h3><p class=\"fiche-p\">Tu dois construire un objet Pizza avec de nombreux paramètres optionnels (taille, pâte, garnitures, cuisson...) que le client configure un par un avant l'appel final. Autre besoin séparé : produire des familles cohérentes de composants d'interface (bouton + fenêtre + case à cocher) selon le thème (Windows/Mac/Linux). Associe chaque besoin au bon patron.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> Pizza → Builder (composition progressive d'UN objet complexe via chaînage, sans connaître les détails internes). Composants UI par thème → Abstract Factory (produire une FAMILLE d'objets liés entre eux, ici les 3 composants d'un même thème). Rappel du cours : le Builder a un but inverse de l'Abstract Factory — l'un assemble les PARTIES d'un objet, l'autre produit des FAMILLES d'objets complets.</p><h3 class=\"fiche-h1\">Exercice 3 — Décorateur ou Composite ?</h3><p class=\"fiche-p\">(a) Tu veux ajouter dynamiquement des options à un café (lait, sucre, chantilly) sans créer une sous-classe par combinaison possible. (b) Tu modélises un système de fichiers où un Dossier peut contenir des Fichiers ET d'autres Dossiers, et tu veux calculer la taille totale de façon uniforme, peu importe le niveau.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> (a) Décorateur — ajout dynamique de comportement/état via des wrappers successifs (CaféAvecLait, puis CaféAvecLaitEtSucre...), en composition, pas en héritage. (b) Composite — structure arborescente hétérogène (fichiers = feuilles, dossiers = nœuds), traitée de façon uniforme via une interface commune (ex : getTaille()).</p><h3 class=\"fiche-h1\">Exercice 4 — Bridge ou Adapter ?</h3><p class=\"fiche-p\">(a) Ton application existante attend une interface PaiementService, mais tu dois intégrer une librairie tierce de paiement qui expose une API totalement différente et que tu ne peux pas modifier. (b) Dès la conception, tu sépares volontairement la hiérarchie \"Forme\" (Cercle, Carré) de la hiérarchie \"Rendu\" (RenduVectoriel, RenduRaster) pour que les deux évoluent indépendamment.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> (a) Adapter — code \"glue\" résolvant une incompatibilité EXISTANTE avec une librairie externe qu'on ne contrôle pas. (b) Bridge — découplage anticipé DÈS LA CONCEPTION entre deux hiérarchies qui doivent pouvoir évoluer séparément (ce n'est pas une histoire de compatibilité après-coup).</p><h3 class=\"fiche-h1\">Exercice 5 — Stratégie, Commande ou Méthode (Template) ?</h3><p class=\"fiche-p\">(a) Un algorithme de tri doit pouvoir changer d'implémentation (bulle, rapide, fusion) au choix de l'utilisateur, à l'exécution. (b) Une action \"Copier\" doit pouvoir être mise en file d'attente, journalisée, et annulée (undo). (c) Toutes les boissons chaudes (thé, café) suivent les mêmes 4 étapes dans le même ordre, mais l'étape \"infuser\" diffère selon la boisson — cette variation est fixée une fois pour toutes par la sous-classe concernée.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> (a) Stratégie (interchangeable à l'exécution, par composition). (b) Commande (transforme l'action en objet pour permettre file d'attente + undo). (c) Méthode/Template Method (squelette fixe dans la classe mère, étape redéfinie par héritage, figée par sous-classe — statique, pas modifiable à l'exécution).</p><h3 class=\"fiche-h1\">Exercice 6 — Question de synthèse</h3><p class=\"fiche-p\">Explique en une phrase pourquoi le Décorateur et la Stratégie sont souvent confondus, et donne LA différence qui permet de trancher.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> Les deux reposent sur la composition d'objets plutôt que l'héritage, ce qui les rend structurellement proches. La différence est dans l'INTENTION : le Décorateur change l'apparence/le comportement EXTERNE perçu par le client (\"la peau\"), en empilant des enveloppes ; la Stratégie change la LOGIQUE INTERNE d'un traitement (\"les tripes\"), en substituant un algorithme à un autre au sein d'un même contexte.</p>"
  },

    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>9patrons_comportementaux.pdf</li></ul></div><h3 class=\"fiche-h1\">Comparatif des 3 familles de patrons (rappel)</h3><table class=\"fiche-table\"><thead><tr><th>Famille</th><th>Porte sur</th><th>Moment</th></tr></thead><tbody><tr><td>Création (ex : Builder)</td><td>Processus d'instanciation des classes selon des contraintes</td><td>Statique</td></tr><tr><td>Structurels (ex : Composite)</td><td>Relations entre classes pour résoudre des problèmes classiques</td><td>Statique</td></tr><tr><td>Comportementaux (ex : Itérateur)</td><td>Comportements ENTRE les objets</td><td>Dynamique — le plus courant à rencontrer</td></tr></tbody></table><p class=\"fiche-p\">Principe général : les patrons comportementaux traitent des ALGORITHMES de manière dynamique, définissent un modèle de communication/collaboration entre objets, et organisent l'AFFECTATION DES RESPONSABILITÉS entre eux.</p><p class=\"fiche-p\">7 patrons détaillés dans ce cours (\"à savoir\") : Itérateur, Observateur, État, Stratégie, Commande, Visiteur, Méthode (Template Method). 3 autres sont seulement cités sans être détaillés : Chaîne de responsabilité, Médiateur, Mémento.</p><h3 class=\"fiche-h1\">1. Itérateur</h3><p class=\"fiche-p\">Principe : parcourir une liste d'objets SANS connaître sa représentation interne (list, set, etc.) — le code client utilise une interface d'itération uniforme, quelle que soit la structure de données réellement utilisée en interne.</p><h3 class=\"fiche-h1\">2. Observateur</h3><p class=\"fiche-p\">Principe : mettre en place un mécanisme de SOUSCRIPTION permettant à PLUSIEURS objets d'être notifiés des changements d'état d'un autre objet.</p><p class=\"fiche-note\">Exemple cité : RxJS. Très souvent utilisé en IHM (architecture MVC), lié à la notion de RÉACTIVITÉ (voir chapitre dédié).</p><h3 class=\"fiche-h1\">3. État (State)</h3><p class=\"fiche-p\">Principe : modifier le COMPORTEMENT d'un objet après un changement d'état, comme si l'objet changeait littéralement de classe — sans que le code appelant ait besoin de gérer explicitement chaque cas.</p><h3 class=\"fiche-h1\">4. Stratégie (Strategy)</h3><p class=\"fiche-p\">Principe : définir une FAMILLE D'ALGORITHMES, les placer dans des classes séparées, et rendre leurs objets INTERCHANGEABLES — le contexte peut changer d'algorithme à l'exécution sans changer sa propre structure.</p><p class=\"fiche-note\">Remarque du cours (image parlante) : le Décorateur représente la PEAU de l'objet (son enveloppe, ce qu'on voit de l'extérieur), la Stratégie représente ses TRIPES (sa logique interne, ce qu'il fait).</p><h3 class=\"fiche-h1\">5. Commande (Command)</h3><p class=\"fiche-p\">Principe : transformer une action (avec tous ses détails d'exécution) en un OBJET autonome. Cela permet de : paramétrer des méthodes avec des actions différentes, planifier leur exécution, les mettre en file d'attente, et ANNULER (undo) les actions déjà effectuées.</p><h3 class=\"fiche-h1\">Commande vs Stratégie — piège classique</h3><table class=\"fiche-table\"><thead><tr><th></th><th>Commande</th><th>Stratégie</th></tr></thead><tbody><tr><td>Convertit</td><td>Un TRAITEMENT en objet, dont les paramètres deviennent des attributs</td><td>Différentes MANIÈRES de faire la même chose</td></tr><tr><td>Permet</td><td>De différer le lancement du traitement</td><td>De permuter entre algorithmes à l'intérieur d'une classe contexte unique</td></tr></tbody></table><h3 class=\"fiche-h1\">6. Visiteur (Visitor)</h3><p class=\"fiche-p\">Principe : SÉPARER les algorithmes (qui opèrent sur des objets) des objets eux-mêmes sur lesquels ils opèrent — on peut ajouter de nouvelles opérations sans modifier les classes des objets visités.</p><p class=\"fiche-note\">Remarque : le Visiteur peut être vu comme une extension/renforcement du principe de la Commande.</p><h3 class=\"fiche-h1\">7. Méthode (Template Method)</h3><p class=\"fiche-p\">Principe : donner un SQUELETTE D'ALGORITHME dans une classe mère, permettant aux classes FILLES de redéfinir certaines étapes de l'algorithme SANS changer sa structure globale.</p><h3 class=\"fiche-h1\">Méthode (Template) vs Stratégie — piège classique final</h3><table class=\"fiche-table\"><thead><tr><th></th><th>Méthode (Template)</th><th>Stratégie</th></tr></thead><tbody><tr><td>Mécanisme de changement</td><td>Par HIÉRARCHIE (héritage)</td><td>Par COMPOSITION</td></tr><tr><td>Moment</td><td>STATIQUE (fixé à la compilation, via les sous-classes)</td><td>DYNAMIQUE (peut changer à l'exécution)</td></tr></tbody></table>",

    corriges: "<p class=\"fiche-note\">Aucune annale d'examen dédiée aux Design Patterns n'a été trouvée dans le ZIP pour PC. Voici des exercices d'entraînement construits à partir des pièges de confusion explicitement soulignés dans le cours — ce sont exactement le type de questions qui tombent dans ce genre d'évaluation (identifier LE bon patron).</p><h3 class=\"fiche-h1\">Exercice 1 — Identifier le bon patron de création</h3><p class=\"fiche-p\">Tu développes une classe de configuration applicative qui doit être lue une seule fois au démarrage et partagée partout dans le code, sans jamais être recréée. Quel patron utiliser, et pourquoi n'est-ce PAS une Factory ?</p><p class=\"fiche-p\"><strong>Corrigé :</strong> Singleton. Une Factory encapsule la création d'objets mais ne garantit ni leur unicité ni leur partage global — elle peut produire un nouvel objet à chaque appel. Le Singleton, lui, se renvoie LUI-MÊME et garantit qu'une seule instance existe dans toute l'application — exactement le besoin ici (config partagée, lue une fois).</p><h3 class=\"fiche-h1\">Exercice 2 — Builder ou Abstract Factory ?</h3><p class=\"fiche-p\">Tu dois construire un objet Pizza avec de nombreux paramètres optionnels (taille, pâte, garnitures, cuisson...) que le client configure un par un avant l'appel final. Autre besoin séparé : produire des familles cohérentes de composants d'interface (bouton + fenêtre + case à cocher) selon le thème (Windows/Mac/Linux). Associe chaque besoin au bon patron.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> Pizza → Builder (composition progressive d'UN objet complexe via chaînage, sans connaître les détails internes). Composants UI par thème → Abstract Factory (produire une FAMILLE d'objets liés entre eux, ici les 3 composants d'un même thème). Rappel du cours : le Builder a un but inverse de l'Abstract Factory — l'un assemble les PARTIES d'un objet, l'autre produit des FAMILLES d'objets complets.</p><h3 class=\"fiche-h1\">Exercice 3 — Décorateur ou Composite ?</h3><p class=\"fiche-p\">(a) Tu veux ajouter dynamiquement des options à un café (lait, sucre, chantilly) sans créer une sous-classe par combinaison possible. (b) Tu modélises un système de fichiers où un Dossier peut contenir des Fichiers ET d'autres Dossiers, et tu veux calculer la taille totale de façon uniforme, peu importe le niveau.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> (a) Décorateur — ajout dynamique de comportement/état via des wrappers successifs (CaféAvecLait, puis CaféAvecLaitEtSucre...), en composition, pas en héritage. (b) Composite — structure arborescente hétérogène (fichiers = feuilles, dossiers = nœuds), traitée de façon uniforme via une interface commune (ex : getTaille()).</p><h3 class=\"fiche-h1\">Exercice 4 — Bridge ou Adapter ?</h3><p class=\"fiche-p\">(a) Ton application existante attend une interface PaiementService, mais tu dois intégrer une librairie tierce de paiement qui expose une API totalement différente et que tu ne peux pas modifier. (b) Dès la conception, tu sépares volontairement la hiérarchie \"Forme\" (Cercle, Carré) de la hiérarchie \"Rendu\" (RenduVectoriel, RenduRaster) pour que les deux évoluent indépendamment.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> (a) Adapter — code \"glue\" résolvant une incompatibilité EXISTANTE avec une librairie externe qu'on ne contrôle pas. (b) Bridge — découplage anticipé DÈS LA CONCEPTION entre deux hiérarchies qui doivent pouvoir évoluer séparément (ce n'est pas une histoire de compatibilité après-coup).</p><h3 class=\"fiche-h1\">Exercice 5 — Stratégie, Commande ou Méthode (Template) ?</h3><p class=\"fiche-p\">(a) Un algorithme de tri doit pouvoir changer d'implémentation (bulle, rapide, fusion) au choix de l'utilisateur, à l'exécution. (b) Une action \"Copier\" doit pouvoir être mise en file d'attente, journalisée, et annulée (undo). (c) Toutes les boissons chaudes (thé, café) suivent les mêmes 4 étapes dans le même ordre, mais l'étape \"infuser\" diffère selon la boisson — cette variation est fixée une fois pour toutes par la sous-classe concernée.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> (a) Stratégie (interchangeable à l'exécution, par composition). (b) Commande (transforme l'action en objet pour permettre file d'attente + undo). (c) Méthode/Template Method (squelette fixe dans la classe mère, étape redéfinie par héritage, figée par sous-classe — statique, pas modifiable à l'exécution).</p><h3 class=\"fiche-h1\">Exercice 6 — Question de synthèse</h3><p class=\"fiche-p\">Explique en une phrase pourquoi le Décorateur et la Stratégie sont souvent confondus, et donne LA différence qui permet de trancher.</p><p class=\"fiche-p\"><strong>Corrigé :</strong> Les deux reposent sur la composition d'objets plutôt que l'héritage, ce qui les rend structurellement proches. La différence est dans l'INTENTION : le Décorateur change l'apparence/le comportement EXTERNE perçu par le client (\"la peau\"), en empilant des enveloppes ; la Stratégie change la LOGIQUE INTERNE d'un traitement (\"les tripes\"), en substituant un algorithme à un autre au sein d'un même contexte.</p>"

    resume: "<div class=\"fiche-sources\"><strong>📎 PDF associés à ce chapitre :</strong><ul class=\"fiche-ul\"><li>7introduction_DP.pdf</li></ul></div><h3 class=\"fiche-h1\">1. Origines historiques</h3><p class=\"fiche-p\">Le concept de \"patron\" (pattern) vient à l'origine de Christopher ALEXANDER, en ARCHITECTURE DU BÂTIMENT. Erich GAMMA et 3 co-auteurs (le \"Gang of Four\"/GoF) reprennent ce concept pour l'informatique dans le livre fondateur Design Patterns: Elements of Reusable Object-Oriented Software, qui recense 23 patrons de conception orientés objet (à comparer aux 253 patrons identifiés par Alexander en architecture).</p><p class=\"fiche-p\">Points communs à tous les patrons du livre du GoF : un NOM, une description du PROBLÈME, une description de la SOLUTION, un formalisme commun, et les CONSÉQUENCES de son utilisation.</p><h3 class=\"fiche-h1\">2. Qu'est-ce qu'un patron ?</h3><p class=\"fiche-p\">Un patron part d'un problème MÉTIER (ex : un multiplexeur adapté aux télécoms), en tire par ANALYSE une CARACTÉRISATION sous forme d'ensembles de classes assez généraux, pour aboutir à une (bonne) solution de CONCEPTION, réutilisable dans plusieurs styles.</p><p class=\"fiche-note\">Il existe aussi des ANTI-PATTERNS (ex : le Blob, le plat de spaghetti, la roue carrée) qui documentent au contraire de MAUVAISES solutions récurrentes à éviter — voir le chapitre dédié.</p><h3 class=\"fiche-h1\">3. Les patrons dans le cycle d'ingénierie</h3><table class=\"fiche-table\"><thead><tr><th>Étape</th><th>Rôle du patron</th></tr></thead><tbody><tr><td>Analyse (de domaine)</td><td>Aide à construire des modèles objets descriptifs et effectifs.</td></tr><tr><td>Conception</td><td>Identifier, nommer et abstraire des thèmes récurrents (4 étapes).</td></tr><tr><td>Implémentation</td><td>Gérer les manques d'un langage de programmation donné.</td></tr><tr><td>Documentation</td><td>Via UML — diagrammes de classes et de séquences.</td></tr></tbody></table><h3 class=\"fiche-h1\">4. Le formalisme des patrons (structure d'une fiche GoF)</h3><p class=\"fiche-p\">Chaque patron du livre de Gamma et al. est documenté selon un formalisme fixe, en plusieurs parties :</p><table class=\"fiche-table\"><thead><tr><th>Rubrique</th><th>Contenu</th></tr></thead><tbody><tr><td>Nom + Connu Comme</td><td>Identification du patron, éventuels autres noms utilisés.</td></tr><tr><td>Intention</td><td>Ce que résout le patron, en une phrase.</td></tr><tr><td>Motivation</td><td>Un exemple informel illustré (souvent avec un diagramme de séquence), montrant un scénario d'utilisation favorable.</td></tr><tr><td>Application</td><td>Quand utiliser ce patron.</td></tr><tr><td>Structure</td><td>Diagramme de classes formel + classes/objets qui interviennent.</td></tr><tr><td>Participants / Collaborations</td><td>Les constituants et comment ils collaborent entre eux.</td></tr><tr><td>Conséquences</td><td>Ce qu'apporte le modèle, son coût de mise en œuvre, ses contre-indications, son impact sur le comportement de l'application.</td></tr><tr><td>Implantation</td><td>Détails techniques, pièges classiques, idiomes de langage.</td></tr><tr><td>Échantillon de code</td><td>Exemples concrets (souvent tirés du livre ou d'exemples classiques).</td></tr><tr><td>Utilisations remarquables</td><td>Exemples connus d'utilisation du patron.</td></tr><tr><td>Patrons apparentés</td><td>Renvoie vers d'autres patrons du GoF, en explicitant similarités et différences, et lesquels peuvent être combinés.</td></tr></tbody></table><h3 class=\"fiche-h1\">5. Comment utiliser un patron — méthode en 7 étapes (Gamma)</h3><ul class=\"fiche-ul\"><li>1. Lire le modèle en entier une première fois.</li><li>2. Revenir aux structures constituantes (participants, collaborations).</li><li>3. Regarder la section exemple de code.</li><li>4. Choisir des noms qui ont du sens pour les constituants dans VOTRE contexte.</li><li>5. Définir les classes.</li><li>6. Définir les opérations des modèles.</li><li>7. Implémenter les classes et les opérations.</li></ul><p class=\"fiche-p\">Attention aux idiomes de langage : un patron doit parfois être ADAPTÉ techniquement selon le langage cible.</p><p class=\"fiche-note\">Exemple donné en cours : implémenter un patron nécessitant un contrôle strict de la création d'objet demande d'ajouter manuellement de la SYNCHRONISATION en Java (via des mutex, pour un usage multi-thread), alors qu'en C#/.NET d'autres constructions natives du langage peuvent gérer cela plus directement — le coût d'adaptation d'un même patron varie donc selon le langage.</p><h3 class=\"fiche-h1\">6. Utilisation réelle en entreprise</h3><ul class=\"fiche-ul\"><li>Architecture d'entreprise : définition de patrons PROPRES à l'organisation (au-delà des 23 patrons du GoF).</li><li>Via UML : génération de code à partir des diagrammes UML dans les IDE modernes, en s'appuyant directement sur la structure des patrons.</li></ul><h3 class=\"fiche-h1\">7. La classification en 3 familles — LA base du reste du cours</h3><table class=\"fiche-table\"><thead><tr><th>Famille</th><th>Répond à la question</th></tr></thead><tbody><tr><td>Création (Creational)</td><td>Comment CRÉER des objets de façon flexible/découplée ?</td></tr><tr><td>Structurels (Structural)</td><td>Comment COMPOSER des classes ou des objets entre eux ?</td></tr><tr><td>Comportementaux (Behavioral)</td><td>Comment les classes/objets INTERAGISSENT et se répartissent les responsabilités ?</td></tr></tbody></table><p class=\"fiche-note\">Cette classification en 3 familles structure directement les 3 chapitres suivants du cours (Patrons de création, Patrons structurels, Patrons comportementaux).</p>",
